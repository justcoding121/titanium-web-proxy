name: .NET

on:
  push:
    branches:
        - develop
        - beta
        - stable
  pull_request:
    branches:
        - develop
        - beta
        - stable
      
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    - name: Install SonarScanner
      if: env.SONAR_TOKEN != ''
      shell: pwsh
      run: dotnet tool install --tool-path .sonar/scanner dotnet-sonarscanner

    - name: Install coverage tool
      shell: pwsh
      run: dotnet tool install --tool-path .coverage/tools dotnet-coverage

    - name: Install DocFX
      if: github.ref == 'refs/heads/develop'
      run: choco install docfx -y

    - name: Restore
      run: dotnet restore src/Titanium.Web.Proxy.sln --warnaserror

    - name: Build
      run: dotnet build src/Titanium.Web.Proxy.sln --configuration Release --no-restore --warnaserror

    - name: Begin SonarCloud analysis
      if: env.SONAR_TOKEN != ''
      shell: pwsh
      run: >
        .\.sonar\scanner\dotnet-sonarscanner begin
        /k:"justcoding121_titanium-web-proxy"
        /o:"justcoding121"
        /d:sonar.token="$env:SONAR_TOKEN"
        /d:sonar.cs.vscoveragexml.reportsPaths="coverage/coverage.xml"
        /d:sonar.exclusions="**/docs/**,**/examples/**,**/benchmarks/**,**/tools/**"
        /d:sonar.coverage.exclusions="**/examples/**,**/benchmarks/**,**/docs/**,**/Certificates/Makers/WinCertificateMaker.cs,**/Network/WinAuth/**,**/Handlers/WinAuthHandler.cs"

    - name: Build for SonarCloud analysis
      if: env.SONAR_TOKEN != ''
      run: dotnet build src/Titanium.Web.Proxy.sln --configuration Release --no-restore --no-incremental --disable-build-servers

    - name: Test
      shell: pwsh
      run: |
        dotnet test tests/Titanium.Web.Proxy.UnitTests/Titanium.Web.Proxy.UnitTests.csproj --configuration Release --no-build --no-restore --collect:"Code Coverage" --results-directory coverage/unit
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        # The integration suite spins up real listening sockets and TLS handshakes, which
        # occasionally hang or get "connection refused" on shared, resource-constrained CI
        # runners under connection bursts (a pre-existing, environment-dependent flake, not
        # specific to any particular test). Retry a couple of times before failing the build.
        $maxAttempts = 3
        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          Write-Output "Integration tests attempt $attempt of $maxAttempts"
          dotnet test tests/Titanium.Web.Proxy.IntegrationTests/Titanium.Web.Proxy.IntegrationTests.csproj --configuration Release --no-build --no-restore --filter "TestCategory!=Slow" --blame-hang --blame-hang-timeout 5m --collect:"Code Coverage" --results-directory "coverage/integration/attempt-$attempt"
          if ($LASTEXITCODE -eq 0) { break }
          if ($attempt -eq $maxAttempts) { exit $LASTEXITCODE }
          Write-Output "Integration tests failed on attempt $attempt, retrying..."
          Start-Sleep -Seconds 5
        }

    - name: Merge code coverage
      shell: pwsh
      run: .\.coverage\tools\dotnet-coverage merge "coverage\**\*.coverage" --output coverage/coverage.xml --output-format xml

    - name: Complete SonarCloud analysis
      if: env.SONAR_TOKEN != ''
      shell: pwsh
      run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

    - name: Update Documentation
      if: github.ref == 'refs/heads/develop'
      run: docfx .github/docfx.json

    - name: Publish Documentation
      if: github.ref == 'refs/heads/develop'
      uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
      with:
        default_author: github_actions
        message: Update documentation
        committer_name: GitHub Actions
        committer_email: actions@github.com
        # Only commit DocFX output — never Sonar/coverage/tool install artifacts
        add: 'docs'

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/stable')
    needs: build
    runs-on: windows-latest
    environment: nuget-publish
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    - name: Pack Beta
      if: github.ref == 'refs/heads/beta'
      run: dotnet pack src/Titanium.Web.Proxy/Titanium.Web.Proxy.csproj --configuration Release --version-suffix "beta"

    - name: Pack Stable
      if: github.ref == 'refs/heads/stable'
      run: dotnet pack src/Titanium.Web.Proxy/Titanium.Web.Proxy.csproj --configuration Release

    - name: Log in to NuGet
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish Package
      run: dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: pwsh
      run: |
        $nupkg = Get-ChildItem -Recurse -Filter *.nupkg |
          Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
          Select-Object -First 1
        if (-not $nupkg) { throw "No nupkg found to attach to the GitHub release." }

        # Titanium.Web.Proxy.3.2.3-beta.nupkg -> 3.2.3-beta
        $version = $nupkg.BaseName -replace '^Titanium\.Web\.Proxy\.', ''
        $isPrerelease = $version -match '-'

        gh release view $version 2>$null
        if ($LASTEXITCODE -eq 0) {
          Write-Output "Release $version already exists; uploading package."
          gh release upload $version $nupkg.FullName --clobber
        }
        else {
          $createArgs = @(
            'release', 'create', $version, $nupkg.FullName,
            '--title', $version,
            '--generate-notes',
            '--target', $env:GITHUB_SHA
          )
          if ($isPrerelease) { $createArgs += '--prerelease' }
          gh @createArgs
        }
