name: .NET

on:
  push:
    branches:
        - develop
        - beta
        - stable
    paths-ignore:
      - 'website/**'
      - 'wiki/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/deploy-website.yml'
      - '.github/dns/**'
  pull_request:
    branches:
        - develop
        - beta
        - stable
    paths-ignore:
      - 'website/**'
      - 'wiki/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/deploy-website.yml'
      - '.github/dns/**'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    - name: Install SonarScanner
      if: env.SONAR_TOKEN != ''
      shell: pwsh
      run: dotnet tool install --tool-path .sonar/scanner dotnet-sonarscanner

    - name: Install coverage tool
      shell: pwsh
      run: dotnet tool install --tool-path .coverage/tools dotnet-coverage

    - name: Install DocFX
      if: github.ref == 'refs/heads/develop'
      shell: pwsh
      run: |
        # Prefer the .NET tool over Chocolatey: choco's docfx package downloads an old
        # GitHub release zip that intermittently 500s and blocks Sonar/coverage on develop.
        dotnet tool install --global docfx
        Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

    - name: Restore
      run: dotnet restore src/Titanium.Web.Proxy.sln --warnaserror

    - name: Build
      run: dotnet build src/Titanium.Web.Proxy.sln --configuration Release --no-restore --warnaserror

    - name: Begin SonarCloud analysis
      if: env.SONAR_TOKEN != ''
      shell: pwsh
      run: >
        .\.sonar\scanner\dotnet-sonarscanner begin
        /k:"justcoding121_titanium-web-proxy"
        /o:"justcoding121"
        /d:sonar.token="$env:SONAR_TOKEN"
        /d:sonar.cs.vscoveragexml.reportsPaths="coverage/coverage.xml"
        /d:sonar.exclusions="**/docs/**,**/examples/**,**/benchmarks/**,**/tools/**,**/*.axaml,**/website/**,**/.github/**"
        /d:sonar.coverage.exclusions="**/examples/**,**/benchmarks/**,**/docs/**,**/Http3/Http3OriginBridge.cs,**/Http3/Http3OriginClientSession.cs,**/Titanium.Plus/Dashboard/**,**/Titanium.Inspector/Views/**,**/Titanium.Inspector/Services/AppContainerLoopback.cs,**/Titanium.Inspector/App.axaml.cs,**/Titanium.Inspector/Program.cs,**/Titanium.Inspector/InspectorAppFactory.cs,**/Titanium.Inspector/Services/UpdateService.cs,**/Titanium.Cli/Program.cs,**/Titanium.Cli/AsyncConsole.cs,**/Titanium.Cli/Http3/Http3DepsCommand.cs,**/Titanium.Cli/Updates/VersionAndUpdateCommands.cs,**/Titanium.Cli/Certificates/CertificateBootstrap.cs,**/Titanium.Plus/Discovery/**,**/Titanium.Plus/Security/**,**/Titanium.Plus/State/**,**/Titanium.Plus/Resilience/**,**/Titanium.Plus/PlusLog.cs,**/Titanium.Web.Proxy/Helpers/LinuxSystemProxyBackend.cs,**/Titanium.Web.Proxy/Helpers/MacOsSystemProxyBackend.cs"

    - name: Build for SonarCloud analysis
      if: env.SONAR_TOKEN != ''
      run: dotnet build src/Titanium.Web.Proxy.sln --configuration Release --no-restore --no-incremental --disable-build-servers

    - name: Test
      shell: pwsh
      run: |
        dotnet test tests/Titanium.Web.Proxy.UnitTests/Titanium.Web.Proxy.UnitTests.csproj --configuration Release --no-build --no-restore --collect:"Code Coverage" --results-directory coverage/unit
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        # Additional MIT + NC unit suites (coverage merged below)
        dotnet test tests/Titanium.Web.Proxy.Configuration.Tests/Titanium.Web.Proxy.Configuration.Tests.csproj --configuration Release --no-build --no-restore --collect:"Code Coverage" --results-directory coverage/configuration
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test tests/Titanium.Plus.Tests/Titanium.Plus.Tests.csproj --configuration Release --no-build --no-restore --collect:"Code Coverage" --results-directory coverage/plus
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test tests/Titanium.Inspector.Tests/Titanium.Inspector.Tests.csproj --configuration Release --no-build --no-restore --collect:"Code Coverage" --results-directory coverage/inspector
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test tests/Titanium.Cli.Tests/Titanium.Cli.Tests.csproj --configuration Release --no-build --no-restore --collect:"Code Coverage" --results-directory coverage/cli
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test tests/Titanium.E2E.Tests/Titanium.E2E.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=E2E|TestCategory=E2E-UI" --collect:"Code Coverage" --results-directory coverage/e2e
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        # The integration suite spins up real listening sockets and TLS handshakes, which
        # occasionally hang or get "connection refused" on shared, resource-constrained CI
        # runners under connection bursts (a pre-existing, environment-dependent flake, not
        # specific to any particular test). Retry a couple of times before failing the build.
        $maxAttempts = 2
        for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
          Write-Output "Integration tests attempt $attempt of $maxAttempts"
          dotnet test tests/Titanium.Web.Proxy.IntegrationTests/Titanium.Web.Proxy.IntegrationTests.csproj --configuration Release --no-build --no-restore --filter "TestCategory!=Slow" --blame-hang --blame-hang-timeout 5m --collect:"Code Coverage" --results-directory "coverage/integration/attempt-$attempt"
          if ($LASTEXITCODE -eq 0) { break }
          if ($attempt -eq $maxAttempts) { exit $LASTEXITCODE }
          Write-Output "Integration tests failed on attempt $attempt, retrying..."
          Start-Sleep -Seconds 5
        }

    - name: Merge code coverage
      shell: pwsh
      run: .\.coverage\tools\dotnet-coverage merge "coverage\**\*.coverage" --output coverage/coverage.xml --output-format xml

    - name: Complete SonarCloud analysis
      if: env.SONAR_TOKEN != ''
      shell: pwsh
      run: .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

    - name: Update Documentation
      if: github.ref == 'refs/heads/develop'
      run: docfx .github/docfx.json

    - name: Publish Documentation
      if: github.ref == 'refs/heads/develop'
      uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
      with:
        default_author: github_actions
        message: Update documentation
        committer_name: GitHub Actions
        committer_email: actions@github.com
        # Only commit DocFX output ó never Sonar/coverage/tool install artifacts
        add: 'docs'
        # DocFX often races another develop push; rebase instead of failing the job.
        pull: '--rebase --autostash'

  # Cross-OS Inspector + Plus dashboard UI gates (Headless / Visual / Playwright).
  # Inspector unit suite stays on Windows `build` only ù do not re-run it here.
  ui-portable:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
    - name: Linux UI fonts + Playwright OS deps
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-liberation libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64 || sudo apt-get install -y fonts-liberation libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2
    - name: Restore
      run: dotnet restore src/Titanium.Web.Proxy.sln
    - name: Build
      run: dotnet build src/Titanium.Web.Proxy.sln --configuration Release --no-restore
    - name: Install Playwright Chromium
      shell: pwsh
      run: |
        $pw = Join-Path (Resolve-Path "tests/Titanium.E2E.Tests/bin/Release/net10.0") "playwright.ps1"
        if (-not (Test-Path $pw)) {
          # Ensure test project is built so playwright.ps1 is in output
          dotnet build tests/Titanium.E2E.Tests/Titanium.E2E.Tests.csproj -c Release --no-restore
          $pw = Join-Path (Resolve-Path "tests/Titanium.E2E.Tests/bin/Release/net10.0") "playwright.ps1"
        }
        & $pw install chromium
    - name: E2E-UI ViewModel smoke
      run: |
        dotnet test tests/Titanium.E2E.Tests/Titanium.E2E.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=E2E-UI"
    - name: Inspector Headless + Visual + Plus Playwright
      run: |
        dotnet test tests/Titanium.E2E.Tests/Titanium.E2E.Tests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=E2E-UI-Headless|TestCategory=E2E-UI-Visual|TestCategory=E2E-UI-Plus-Dashboard"
    - name: OS proxy-backend filters
      run: |
        dotnet test tests/Titanium.Web.Proxy.UnitTests/Titanium.Web.Proxy.UnitTests.csproj --configuration Release --no-build --no-restore --filter "FullyQualifiedName~UnixProxyBypassMapperTests|FullyQualifiedName~MacOsSystemProxyBackendTests|FullyQualifiedName~LinuxSystemProxyBackendTests|FullyQualifiedName~ElevationPromptCancelTests|FullyQualifiedName~SystemProxyBackendFactoryPlatformTests"
    - name: Inspector E2E-UI Linux platform
      if: runner.os == 'Linux'
      run: |
        dotnet test tests/Titanium.Web.Proxy.UnitTests/Titanium.Web.Proxy.UnitTests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=E2E-UI-Linux"
    - name: Inspector E2E-UI macOS platform + publish smoke
      if: runner.os == 'macOS'
      run: |
        dotnet test tests/Titanium.Web.Proxy.UnitTests/Titanium.Web.Proxy.UnitTests.csproj --configuration Release --no-build --no-restore --filter "TestCategory=E2E-UI-Mac|FullyQualifiedName~MacOsSystemProxyBackendTests|FullyQualifiedName~UnixProxyBypassMapperTests"
        rid=$(dotnet --info | awk '/RID:/ {print $2; exit}')
        if [ -z "$rid" ]; then rid=osx-arm64; fi
        dotnet publish src/Titanium.Inspector/Titanium.Inspector.csproj -c Release -r "$rid" --self-contained true -o "./artifacts/inspector-$rid"
        test -f "./artifacts/inspector-$rid/TitaniumInspector" || test -f "./artifacts/inspector-$rid/Titanium.Inspector"
    - name: Upload UI failure artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ui-portable-${{ matrix.os }}
        path: |
          tests/Titanium.E2E.Tests/TestResults/**
          **/test-results/**
          **/playwright-report/**
        if-no-files-found: ignore

  # Tiered RPS gate for beta/stable publish (editions). Spot runs on PRs via rps-saturation.yml.
  rps-publish-gate:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/stable')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x
    - name: compare-editions (publish gate)
      shell: pwsh
      run: |
        # Stable tags additionally require compare-product PASS via release.yml on that SHA.
        pwsh tools/RpsLoadProbe/run-rps.ps1 `
          -Mode compare-editions `
          -Concurrency '8,16,32,64' `
          -WarmupSec 2 `
          -DurationSec 8 `
          -Repeats 1 `
          -ResultsDir tools/RpsLoadProbe/results `
          -BombardierCheck
        $csv = Get-ChildItem tools/RpsLoadProbe/results -Filter 'rps-ramp-*.csv' |
          Sort-Object LastWriteTime -Descending | Select-Object -First 1
        if (-not $csv) { throw 'No CSV found for edition gate validation' }
        pwsh tools/RpsLoadProbe/validate-edition-gates.ps1 -CsvPath $csv.FullName

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/stable')
    needs: [build, ui-portable, rps-publish-gate]
    runs-on: windows-latest
    environment: nuget-publish
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          10.0.x

    - name: Pack Beta
      if: github.ref == 'refs/heads/beta'
      run: |
        dotnet pack src/Titanium.Web.Proxy.Abstractions/Titanium.Web.Proxy.Abstractions.csproj --configuration Release --version-suffix "beta"
        dotnet pack src/Titanium.Web.Proxy.Configuration/Titanium.Web.Proxy.Configuration.csproj --configuration Release --version-suffix "beta"
        dotnet pack src/Titanium.Web.Proxy/Titanium.Web.Proxy.csproj --configuration Release --version-suffix "beta"

    - name: Pack Stable
      if: github.ref == 'refs/heads/stable'
      run: |
        dotnet pack src/Titanium.Web.Proxy.Abstractions/Titanium.Web.Proxy.Abstractions.csproj --configuration Release
        dotnet pack src/Titanium.Web.Proxy.Configuration/Titanium.Web.Proxy.Configuration.csproj --configuration Release
        dotnet pack src/Titanium.Web.Proxy/Titanium.Web.Proxy.csproj --configuration Release

    - name: Log in to NuGet
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Publish Package
      # MIT packages only ó never push Titanium.Plus or Titanium.Inspector
      run: |
        Get-ChildItem -Recurse -Filter *.nupkg |
          Where-Object { $_.Name -notlike '*Plus*' -and $_.Name -notlike '*Inspector*' -and $_.Name -notlike '*.symbols.nupkg' } |
          ForEach-Object {
            dotnet nuget push $_.FullName `
              --source https://api.nuget.org/v3/index.json `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --skip-duplicate
          }

  # Product zips stay on release.yml (v* tags). After beta/stable merge, create/move the
  # version tag and dispatch release.yml (GITHUB_TOKEN tag pushes do not re-trigger workflows).
  cut-product-tag:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/beta' || github.ref == 'refs/heads/stable')
    needs: [build, ui-portable, rps-publish-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Create/move product tag and dispatch release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        PREFIX=$(grep -oP '(?<=<VersionPrefix>)[^<]+' src/Titanium.Web.Proxy/Titanium.Web.Proxy.csproj | head -n1)
        if [[ -z "$PREFIX" ]]; then echo "VersionPrefix not found"; exit 1; fi
        CHANNEL=stable
        VERSION="$PREFIX"
        if [[ "${{ github.ref }}" == "refs/heads/beta" ]]; then
          CHANNEL=beta
          VERSION="${PREFIX}-beta"
        fi
        TAG="v${VERSION}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -f -a "$TAG" -m "$TAG" "$GITHUB_SHA"
        git push origin "refs/tags/$TAG" --force
        echo "Dispatching product release for $TAG (channel=$CHANNEL) at $GITHUB_SHA"
        gh workflow run release.yml --ref "$GITHUB_REF_NAME" -f channel="$CHANNEL"

