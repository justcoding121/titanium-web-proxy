name: .NET

on:
  push:
    branches:
        - develop
        - beta
        - stable
  pull_request:
    branches:
        - develop
        - beta
        - stable
      
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Install DocFX
      if: github.ref == 'refs/heads/develop'
      run: choco install docfx -y

    - name: Build 
      run: dotnet build src/Titanium.Web.Proxy/Titanium.Web.Proxy.csproj --configuration Release

    - name: Test 
      shell: pwsh
      run: |
        .\.github\install-unit-test-certificate.ps1
        dotnet test tests/Titanium.Web.Proxy.UnitTests/Titanium.Web.Proxy.UnitTests.csproj --configuration Release
        dotnet test tests/Titanium.Web.Proxy.IntegrationTests/Titanium.Web.Proxy.IntegrationTests.csproj --configuration Release

    - name: Update Documentation
      if: github.ref == 'refs/heads/develop'
      run: docfx .github/docfx.json

    - name: Publish Documentation
      if: github.ref == 'refs/heads/develop'
      uses: EndBug/add-and-commit@v9
      with:
        default_author: github_actions
        message: Update documentation
        committer_name: GitHub Actions
        committer_email: actions@github.com

    - name: Publish Beta
      if: github.ref == 'refs/heads/beta'
      run: |
       dotnet pack src/Titanium.Web.Proxy/Titanium.Web.Proxy.csproj --configuration Release --version-suffix "beta"
       dotnet nuget push **\*.nupkg -s "nuget" -k "${{ secrets.NUGET_TOKEN }}"

    - name: Publish Stable
      if: github.ref == 'refs/heads/stable'
      run: |
       dotnet pack src/Titanium.Web.Proxy/Titanium.Web.Proxy.csproj --configuration Release
       dotnet nuget push **\*.nupkg -s "nuget" -k "${{ secrets.NUGET_TOKEN }}"
