# Validate Flatpak manifests + Homebrew formula against a published release tag.
# Used for beta dry-run before stable catalog submit.
name: packaging-catalog-smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub release tag (e.g. v7.0.4-beta or v7.0.5)'
        required: true
        type: string
      run_flatpak:
        description: 'Build Flatpak manifests with flatpak-builder'
        required: true
        type: boolean
        default: true
      run_homebrew:
        description: 'Smoke brew install from in-repo formula'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  flatpak:
    if: inputs.run_flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Install flatpak-builder + Freedesktop 24.08
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: flatpak-builder Inspector
        run: |
          set -euo pipefail
          flatpak-builder --user --force-clean /tmp/ti-inspector-build \
            tools/packaging/flatpak/io.github.justcoding121.TitaniumInspector.yml

  homebrew:
    if: inputs.run_homebrew
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Smoke brew install from tap
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          FORMULA=tools/packaging/homebrew/titanium.rb
          test -f "$FORMULA"
          # Formula version must match tag without leading v (e.g. 7.0.4-beta).
          EXPECTED="${RELEASE_TAG#v}"
          grep -q "version \"$EXPECTED\"" "$FORMULA"
          # Homebrew rejects bare paths; install via the published custom tap (kept in sync).
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew tap justcoding121/titanium
          brew update || true
          # Prefer in-repo formula content for the version under test by copying into a local tap.
          LOCAL_TAP="$(brew --repository)/Library/Taps/justcoding121/homebrew-titanium"
          mkdir -p "${LOCAL_TAP}/Formula"
          cp "$FORMULA" "${LOCAL_TAP}/Formula/titanium.rb"
          brew install --formula justcoding121/titanium/titanium
          titanium version
          brew test justcoding121/titanium/titanium
          brew uninstall --formula justcoding121/titanium/titanium || true
