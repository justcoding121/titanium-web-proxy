name: kubernetes-smoke

# Installs Helm charts into kind and checks probes, traffic, and chart-specific behavior.
# Nightly, on demand, and on a pull request that carries the `k8s-smoke` label.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
    branches:
      - develop
      - beta
      - stable

permissions:
  contents: read

concurrency:
  group: kubernetes-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  titanium:
    # On pull requests, only when the label is present (a later push re-runs it while the label stays).
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'k8s-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NS: twp-smoke
      REL: twp
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/packaging/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: titanium-web-proxy:ci
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha

      - uses: helm/kind-action@v1
        with:
          cluster_name: twp

      - name: Load the image and start a throwaway backend
        run: |
          set -euo pipefail
          kind load docker-image titanium-web-proxy:ci --name twp
          kubectl create namespace "$NS"
          kubectl -n "$NS" create deployment backend --image=nginx:1.27-alpine --port=80
          kubectl -n "$NS" expose deployment backend --port=80
          kubectl -n "$NS" rollout status deployment/backend --timeout=120s

      - name: helm install
        run: |
          set -euo pipefail
          helm install "$REL" deploy/helm/titanium -n "$NS" \
            -f deploy/helm/titanium/ci/smoke-values.yaml \
            --set serviceMonitor.enabled=false --set admin.service.enabled=true \
            --wait --timeout 180s

      - name: Probes, auth, and traffic
        run: |
          set -euo pipefail
          TOKEN="$(kubectl -n "$NS" get secret "${REL}-titanium-admin" -o jsonpath='{.data.admin-token}' | base64 -d)"
          kubectl -n "$NS" port-forward "svc/${REL}-titanium-admin" 19901:9901 &
          kubectl -n "$NS" port-forward "svc/${REL}-titanium" 18080:8080 &
          sleep 3
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19901/healthz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19901/readyz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:19901/metrics)" = "401"
          curl -fsS -H "Authorization: Bearer ${TOKEN}" http://127.0.0.1:19901/metrics | head -n 5
          curl -fsS -H "Authorization: Bearer ${TOKEN}" http://127.0.0.1:19901/version
          # A request through the proxy reaches the backend.
          curl -fsS http://127.0.0.1:18080/ | grep -qi 'nginx'
          kill %1 %2 || true

      - name: ConfigMap update is reloaded in place (no restart)
        run: |
          set -euo pipefail
          before="$(kubectl -n "$NS" get pods -l app.kubernetes.io/instance="$REL" -o jsonpath='{range .items[*]}{.metadata.name}={.status.containerStatuses[0].restartCount} {end}')"
          helm upgrade "$REL" deploy/helm/titanium -n "$NS" \
            -f deploy/helm/titanium/ci/smoke-values.yaml \
            --set admin.service.enabled=true \
            --set 'config.logging.minimumLevel=Warning' \
            --wait --timeout 180s
          # kubelet refreshes ConfigMap volumes on its sync period (up to about 90 seconds).
          for i in $(seq 1 45); do
            reloaded=0
            for pod in $(kubectl -n "$NS" get pods -l app.kubernetes.io/instance="$REL" -o name); do
              if kubectl -n "$NS" logs "$pod" | grep -q 'Config reloaded\.'; then reloaded=$((reloaded + 1)); fi
            done
            [[ "$reloaded" -ge 2 ]] && break
            sleep 5
          done
          test "$reloaded" -ge 2 || { kubectl -n "$NS" logs -l app.kubernetes.io/instance="$REL" --tail=50; exit 1; }
          after="$(kubectl -n "$NS" get pods -l app.kubernetes.io/instance="$REL" -o jsonpath='{range .items[*]}{.metadata.name}={.status.containerStatuses[0].restartCount} {end}')"
          echo "before: $before"; echo "after:  $after"
          test "$before" = "$after"

      - name: Rolling restart drops no requests
        run: |
          set -euo pipefail
          # An in-cluster client sends 10 requests a second through the Service for about a minute.
          kubectl -n "$NS" run loader --image=curlimages/curl:8.11.1 --restart=Never --command -- sh -c \
            'fail=0; i=0; while [ $i -lt 600 ]; do i=$((i+1)); curl -fsS -o /dev/null --max-time 2 "http://'"${REL}"'-titanium:8080/" || fail=$((fail+1)); sleep 0.1; done; echo "FAILS=$fail"; [ "$fail" -eq 0 ]'
          kubectl -n "$NS" wait --for=condition=Ready pod/loader --timeout=60s || true
          sleep 5
          kubectl -n "$NS" rollout restart "deployment/${REL}-titanium"
          kubectl -n "$NS" rollout status "deployment/${REL}-titanium" --timeout=180s
          kubectl -n "$NS" wait --for=jsonpath='{.status.phase}'=Succeeded pod/loader --timeout=180s \
            || { kubectl -n "$NS" logs loader || true; exit 1; }
          kubectl -n "$NS" logs loader | tail -n 3

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n "$NS" get all,cm,pdb || true
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" logs -l app.kubernetes.io/instance="$REL" --tail=100 || true

  gateway:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'k8s-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GW_NS: gateway-system
      APP_NS: gw-smoke
      REL: titanium-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build proxy and gateway images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/packaging/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: titanium-web-proxy:ci
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: Build the gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/packaging/docker/Dockerfile.gateway
          platforms: linux/amd64
          load: true
          push: false
          tags: titanium-gateway:ci
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha

      - uses: helm/kind-action@v1
        with:
          cluster_name: twp-gateway

      - name: Load images and backend
        run: |
          set -euo pipefail
          kind load docker-image titanium-web-proxy:ci titanium-gateway:ci --name twp-gateway
          kubectl create namespace "$APP_NS"
          kubectl -n "$APP_NS" create deployment backend --image=nginx:1.27-alpine --port=80
          kubectl -n "$APP_NS" expose deployment backend --port=80
          kubectl -n "$APP_NS" rollout status deployment/backend --timeout=120s

      - name: helm install titanium-gateway
        run: |
          set -euo pipefail
          helm install "$REL" deploy/helm/titanium-gateway --namespace "$GW_NS" --create-namespace \
            -f deploy/helm/titanium-gateway/ci/kind-values.yaml \
            --wait --timeout 5m
          kubectl -n "$GW_NS" wait gatewayclass/titanium --for=condition=Accepted --timeout=120s

      - name: Gateway API route and Ingress with titanium.io annotation
        run: |
          set -euo pipefail
          cat <<'YAML' | kubectl apply -f -
          apiVersion: gateway.networking.k8s.io/v1
          kind: Gateway
          metadata:
            name: web
            namespace: gw-smoke
          spec:
            gatewayClassName: titanium
            listeners:
              - name: http
                port: 80
                protocol: HTTP
                allowedRoutes:
                  namespaces:
                    from: Same
          ---
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: web
            namespace: gw-smoke
          spec:
            parentRefs:
              - name: web
            hostnames:
              - app.test
            rules:
              - backendRefs:
                  - name: backend
                    port: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: shop
            namespace: gw-smoke
            annotations:
              titanium.io/proxy-read-timeout: "30"
          spec:
            ingressClassName: titanium
            rules:
              - host: shop.test
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: backend
                          port:
                            number: 80
          YAML

          for i in $(seq 1 60); do
            programmed="$(kubectl -n gw-smoke get gateway web -o jsonpath='{.status.conditions[?(@.type=="Programmed")].status}' 2>/dev/null || true)"
            [[ "$programmed" == "True" ]] && break
            sleep 5
          done
          test "$programmed" = "True" || { kubectl -n gw-smoke describe gateway web; exit 1; }

          kubectl -n "$GW_NS" port-forward "svc/${REL}-data" 28080:80 &
          pf=$!
          sleep 3
          curl -fsS -H 'Host: app.test' http://127.0.0.1:28080/ | grep -qi nginx
          curl -fsS -H 'Host: shop.test' http://127.0.0.1:28080/ | grep -qi nginx
          kill "$pf" || true

          kubectl -n "$GW_NS" port-forward deployment/${REL}-controller 28081:8081 &
          pf2=$!
          sleep 2
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:28081/healthz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:28081/readyz)" = "200"
          kill "$pf2" || true

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get all -n "$GW_NS" || true
          kubectl get all -n "$APP_NS" || true
          kubectl -n "$GW_NS" logs -l app.kubernetes.io/component=controller --tail=100 || true
          kubectl -n "$GW_NS" logs -l app.kubernetes.io/component=data-plane --tail=100 || true

  manager:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'k8s-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NS: mgr-smoke
      REL: twp-mgr
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Build the manager image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/packaging/docker/Dockerfile.manager
          platforms: linux/amd64
          load: true
          push: false
          tags: titanium-manager:ci
          build-args: |
            VERSION=0.0.0-ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha

      - uses: helm/kind-action@v1
        with:
          cluster_name: twp-manager

      - name: Load the image and helm install
        run: |
          set -euo pipefail
          kind load docker-image titanium-manager:ci --name twp-manager
          kubectl create namespace "$NS"
          helm install "$REL" deploy/helm/titanium-manager -n "$NS" \
            -f deploy/helm/titanium-manager/ci/smoke-values.yaml \
            --wait --timeout 5m

      - name: Health and admin token
        run: |
          set -euo pipefail
          TOKEN="$(kubectl -n "$NS" get secret "${REL}-admin" -o jsonpath='{.data.admin-token}' | base64 -d)"
          test -n "$TOKEN"
          kubectl -n "$NS" port-forward "svc/${REL}-titanium-manager" 27700:7700 &
          pf=$!
          sleep 3
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:27700/v1/healthz)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" http://127.0.0.1:27700/v1/fleets)" = "200"
          kill "$pf" || true

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n "$NS" get all,pvc,secret || true
          kubectl -n "$NS" describe pods || true
          kubectl -n "$NS" logs -l app.kubernetes.io/instance="$REL" --tail=100 || true
