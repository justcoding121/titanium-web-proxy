# Throwaway diagnostic for #1298: which overlay strategy leaves a runnable
# signed Mach-O after in-place update (with and without a process holding the binary).
# workflow_dispatch only; not a required check. Delete after #1298 closes.
name: macos-cli-overlay-diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay-diag:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
      - name: Publish CLI (osx-arm64)
        shell: bash
        run: |
          set -euo pipefail
          ver=$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' src/Titanium.Inspector/Titanium.Inspector.csproj | head -1)
          out=artifacts/cli/osx-arm64
          mkdir -p artifacts/candidate
          dotnet publish src/Titanium.Cli/Titanium.Cli.csproj -c Release -r osx-arm64 --self-contained true -o "$out" -p:Version="$ver"
          pwsh ./tools/packaging/bundle-http3-native.ps1 -Rid osx-arm64 -PublishDir "$out"
          pwsh ./tools/packaging/bundle-scripting-native.ps1 -Rid osx-arm64 -PublishDir "$out"
          # Ad-hoc sign like product-smoke / install-smoke so the kernel will exec it.
          codesign --force --sign - "$out/titanium" "$out/twp" 2>/dev/null || true
          find "$out" -name '*.dylib' -print0 | xargs -0 codesign --force --sign - 2>/dev/null || true
          (cd "$out" && zip -qr "../../candidate/Titanium.Cli-osx-arm64.zip" .)
      - name: Overlay variants
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/overlay-diag"
          mkdir -p "$root"
          summary="$root/summary.txt"
          : >"$summary"

          src=artifacts/cli/osx-arm64
          zip=artifacts/candidate/Titanium.Cli-osx-arm64.zip
          test -x "$src/titanium"
          test -f "$zip"

          overlay() {
            local dir="$1" mode="$2"
            local tmp
            tmp=$(mktemp -d)
            unzip -qo "$zip" -d "$tmp"
            echo "overlay-$mode" >"$tmp/smoke-marker.txt"
            # Bump a byte in the staged binary so content differs, then re-sign.
            printf '\0' | dd of="$tmp/titanium" bs=1 seek=64 conv=notrunc status=none 2>/dev/null || true
            codesign --force --sign - "$tmp/titanium" 2>/dev/null || true
            case "$mode" in
              cp-af)
                chmod -R u+w "$dir" 2>/dev/null || true
                cp -af "$tmp"/. "$dir"/
                ;;
              rm-then-cp)
                chmod -R u+w "$dir" 2>/dev/null || true
                while IFS= read -r -d '' f; do
                  rel="${f#"$tmp"/}"
                  dest="$dir/$rel"
                  mkdir -p "$(dirname "$dest")"
                  rm -f "$dest"
                  cp -p "$f" "$dest"
                done < <(find "$tmp" -type f -print0)
                ;;
              ditto)
                chmod -R u+w "$dir" 2>/dev/null || true
                ditto "$tmp" "$dir"
                ;;
              *)
                echo "unknown mode $mode" >&2
                exit 1
                ;;
            esac
            rm -rf "$tmp"
            chmod +x "$dir/titanium" "$dir/twp" 2>/dev/null || true
          }

          run_variant() {
            local name="$1" mode="$2" with_hold="$3"
            local dir="$root/$name"
            rm -rf "$dir"
            mkdir -p "$dir"
            ditto "$src" "$dir"
            codesign --force --sign - "$dir/titanium" 2>/dev/null || true
            chmod +x "$dir/titanium"

            local hold_pid=""
            if [[ "$with_hold" == "1" ]]; then
              (
                while true; do
                  "$dir/titanium" version >/dev/null 2>&1 || true
                  sleep 1
                done
              ) &
              hold_pid=$!
              sleep 1
            fi

            local inode_before
            inode_before=$(stat -f '%i' "$dir/titanium")
            echo "=== $name before inode=$inode_before hold=$with_hold ===" | tee -a "$summary"
            codesign -dvv "$dir/titanium" 2>&1 | tee -a "$summary" || true

            set +e
            overlay "$dir" "$mode"
            local overlay_rc=$?
            set -e
            echo "overlay_rc=$overlay_rc" | tee -a "$summary"

            if [[ -n "$hold_pid" ]]; then
              kill "$hold_pid" 2>/dev/null || true
              wait "$hold_pid" 2>/dev/null || true
            fi

            local inode_after
            inode_after=$(stat -f '%i' "$dir/titanium")
            echo "=== $name after inode=$inode_after ===" | tee -a "$summary"
            codesign -dvv "$dir/titanium" 2>&1 | tee -a "$summary" || true
            ls -li "$dir/titanium" | tee -a "$summary"
            test -f "$dir/smoke-marker.txt" || echo "ASSERT: marker missing" | tee -a "$summary"

            set +e
            "$dir/titanium" version >"$root/$name-version.out" 2>&1
            local rc=$?
            set -e
            echo "version_exit=$rc" | tee -a "$summary"
            cat "$root/$name-version.out" | tee -a "$summary" || true
            local changed=no
            [[ "$inode_before" != "$inode_after" ]] && changed=yes
            echo "RESULT $name rc=$rc inode_changed=$changed" | tee -a "$summary"
          }

          run_variant no-hold-cp-af cp-af 0
          run_variant no-hold-rm-then-cp rm-then-cp 0
          run_variant no-hold-ditto ditto 0
          run_variant hold-cp-af cp-af 1
          run_variant hold-rm-then-cp rm-then-cp 1
          run_variant hold-ditto ditto 1

          {
            echo "### Overlay diagnostic summary"
            echo '```'
            cat "$summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-cli-overlay-diag
          path: ${{ runner.temp }}/overlay-diag
          if-no-files-found: ignore
          retention-days: 14
