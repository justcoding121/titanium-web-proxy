name: publish-charts

# Attach Helm charts to an existing GitHub release and push them to GHCR OCI.
# release.yml does this on a cut. Dispatch this when that job did not run.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the charts to
        required: true
        default: v8.0.0-beta

permissions:
  contents: read

jobs:
  publish-charts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package charts onto the GitHub release and push OCI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p charts
          helm package deploy/helm/titanium -d charts
          helm package deploy/helm/titanium-gateway -d charts
          helm package deploy/helm/titanium-manager -d charts
          gh release upload "$TAG" charts/*.tgz --clobber
          for tgz in charts/*.tgz; do
            helm push "$tgz" oci://ghcr.io/justcoding121/charts
          done
          echo "Published Helm charts to GitHub release $TAG and oci://ghcr.io/justcoding121/charts"
