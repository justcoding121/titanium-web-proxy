name: secret-scan

# In-repo secret scan. Push protection is a repository setting and is not changed here.

on:
  pull_request:
  push:
    branches: [develop, beta, stable]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
