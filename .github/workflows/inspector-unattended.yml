name: inspector-unattended

# Ephemeral hosted VMs only. Machine trust is installed before Inspector decrypt tests and removed afterwards.
# A developer PC does not run this workflow.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      TITANIUM_EPHEMERAL_VM: '1'
      TITANIUM_CI_MACHINE_TRUST: '1'
      TITANIUM_SKIP_ROOT_STORE_UI: '1'
      TITANIUM_NO_ELEVATE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: |
          dotnet build src/Titanium.Web.Proxy.sln -c Release --nologo
          dotnet build tools/InspectorDesktopProbe/InspectorDesktopProbe.csproj -c Release --nologo
      - name: Install machine trust
        shell: pwsh
        run: dotnet run --project tools/InspectorDesktopProbe -c Release --no-build -- machine-trust install
      - name: System proxy and browser tests
        shell: pwsh
        run: |
          dotnet test tests/Titanium.E2E.Tests/Titanium.E2E.Tests.csproj -c Release --no-build --filter "TestCategory=Inspector-Unattended|FullyQualifiedName~InspectorWindowsSystemProxy|FullyQualifiedName~InspectorChromeSystemProxy|FullyQualifiedName~InspectorFirefoxSystemProxy" --blame-hang --blame-hang-timeout 5m
      - name: Remove machine trust
        if: always()
        shell: pwsh
        run: dotnet run --project tools/InspectorDesktopProbe -c Release --no-build -- machine-trust clean

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TITANIUM_EPHEMERAL_VM: '1'
      TITANIUM_CI_MACHINE_TRUST: '1'
      TITANIUM_SKIP_ROOT_STORE_UI: '1'
      TITANIUM_NO_ELEVATE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install libmsquic (Linux HTTP/3)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          . /etc/os-release
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://packages.microsoft.com/config/${ID}/${VERSION_ID}/packages-microsoft-prod.deb" \
            -o packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm -f packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic
      - name: Install MsQuic (macOS HTTP/3)
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HOMEBREW_NO_AUTO_UPDATE = '1'
          $env:HOMEBREW_NO_INSTALL_UPGRADE = '1'
          brew install openssl@3 libmsquic
          $prefix = (& brew --prefix).Trim()
          $msquicLib = Join-Path $prefix 'opt/libmsquic/lib'
          $sslLib = Join-Path $prefix 'opt/openssl@3/lib'
          $libDirs = @($msquicLib, $sslLib, (Join-Path $prefix 'lib')) |
            Where-Object { Test-Path $_ } |
            Select-Object -Unique
          $dyld = ($libDirs -join ':')
          Add-Content -Path $env:GITHUB_ENV -Value "DYLD_LIBRARY_PATH=$dyld"
          Add-Content -Path $env:GITHUB_ENV -Value "DYLD_FALLBACK_LIBRARY_PATH=$dyld"
      - name: Inspector headless suite
        run: dotnet test tests/Titanium.Inspector.Tests -c Release --filter "TestCategory=Headless|TestCategory=E2E-UI-Headless|TestCategory=Inspector-Stress"
