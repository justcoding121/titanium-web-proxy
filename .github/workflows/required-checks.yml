name: required-checks

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/required-checks.json'
      - '.github/workflows/required-checks.yml'

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare branch protection with the checked-in list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          expected = json.load(open(".github/required-checks.json", encoding="utf-8"))["checks"]
          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ.get("GITHUB_REF_NAME", "develop")
          url = f"https://api.github.com/repos/{repo}/branches/{branch}/protection/required_status_checks"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)
          except Exception as ex:
              print(f"::warning::Could not read branch protection for {branch}: {ex}")
              print("Branch protection was not changed. A maintainer must require the checks in .github/required-checks.json and turn off admin bypass.")
              raise SystemExit(0)
          actual = data.get("contexts") or data.get("checks") or []
          if isinstance(actual, list) and actual and isinstance(actual[0], dict):
              actual = [c.get("context") or c.get("name") for c in actual]
          missing = [c for c in expected if c not in actual]
          if missing:
              print("::error::Branch protection is missing required checks: " + ", ".join(missing))
              raise SystemExit(1)
          print("Required checks match .github/required-checks.json")
          PY
