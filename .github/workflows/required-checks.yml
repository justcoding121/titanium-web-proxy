name: required-checks

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/required-checks.json'
      - '.github/branch-ruleset-beta-stable.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Contract matches the ruleset file and the workflow job names
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          import yaml

          contract = json.loads(pathlib.Path(".github/required-checks.json").read_text(encoding="utf-8"))
          ruleset = json.loads(pathlib.Path(".github/branch-ruleset-beta-stable.json").read_text(encoding="utf-8"))
          beta = contract["branches"]["beta"]["contexts"]
          stable = contract["branches"]["stable"]["contexts"]
          if beta != stable:
              print("::error::beta and stable context lists differ")
              sys.exit(1)
          live = []
          for rule in ruleset.get("rules", []):
              if rule.get("type") != "required_status_checks":
                  continue
              for check in rule["parameters"]["required_status_checks"]:
                  live.append(check["context"])
          if set(live) != set(beta) or len(live) != len(set(live)):
              print("::error::ruleset contexts do not match required-checks.json")
              print("ruleset:", live)
              print("contract:", beta)
              sys.exit(1)

          names = set()
          for path in pathlib.Path(".github/workflows").glob("*.yml"):
              doc = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
              for job_id, job in (doc.get("jobs") or {}).items():
                  if not isinstance(job, dict):
                      continue
                  names.add(job_id)
                  job_name = job.get("name")
                  if isinstance(job_name, str):
                      cleaned = re.sub(r"\$\{\{.*?\}\}", "", job_name)
                      cleaned = re.sub(r"\s*\(\s*\)\s*", " ", cleaned)
                      cleaned = re.sub(r"\s*\([^)]*\)\s*$", "", cleaned).strip()
                      if cleaned:
                          names.add(cleaned)
          missing = []
          for context in beta:
              base = re.sub(r"\s*\([^)]*\)\s*$", "", context).strip()
              if base not in names and context not in names:
                  missing.append(context)
          if missing:
              print("::error::required checks do not match a workflow job: " + ", ".join(missing))
              sys.exit(1)
          print("Offline contract matches the ruleset file and workflow job names")
          PY
      - name: Live rules match the contract
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request
          contract = json.load(open(".github/required-checks.json", encoding="utf-8"))
          expected = set(contract["branches"]["beta"]["contexts"])
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          for branch in ("beta", "stable"):
              url = f"https://api.github.com/repos/{repo}/rules/branches/{branch}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      rules = json.load(resp)
              except Exception as ex:
                  print(f"::error::Could not read rules for {branch}: {ex}")
                  sys.exit(1)
              actual = []
              for rule in rules:
                  if rule.get("type") != "required_status_checks":
                      continue
                  for check in (rule.get("parameters") or {}).get("required_status_checks") or []:
                      actual.append(check.get("context"))
              if set(actual) != expected:
                  print(f"::error::{branch} required checks differ from .github/required-checks.json")
                  print("live:", sorted(actual))
                  print("expected:", sorted(expected))
                  sys.exit(1)
              print(f"{branch} required checks match")
          PY
