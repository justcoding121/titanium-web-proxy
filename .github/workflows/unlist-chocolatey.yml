name: unlist-chocolatey

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unlist:
    runs-on: windows-latest
    steps:
      - name: Unlist unapproved 8.0.3 packages
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
            throw 'CHOCOLATEY_API_KEY repository secret is not set.'
          }
          $nuget = Join-Path $env:RUNNER_TEMP 'nuget.exe'
          Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/v6.12.1/nuget.exe' -OutFile $nuget -UseBasicParsing
          $failed = $false
          foreach ($id in @('titanium-cli', 'titanium-inspector')) {
            & $nuget delete $id 8.0.3 -Source https://push.chocolatey.org/ -ApiKey $env:CHOCOLATEY_API_KEY -NonInteractive
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }
