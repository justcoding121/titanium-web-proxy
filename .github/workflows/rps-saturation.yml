# Manual saturation RPS lab on GitHub-hosted VMs (not a job container).
# Maintainers run this, then paste median numbers into wiki/Performance.md.
# Not a per-PR gate; not comparable to dedicated-server blog posts.
#
# Prefer --repeats >= 3 for publishable numbers (runner noise). Linux nginx
# is the authoritative nginx baseline; nginx/Windows is same-OS only.
#
# Matrix uses the 4-core public-repo runner class: ubuntu-latest / windows-latest
# (4 vCPU / 16 GiB) and macos-15-intel (4-core / 14 GiB). Do not use macos-latest
# (3-core M1 / 7 GiB) for publishable numbers — wrong size and architecture.
# Do not mix larger or slim runners unless every OS gets the same size class.

name: RPS saturation

on:
  pull_request:
    branches: [beta, stable]
  push:
    branches: [beta, stable]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Ramp mode'
        required: true
        default: compare-terminate
        type: choice
        options:
          - compare-terminate
          - compare-same
          - compare-bridges
          - compare-http3-cleartext
          - compare-nginx-https
          - compare-haproxy-smoke
          - compare-envoy-smoke
          - compare-mitm
          - compare-matrix
          - compare-product
          - compare-product-smoke
          - haproxy-reverse-http1
          - haproxy-reverse-http1-tls
          - haproxy-reverse-http1-to-https
          - haproxy-reverse-http1-tls-to-https
          - haproxy-reverse-http2
          - haproxy-reverse-http2-to-https-http1
          - haproxy-reverse-http3-cleartext
          - haproxy-reverse-http3-to-https-http1
          - envoy-reverse-http1
          - envoy-reverse-http1-tls
          - envoy-reverse-http1-to-https
          - envoy-reverse-http1-tls-to-https
          - envoy-reverse-http2
          - envoy-reverse-http2-to-https-http1
          - envoy-reverse-http3-cleartext
          - envoy-reverse-http3-to-https-http1
          - compare-editions
          - compare-cross-version
          - compare-ceiling
          - compare-bodies
          - compare-post
          - compare-lossy
          - compare-tls-cost
          - compare-arch
          - compare-saturation
          - compare-spot
          - origin-direct
          - compare
          - compare-tls
          - reverse-http1
          - bare-reverse-http1
          - nginx-reverse-http1
          - yarp-reverse-http1
          - reverse-http1-tls
          - bare-reverse-http1-tls
          - nginx-reverse-http1-tls
          - nginx-reverse-http1-to-https
          - nginx-reverse-http1-tls-to-https
          - yarp-reverse-http1-tls
          - https-mitm
          - mitm-http2-to-http1
          - mitm-http3-to-http1
          - reverse-http2
          - reverse-http2-cleartext
          - reverse-http2-to-h2c
          - yarp-reverse-http2-to-h2c
          - reverse-h2c
          - yarp-reverse-h2c
          - reverse-h2c-to-h2c
          - yarp-reverse-h2c-to-h2c
          - reverse-h2c-to-h1
          - yarp-reverse-h2c-to-h1
          - reverse-h2c-to-https
          - yarp-reverse-h2c-to-https
          - reverse-h2c-to-h3
          - yarp-reverse-h2c-to-h3
          - reverse-http3
          - reverse-http3-cleartext
          - yarp-reverse-http3-cleartext
          - reverse-http11-to-http2
          - yarp-reverse-http11-to-http2
          - reverse-http1-to-h2c
          - yarp-reverse-http1-to-h2c
          - reverse-http1-plain-to-h2c
          - yarp-reverse-http1-plain-to-h2c
          - reverse-http1-plain-to-http2
          - yarp-reverse-http1-plain-to-http2
          - reverse-http1-plain-to-http3
          - yarp-reverse-http1-plain-to-http3
          - reverse-http1-to-http3
          - yarp-reverse-http1-to-http3
          - reverse-http2-to-http3
          - yarp-reverse-http2-to-http3
          - reverse-http3-to-http2
          - yarp-reverse-http3-to-http2
          - reverse-http3-to-h2c
          - yarp-reverse-http3-to-h2c
          - yarp-reverse-http1-tls-to-https
          - yarp-reverse-http2-to-https-http1
          - yarp-reverse-http3-to-https-http1
          - nginx-reverse-http2
          - nginx-reverse-http2-to-https-http1
          - nginx-reverse-http3-cleartext
          - nginx-reverse-http3-to-https-http1
          - yarp-reverse-http2
          - yarp-reverse-http2-to-https
          - twp-cli-reverse-http1
          - twp-cli-reverse-http1-tls
          - twp-cli-reverse-http1-route
          - twp-cli-plus-base-http1
          - twp-cli-plus-cache-http1
          - twp-cli-intercept-http1
      concurrency:
        description: 'Comma-separated concurrency steps'
        required: true
        default: '8,16,32,64'
      warmup_sec:
        description: 'Warmup seconds per step'
        required: true
        default: '2'
      duration_sec:
        description: 'Measure seconds per step'
        required: true
        default: '8'
      repeats:
        description: 'Full arm sequence repeats (median peaks)'
        required: true
        default: '3'
      runner_os:
        description: 'OS matrix filter (all = Win+Linux+Mac Intel)'
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-15-intel

permissions:
  contents: read

jobs:
  rps:
    # PR → beta/stable: compare-spot; push → beta/stable: compare-editions; dispatch: inputs.mode
    permissions:
      contents: read
    env:
      RPS_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'pull_request' && 'compare-spot' || 'compare-editions') }}
      RPS_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && inputs.concurrency || '8,16,32,64' }}
      RPS_WARMUP_SEC: ${{ github.event_name == 'workflow_dispatch' && inputs.warmup_sec || 2 }}
      RPS_DURATION_SEC: ${{ github.event_name == 'workflow_dispatch' && inputs.duration_sec || 8 }}
      RPS_REPEATS: ${{ github.event_name == 'workflow_dispatch' && inputs.repeats || 1 }}
    strategy:
      fail-fast: false
      matrix:
        # workflow_dispatch runner_os filters to one OS; otherwise Win+Linux+Mac Intel.
        os: ${{ fromJSON(inputs.runner_os == 'macos-15-intel' && '["macos-15-intel"]' || inputs.runner_os == 'ubuntu-latest' && '["ubuntu-latest"]' || inputs.runner_os == 'windows-latest' && '["windows-latest"]' || '["ubuntu-latest","windows-latest","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    # Intentionally no jobs.*.container — saturation RPS on a container network measures the wrong thing.
    # compare-product with MITM Lite+Full can exceed 3.5h per OS on hosted runners.
    # compare-editions (expanded Plus/CLI stress arms) needs ~60m; other modes keep the long ceiling.
    # compare-product-smoke is the minimal all-OS product-gate subset — run before full compare-product.
    # Ramp has per-arm wall timeout (~8–25m) so a stuck MsQuic/bombardier/READY wait cannot burn 400m.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || (github.event_name == 'push' && 90 || (inputs.mode == 'compare-editions' && 90 || ((inputs.mode == 'compare-product-smoke' || inputs.mode == 'compare-haproxy-smoke' || inputs.mode == 'compare-envoy-smoke') && 60 || 420))) }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Log runner shape (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          echo "os=$(uname -s) $(uname -r)"
          echo "nproc=$(nproc)"
          free -h
          lscpu | sed -n '1,20p'

      - name: Log runner shape (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $cs = Get-CimInstance Win32_ComputerSystem
          $cpu = Get-CimInstance Win32_Processor
          Write-Host "OS=$($os.Caption) $($os.Version)"
          Write-Host "LogicalProcessors=$($cs.NumberOfLogicalProcessors)"
          Write-Host "RAM_GiB=$([math]::Round($cs.TotalPhysicalMemory / 1GB, 1))"
          Write-Host "CPU=$($cpu.Name)"

      - name: Log runner shape (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          echo "os=$(uname -s) $(uname -r) $(uname -m)"
          echo "sw_vers:"
          sw_vers
          ncpu=$(sysctl -n hw.ncpu)
          # hw.memsize is bytes; assert >= 4 CPUs and >= 12 GiB (macos-15-intel is 4 / 14).
          mem_bytes=$(sysctl -n hw.memsize)
          mem_gib=$(awk -v b="$mem_bytes" 'BEGIN { printf "%.1f", b / (1024*1024*1024) }')
          echo "ncpu=$ncpu"
          echo "RAM_GiB=$mem_gib"
          sysctl -n machdep.cpu.brand_string || true
          if [ "$ncpu" -lt 4 ]; then
            echo "Expected >=4 CPUs on macos-15-intel; got $ncpu (do not use macos-latest for publishable RPS)." >&2
            exit 1
          fi
          # 12 GiB floor leaves headroom under the documented 14 GiB Intel runner.
          min_bytes=$((12 * 1024 * 1024 * 1024))
          if [ "$mem_bytes" -lt "$min_bytes" ]; then
            echo "Expected >=12 GiB RAM on macos-15-intel; got ${mem_gib} GiB." >&2
            exit 1
          fi

      # Ubuntu 24.04 distro nginx is 1.24 without HTTP/3. Official nginx.org mainline
      # packages are built with --with-http_v3_module so the H3 terminate arm can run.
      - name: Install nginx (HTTP/3-capable)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          . /etc/os-release
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://nginx.org/keys/nginx_signing.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/nginx-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] https://nginx.org/packages/mainline/${ID} ${VERSION_CODENAME} nginx" \
            | sudo tee /etc/apt/sources.list.d/nginx.list
          printf 'Package: *\nPin: origin nginx.org\nPin-Priority: 900\n' \
            | sudo tee /etc/apt/preferences.d/99nginx
          sudo apt-get update
          sudo apt-get install -y nginx
          # Stop the distro/package default site so our temp-prefix nginx owns the ports we pick.
          sudo systemctl stop nginx || true
          nginx -v
          if ! nginx -V 2>&1 | grep -q http_v3_module; then
            echo "nginx was installed but lacks --with-http_v3_module; HTTP/3 native reverse arms will be skipped." >&2
            nginx -V
          fi

      # nginx/Windows is same-OS only (no QUIC / http_v3). Pin the zip used by the laptop lab.
      - name: Install nginx (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NGINX_WIN_VERSION: '1.31.3'
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:NGINX_WIN_VERSION
          $zip = Join-Path $env:RUNNER_TEMP "nginx-$ver.zip"
          $dest = Join-Path $env:RUNNER_TEMP 'nginx'
          curl.exe --fail --silent --show-error --location --proto '=https' --tlsv1.2 `
            "https://nginx.org/download/nginx-$ver.zip" -o $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $nginxDir = Join-Path $dest "nginx-$ver"
          if (-not (Test-Path (Join-Path $nginxDir 'nginx.exe'))) {
            throw "nginx.exe not found under $nginxDir"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nginxDir
          & (Join-Path $nginxDir 'nginx.exe') -v

      # Homebrew nginx bottles include --with-http_v3_module (OpenSSL 3). Fail hard if missing.
      # macos-15-intel: Homebrew no longer mass-bottles Intel; avoid brew update/upgrade of openssl
      # (already-installed bottle works; upgrading hits "no bottle available").
      - name: Install nginx (HTTP/3-capable, macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_UPGRADE: '1'
        run: |
          set -euo pipefail
          # Use preinstalled openssl@3 / pcre2 when present; do not upgrade (Intel bottles missing).
          brew list --versions openssl@3 || brew install openssl@3
          brew list --versions pcre2 || brew install pcre2
          if ! brew list --versions nginx >/dev/null 2>&1; then
            if ! brew install nginx; then
              echo "brew install nginx failed (likely missing Intel bottle); building from source…" >&2
              brew install --build-from-source nginx
            fi
          fi
          # Prefer brew nginx; if a bottle somehow lacks http_v3, rebuild from source with the flag.
          if ! nginx -V 2>&1 | grep -q http_v3_module; then
            echo "brew nginx lacks http_v3_module; rebuilding from source with --with-http_v3_module" >&2
            brew reinstall --build-from-source nginx
          fi
          brew services stop nginx 2>/dev/null || true
          # Kill any leftover master so our temp-prefix nginx owns the ports we pick.
          pkill -x nginx 2>/dev/null || true
          NGINX_BIN="$(brew --prefix nginx)/bin"
          echo "$NGINX_BIN" >> "$GITHUB_PATH"
          export PATH="$NGINX_BIN:$PATH"
          nginx -v
          if ! nginx -V 2>&1 | grep -q http_v3_module; then
            echo "nginx was installed but lacks --with-http_v3_module; failing job." >&2
            nginx -V
            exit 1
          fi
          nginx -V 2>&1 | tr ' ' '\n' | grep http_v3 || true

      # HAProxy Community/GPL — Linux/macOS only (no official Windows port).
      - name: Install HAProxy (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y haproxy
          sudo systemctl stop haproxy || true
          haproxy -v
          if haproxy -vv 2>&1 | grep -q USE_QUIC; then
            echo "HAProxy USE_QUIC present"
          else
            echo "HAProxy has no USE_QUIC — HTTP/3 HAProxy arms will be skipped." >&2
            haproxy -vv 2>&1 | head -n 40 || true
          fi

      - name: Install HAProxy (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_UPGRADE: '1'
        run: |
          set -euo pipefail
          if ! brew list --versions haproxy >/dev/null 2>&1; then
            brew install haproxy
          fi
          brew services stop haproxy 2>/dev/null || true
          pkill -x haproxy 2>/dev/null || true
          HAP_BIN="$(brew --prefix haproxy)/bin"
          echo "$HAP_BIN" >> "$GITHUB_PATH"
          export PATH="$HAP_BIN:$PATH"
          haproxy -v
          if haproxy -vv 2>&1 | grep -q USE_QUIC; then
            echo "HAProxy USE_QUIC present"
          else
            echo "HAProxy has no USE_QUIC — HTTP/3 HAProxy arms will be skipped." >&2
          fi

      # Envoy Apache 2.0 — Linux static binary from GitHub releases; macOS via Homebrew.
      # Windows support discontinued — skip (cells are Not possible).
      - name: Install Envoy (Linux)
        if: runner.os == 'Linux'
        env:
          ENVOY_VERSION: '1.36.7'
        run: |
          set -euo pipefail
          ver="$ENVOY_VERSION"
          dest="${RUNNER_TEMP}/envoy"
          mkdir -p "$dest"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/envoyproxy/envoy/releases/download/v${ver}/envoy-${ver}-linux-x86_64" \
            -o "$dest/envoy"
          chmod +x "$dest/envoy"
          echo "$dest" >> "$GITHUB_PATH"
          export PATH="$dest:$PATH"
          envoy --version
          if envoy --version 2>&1 | grep -Eiq 'quic|http/?3'; then
            echo "Envoy version string mentions QUIC/HTTP3"
          else
            echo "Envoy HTTP/3 capability unclear from --version — H3 arms may be skipped." >&2
          fi

      - name: Install Envoy (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_UPGRADE: '1'
        run: |
          set -euo pipefail
          if ! brew list --versions envoy >/dev/null 2>&1; then
            brew install envoy || brew install envoyproxy/tap/envoy || {
              echo "brew install envoy failed — Envoy arms will be skipped on this runner." >&2
              exit 0
            }
          fi
          brew services stop envoy 2>/dev/null || true
          pkill -x envoy 2>/dev/null || true
          # Prefer brew prefix bin when present.
          if command -v brew >/dev/null 2>&1; then
            for formula in envoy envoyproxy/tap/envoy; do
              prefix="$(brew --prefix "$formula" 2>/dev/null || true)"
              if [ -n "$prefix" ] && [ -x "$prefix/bin/envoy" ]; then
                echo "$prefix/bin" >> "$GITHUB_PATH"
                export PATH="$prefix/bin:$PATH"
                break
              fi
            done
          fi
          if ! command -v envoy >/dev/null 2>&1; then
            echo "envoy not on PATH after install attempt — Envoy arms will be skipped." >&2
            exit 0
          fi
          envoy --version

      # .NET System.Net.Quic on Linux requires native libmsquic (shipped in-box on Windows).
      - name: Install libmsquic (HTTP/3)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          . /etc/os-release
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://packages.microsoft.com/config/${ID}/${VERSION_ID}/packages-microsoft-prod.deb" \
            -o packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm -f packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic
          pwsh -NoProfile -Command 'if (-not [System.Net.Quic.QuicListener]::IsSupported) { throw "QuicListener.IsSupported is false after libmsquic install" }; Write-Host "QuicListener.IsSupported=$([System.Net.Quic.QuicListener]::IsSupported)"'

      - name: Assert in-box MsQuic (HTTP/3)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not [System.Net.Quic.QuicListener]::IsSupported) {
            throw 'QuicListener.IsSupported is false on windows-latest (expected in-box MsQuic)'
          }
          Write-Host "QuicListener.IsSupported=$([System.Net.Quic.QuicListener]::IsSupported)"

      # macOS: System.Net.Quic needs Homebrew libmsquic (and OpenSSL) on DYLD_* path.
      # Prefer brew; fall back to Microsoft osx-x64 release dylibs if brew is insufficient.
      - name: Install MsQuic (HTTP/3, macOS Intel)
        if: runner.os == 'macOS'
        shell: pwsh
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_UPGRADE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          # Do not upgrade openssl@3 on Intel — new formula often has no bottle.
          brew install openssl@3 libmsquic
          $prefix = (& brew --prefix).Trim()
          $msquicLib = Join-Path $prefix 'opt/libmsquic/lib'
          $sslLib = Join-Path $prefix 'opt/openssl@3/lib'
          $libDirs = @($msquicLib, $sslLib, (Join-Path $prefix 'lib')) |
            Where-Object { Test-Path $_ } |
            Select-Object -Unique
          $dyld = ($libDirs -join ':')
          # Persist for later steps (ramp / QuicListener).
          Add-Content -Path $env:GITHUB_ENV -Value "DYLD_LIBRARY_PATH=$dyld"
          Add-Content -Path $env:GITHUB_ENV -Value "DYLD_FALLBACK_LIBRARY_PATH=$dyld"
          $env:DYLD_LIBRARY_PATH = $dyld
          $env:DYLD_FALLBACK_LIBRARY_PATH = $dyld
          Write-Host "DYLD_LIBRARY_PATH=$dyld"

          function Test-QuicSupported {
            # Child process so dyld sees DYLD_* (in-process env changes are too late for loaded runtime).
            $out = & pwsh -NoProfile -Command {
              if (-not [System.Net.Quic.QuicListener]::IsSupported) { '0' } else { '1' }
            }
            return ($out.Trim() -eq '1')
          }

          if (-not (Test-QuicSupported)) {
            Write-Host 'QuicListener.IsSupported still false after brew; trying Microsoft osx-x64 libmsquic drop…'
            $dest = Join-Path $env:RUNNER_TEMP 'msquic-osx'
            New-Item -ItemType Directory -Path $dest -Force | Out-Null
            # Pin a known MsQuic release asset layout; adjust tag if the download 404s.
            $tag = 'v2.4.7'
            $url = "https://github.com/microsoft/msquic/releases/download/$tag/msquic_osx-x64_$tag.zip"
            $zip = Join-Path $env:RUNNER_TEMP 'msquic-osx.zip'
            try {
              & curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 $url -o $zip
              if ($LASTEXITCODE -ne 0) { throw "curl exit $LASTEXITCODE" }
              Expand-Archive -Path $zip -DestinationPath $dest -Force
            } catch {
              Write-Warning "Microsoft release download failed ($url): $_"
            }
            $found = Get-ChildItem -Path $dest -Recurse -Filter 'libmsquic*.dylib' -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              $extra = $found.Directory.FullName
              # ${extra} — bare $extra: is parsed as a PowerShell drive-qualified variable.
              $dyld2 = "${extra}:${dyld}"
              Add-Content -Path $env:GITHUB_ENV -Value "DYLD_LIBRARY_PATH=$dyld2"
              Add-Content -Path $env:GITHUB_ENV -Value "DYLD_FALLBACK_LIBRARY_PATH=$dyld2"
              $env:DYLD_LIBRARY_PATH = $dyld2
              $env:DYLD_FALLBACK_LIBRARY_PATH = $dyld2
              Write-Host "Added Microsoft dylib dir: $extra"
            }
          }

          if (-not (Test-QuicSupported)) {
            throw 'QuicListener.IsSupported is false after macOS MsQuic install (brew + optional Microsoft drop)'
          }
          Write-Host 'QuicListener.IsSupported=True'

      - name: Install bombardier (optional external generator)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Force HTTPS-only (including redirects) for Sonar githubactions:S6506.
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/codesenberg/bombardier/releases/download/v1.2.6/bombardier-linux-amd64" \
            -o /usr/local/bin/bombardier
          chmod +x /usr/local/bin/bombardier
          bombardier --version || true

      - name: Install bombardier (optional external generator)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'bombardier'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $exe = Join-Path $dir 'bombardier.exe'
          curl.exe --fail --silent --show-error --location --proto '=https' --tlsv1.2 `
            'https://github.com/codesenberg/bombardier/releases/download/v1.2.6/bombardier-windows-amd64.exe' `
            -o $exe
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & $exe --version

      - name: Install bombardier (optional external generator)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # macos-15-intel is x86_64 — use darwin amd64 binary.
          dir="${RUNNER_TEMP}/bombardier"
          mkdir -p "$dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/codesenberg/bombardier/releases/download/v1.2.6/bombardier-darwin-amd64" \
            -o "$dir/bombardier"
          chmod +x "$dir/bombardier"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/bombardier" --version || true

      - name: Raise open-file limit
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          ulimit -n 65535 || true
          ulimit -n

      # Pass workflow_dispatch inputs via env (not ${{ }} in the script) to avoid
      # githubactions:S7630 script-injection findings on user-controlled values.
      - name: Run saturation ramp
        timeout-minutes: ${{ github.event_name == 'pull_request' && 40 || (github.event_name == 'push' && 60 || (inputs.mode == 'compare-editions' && 60 || ((inputs.mode == 'compare-product-smoke' || inputs.mode == 'compare-haproxy-smoke' || inputs.mode == 'compare-envoy-smoke') && 50 || 400))) }}
        shell: pwsh
        env:
          RPS_MODE: ${{ env.RPS_MODE }}
          RPS_CONCURRENCY: ${{ env.RPS_CONCURRENCY }}
          RPS_WARMUP_SEC: ${{ env.RPS_WARMUP_SEC }}
          RPS_DURATION_SEC: ${{ env.RPS_DURATION_SEC }}
          RPS_REPEATS: ${{ env.RPS_REPEATS }}
        run: |
          pwsh tools/RpsLoadProbe/run-rps.ps1 `
            -Mode $env:RPS_MODE `
            -Concurrency $env:RPS_CONCURRENCY `
            -WarmupSec ([int]$env:RPS_WARMUP_SEC) `
            -DurationSec ([int]$env:RPS_DURATION_SEC) `
            -Repeats ([int]$env:RPS_REPEATS) `
            -ResultsDir tools/RpsLoadProbe/results `
            -BombardierCheck

      # Post-ramp gates: hard-fail on every event (including workflow_dispatch).
      # fail-fast: false keeps sibling OS jobs running; Upload CSV uses if: always().
      - name: Validate edition gates
        if: env.RPS_MODE == 'compare-editions'
        shell: pwsh
        run: |
          $csv = Get-ChildItem tools/RpsLoadProbe/results -Filter 'rps-ramp-*.csv' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $csv) { throw 'No CSV found for edition gate validation' }
          pwsh tools/RpsLoadProbe/validate-edition-gates.ps1 -CsvPath $csv.FullName

      - name: Validate compare-product gates
        if: env.RPS_MODE == 'compare-product' || env.RPS_MODE == 'compare-product-smoke'
        shell: pwsh
        run: |
          $csv = Get-ChildItem tools/RpsLoadProbe/results -Filter 'rps-ramp-*.csv' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $csv) { throw 'No CSV found for compare-product gate validation' }
          # Same floors on all OS: MITM Lite÷Reverse >= 0.50, Full÷Reverse >= 0.50, reverse TWP÷YARP >= 0.75. No nginx gate.
          pwsh tools/RpsLoadProbe/validate-compare-product-gates.ps1 -CsvPath $csv.FullName

      - name: Validate cross-version gates
        if: env.RPS_MODE == 'compare-cross-version'
        shell: pwsh
        run: |
          $csv = Get-ChildItem tools/RpsLoadProbe/results -Filter 'rps-ramp-*.csv' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $csv) { throw 'No CSV found for cross-version gate validation' }
          $baseline = if ($env:RUNNER_OS -eq 'Windows') {
            'tools/RpsLoadProbe/results/baseline-6.0-win.csv'
          } else {
            'tools/RpsLoadProbe/results/baseline-6.0-linux.csv'
          }
          if (-not (Test-Path $baseline)) { throw "Missing baseline: $baseline" }
          pwsh tools/RpsLoadProbe/validate-cross-version.ps1 `
            -BaselineCsv $baseline `
            -CurrentCsv $csv.FullName

      - name: Upload CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rps-csv-${{ matrix.os }}
          path: tools/RpsLoadProbe/results/rps-ramp-*.csv
          if-no-files-found: error
