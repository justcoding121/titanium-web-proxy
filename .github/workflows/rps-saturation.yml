# Manual saturation RPS lab on a GitHub-hosted Ubuntu VM (not a job container).
# Maintainers run this, then paste median numbers into wiki/Performance.md.
# Not a per-PR gate; not comparable to dedicated-server blog posts.
#
# Prefer --repeats >= 3 for publishable Linux numbers (runner noise). Linux nginx
# is the authoritative nginx baseline; nginx/Windows is same-OS only.

name: RPS saturation (Linux)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Ramp mode'
        required: true
        default: compare-terminate
        type: choice
        options:
          - compare-terminate
          - compare-same
          - compare-bridges
          - compare
          - compare-tls
          - reverse-http1
          - nginx-reverse-http1
          - https-mitm
          - reverse-http2
          - reverse-http2-cleartext
          - reverse-http2-to-h2c
          - reverse-h2c
          - reverse-h2c-to-h2c
          - reverse-h2c-to-h1
          - reverse-h2c-to-h3
          - reverse-http3
          - reverse-http3-cleartext
          - reverse-http11-to-http2
          - reverse-http1-to-http3
          - reverse-http2-to-http3
          - reverse-http3-to-http2
          - nginx-reverse-http2
      concurrency:
        description: 'Comma-separated concurrency steps'
        required: true
        default: '8,16,32,64'
      warmup_sec:
        description: 'Warmup seconds per step'
        required: true
        default: '2'
      duration_sec:
        description: 'Measure seconds per step'
        required: true
        default: '8'
      repeats:
        description: 'Full arm sequence repeats (median peaks)'
        required: true
        default: '3'

jobs:
  rps:
    runs-on: ubuntu-latest
    # Intentionally no jobs.*.container — saturation RPS on a container network measures the wrong thing.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Install nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          # Stop the distro default site so our temp-prefix nginx owns the ports we pick.
          sudo systemctl stop nginx || true
          nginx -v

      # .NET System.Net.Quic on Linux requires native libmsquic (shipped in-box on Windows only).
      - name: Install libmsquic (HTTP/3)
        run: |
          set -euo pipefail
          . /etc/os-release
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://packages.microsoft.com/config/${ID}/${VERSION_ID}/packages-microsoft-prod.deb" \
            -o packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm -f packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y libmsquic
          pwsh -NoProfile -Command 'if (-not [System.Net.Quic.QuicListener]::IsSupported) { throw "QuicListener.IsSupported is false after libmsquic install" }; Write-Host "QuicListener.IsSupported=$([System.Net.Quic.QuicListener]::IsSupported)"'

      - name: Install bombardier (optional external generator)
        run: |
          set -euo pipefail
          # Force HTTPS-only (including redirects) for Sonar githubactions:S6506.
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/codesenberg/bombardier/releases/download/v1.2.6/bombardier-linux-amd64" \
            -o /usr/local/bin/bombardier
          chmod +x /usr/local/bin/bombardier
          bombardier --version || true

      - name: Raise open-file limit
        run: |
          ulimit -n 65535 || true
          ulimit -n

      # Pass workflow_dispatch inputs via env (not ${{ }} in the script) to avoid
      # githubactions:S7630 script-injection findings on user-controlled values.
      - name: Run saturation ramp
        shell: pwsh
        env:
          RPS_MODE: ${{ inputs.mode }}
          RPS_CONCURRENCY: ${{ inputs.concurrency }}
          RPS_WARMUP_SEC: ${{ inputs.warmup_sec }}
          RPS_DURATION_SEC: ${{ inputs.duration_sec }}
          RPS_REPEATS: ${{ inputs.repeats }}
        run: |
          pwsh tools/RpsLoadProbe/run-rps.ps1 `
            -Mode $env:RPS_MODE `
            -Concurrency $env:RPS_CONCURRENCY `
            -WarmupSec ([int]$env:RPS_WARMUP_SEC) `
            -DurationSec ([int]$env:RPS_DURATION_SEC) `
            -Repeats ([int]$env:RPS_REPEATS) `
            -ResultsDir tools/RpsLoadProbe/results `
            -BombardierCheck

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: rps-csv
          path: tools/RpsLoadProbe/results/rps-ramp-*.csv
          if-no-files-found: error
