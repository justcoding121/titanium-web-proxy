  publish-chocolatey:
    needs: [resolve-version, publish-release]
    # always(): a skipped ancestor (beta skips rps-product-smoke) skips this job without it.
    if: |
      always() &&
      needs.publish-release.result == 'success' &&
      vars.SKIP_CATALOG_PUBLISH != 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_catalog_publish != 'true')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Runs on every product release cut from beta/stable (via cut-product-tag → this workflow).
      - name: Pack and push chocolatey packages
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CHOCOLATEY_API_KEY)) {
            Write-Error 'CHOCOLATEY_API_KEY is required for catalog publish'
          }
          $tag = $env:RELEASE_TAG
          if (-not (Test-Path ./tools/packaging/chocolatey/bump-packages.ps1)) {
            Write-Error 'Chocolatey packaging stubs missing on this ref'
          }
          $cliAsset = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Titanium.Cli-win-x64.zip"
          $msiAsset = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/TitaniumInspector-win-x64.msi"
          $ready = $false
          foreach ($i in 1..12) {
            try {
              Invoke-WebRequest -Method Head -Uri $cliAsset -UseBasicParsing | Out-Null
              Invoke-WebRequest -Method Head -Uri $msiAsset -UseBasicParsing | Out-Null
              $ready = $true
              break
            } catch {
              Write-Host "Waiting for release assets ($i/12)..."
              Start-Sleep -Seconds 10
            }
          }
          if (-not $ready) {
            Write-Error "Win-x64 CLI zip or Inspector MSI not ready for $tag after wait"
          }
          pwsh ./tools/packaging/chocolatey/bump-packages.ps1 -Tag $tag
          Push-Location tools/packaging/chocolatey/titanium-cli
          choco pack --output-directory .
          if ($LASTEXITCODE -ne 0) { throw "choco pack titanium-cli failed ($LASTEXITCODE)" }
          Pop-Location
          Push-Location tools/packaging/chocolatey/titanium-inspector
          choco pack --output-directory .
          if ($LASTEXITCODE -ne 0) { throw "choco pack titanium-inspector failed ($LASTEXITCODE)" }
          Pop-Location
          Get-ChildItem tools/packaging/chocolatey -Recurse -Filter *.nupkg | ForEach-Object {
            choco push $_.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
            if ($LASTEXITCODE -ne 0) { throw "choco push $($_.Name) failed ($LASTEXITCODE)" }
          }

  publish-charts:
    needs: [resolve-version, publish-release, product-smoke]
    # always(): a skipped ancestor (beta skips rps-product-smoke) skips this job without it.
    if: always() && needs.publish-release.result == 'success' && needs.product-smoke.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: charts
          path: charts
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the smoked chart archives to the GitHub release and OCI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.release_tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          CHANNEL: ${{ needs.resolve-version.outputs.channel }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p sums
          test -n "$(ls charts/*.tgz)"
          gh release download "$TAG" -p SHA256SUMS -D sums
          chmod +x tools/packaging/append-chart-checksums.sh
          ./tools/packaging/append-chart-checksums.sh sums/SHA256SUMS charts
          if [[ -z "${GPG_PRIVATE_KEY:-}" ]]; then
            echo "GPG_PRIVATE_KEY is required so the updated SHA256SUMS stays signed." >&2
            exit 1
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          args=(--batch --yes --detach-sign --armor -o sums/SHA256SUMS.asc sums/SHA256SUMS)
          if [[ -n "${GPG_PASSPHRASE:-}" ]]; then
            args=(--batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --armor -o sums/SHA256SUMS.asc sums/SHA256SUMS)
          fi
          gpg "${args[@]}"
          rm -rf "$GNUPGHOME"
          gh release upload "$TAG" charts/*.tgz sums/SHA256SUMS sums/SHA256SUMS.asc --clobber
          chmod +x tools/packaging/smoke/push-charts.sh
          bash tools/packaging/smoke/push-charts.sh charts oci://ghcr.io/justcoding121/charts
          echo "Published Helm charts to GitHub release $TAG and oci://ghcr.io/justcoding121/charts (channel=$CHANNEL version=$VERSION)"

  publish-homebrew:
    needs: [resolve-version, publish-release]
    if: |
      always() &&
      needs.publish-release.result == 'success' &&
      vars.SKIP_CATALOG_PUBLISH != 'true' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.skip_catalog_publish != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - name: Point Homebrew formula at this release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required for Homebrew publish"
            exit 1
          fi
          TAG="$RELEASE_TAG"
          mkdir -p sums
          gh release download "$TAG" -p SHA256SUMS -D sums
          chmod +x tools/packaging/homebrew/bump-formula-from-sums.sh
          bash tools/packaging/homebrew/bump-formula-from-sums.sh "$VERSION" "sums/SHA256SUMS"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- tools/packaging/homebrew/titanium.rb; then
            git add tools/packaging/homebrew/titanium.rb
            git commit -m "chore(packaging): point the Homebrew formula at ${VERSION}"
            git push origin HEAD:develop
          fi
          tap="$(mktemp -d)"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/justcoding121/homebrew-titanium.git" "$tap"
          cp tools/packaging/homebrew/titanium.rb "$tap/Formula/titanium.rb"
          pushd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Formula/titanium.rb; then
            git add Formula/titanium.rb
            git commit -m "chore(packaging): point the Homebrew formula at ${VERSION}"
            git push origin HEAD
          fi
          popd
          gh workflow run packaging-catalog-smoke.yml --ref develop \
            -f release_tag="$TAG" -f run_homebrew=true

  release-manifest-gate:
    needs: [resolve-version, build-cli, build-plus, build-inspector, product-smoke]
    if: |
      always() &&
      needs.resolve-version.outputs.dry_run == 'true' &&
      needs.build-cli.result == 'success' &&
      needs.build-plus.result == 'success' &&
      needs.build-inspector.result == 'success' &&
      needs.product-smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Build and verify release-manifest (dry-run)
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="$RELEASE_VERSION"
          export RELEASE_TAG VERSION
          mkdir -p dist
          find artifacts -type f \( \
            -name '*.zip' -o -name '*.dll' -o -name '*.msi' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \
            -o -name '*.cdx.json' \
          \) -exec cp {} dist/ \;
          if [[ -d artifacts/sbom ]]; then
            cp -a artifacts/sbom/. dist/ || true
          fi
          python3 tools/ci/build-release-manifest.py \
            --dist dist \
            --output dist/release-manifest.json \
            --tag "$TAG" \
            --version "$VERSION"
          chmod +x tools/packaging/sign-checksums.sh
          ./tools/packaging/sign-checksums.sh dist
          python3 tools/ci/verify-release-manifest.py \
            --manifest dist/release-manifest.json \
            --sums dist/SHA256SUMS \
            --stage-dir dist \
            --tag "$TAG"

  publish-rehearsal:
    needs: [resolve-version, product-smoke, build-images, build-charts, release-manifest-gate]
    if: |
      needs.resolve-version.outputs.dry_run == 'true' &&
      needs.product-smoke.result == 'success' &&
      needs.build-images.result == 'success' &&
      needs.build-charts.result == 'success' &&
      needs.release-manifest-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image-oci-proxy
          path: oci/proxy
      - uses: actions/download-artifact@v8
        with:
          name: image-oci-gateway
          path: oci/gateway
      - uses: actions/download-artifact@v8
        with:
          name: image-oci-manager
          path: oci/manager
      - uses: actions/download-artifact@v8
        with:
          name: charts
          path: charts
      - name: Start local OCI registry
        run: docker run -d --name publish-rehearsal-registry -p 5000:5000 registry:2
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo gpg
      - name: Rehearse OCI image publish
        env:
          SKOPEO_INSECURE: "1"
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          ver="$VERSION"
          printf 'localhost:5000/titanium-web-proxy:%s\n' "$ver" > tags-proxy.txt
          printf 'localhost:5000/titanium-gateway:%s\n' "$ver" > tags-gateway.txt
          printf 'localhost:5000/titanium-manager:%s\n' "$ver" > tags-manager.txt
          chmod +x tools/packaging/smoke/publish-oci.sh
          bash tools/packaging/smoke/publish-oci.sh oci/proxy/image.oci.tar tags-proxy.txt
          bash tools/packaging/smoke/publish-oci.sh oci/gateway/image.oci.tar tags-gateway.txt
          bash tools/packaging/smoke/publish-oci.sh oci/manager/image.oci.tar tags-manager.txt
      - name: Rehearse Helm chart publish
        env:
          HELM_PLAIN_HTTP: "1"
          PULL_BACK: "1"
        run: |
          set -euo pipefail
          chmod +x tools/packaging/smoke/push-charts.sh
          bash tools/packaging/smoke/push-charts.sh charts oci://localhost:5000/charts
      - name: Rehearse checksum signing
        run: |
          set -euo pipefail
          dist="$(mktemp -d)"
          cp charts/*.tgz "$dist/"
          key_home="$(mktemp -d)"
          export GNUPGHOME="$key_home"
          chmod 700 "$GNUPGHOME"
          cat >"$GNUPGHOME/batch" <<'BATCH'
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Subkey-Type: RSA
          Subkey-Length: 2048
          Name-Real: Release Rehearsal
          Name-Email: rehearsal@ci.local
          Expire-Date: 1d
          %commit
          BATCH
          gpg --batch --generate-key "$GNUPGHOME/batch"
          fingerprint="$(gpg --list-secret-keys --with-colons rehearsal@ci.local | awk -F: '/^fpr:/ { print $10; exit }')"
          export GPG_PRIVATE_KEY
          GPG_PRIVATE_KEY="$(gpg --armor --export-secret-keys "$fingerprint")"
          chmod +x tools/packaging/sign-checksums.sh
          ./tools/packaging/sign-checksums.sh "$dist"
          verify_home="$(mktemp -d)"
          export GNUPGHOME="$verify_home"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --verify "$dist/SHA256SUMS.asc" "$dist/SHA256SUMS"
          rm -rf "$key_home" "$verify_home"

  image-scan:
    needs: [resolve-version, publish-image, publish-gateway-image, publish-manager-image]
    # always(): skipped test/cli-e2e ancestors otherwise skip this job after a green push path.
    if: always() && needs.publish-image.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/justcoding121/titanium-web-proxy
          - ghcr.io/justcoding121/titanium-gateway
          - ghcr.io/justcoding121/titanium-manager
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ needs.resolve-version.outputs.version }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

  # MIT NuGet pack/push lives in dotnetcore.yml (trusted publishing is bound to that
  # workflow file). Do not publish from this workflow or OIDC token exchange fails.

  yank-failed-release:
    needs: [resolve-version, publish-release, publish-image, publish-gateway-image, publish-manager-image, publish-chocolatey, publish-charts, publish-homebrew, image-scan]
    if: failure() && needs.publish-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Delete the GitHub release and open an incident
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-version.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release delete "$TAG" --yes --cleanup-tag || echo "No GitHub release to delete for $TAG"
          gh issue create --title "Release ${TAG} yanked" --body "A publish job failed for ${TAG}. The GitHub release was deleted. NuGet packages cannot be yanked from this workflow; unlist Titanium.Web.Proxy, Titanium.Web.Proxy.Abstractions, and Titanium.Web.Proxy.Configuration for ${TAG} by hand if they were pushed. Chocolatey and Homebrew versions need a manual unlist where those channels do not support an API yank."
