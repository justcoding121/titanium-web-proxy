name: release

on:
  workflow_call:
    inputs:
      channel:
        description: 'stable or beta. dry_run is forced for a called workflow.'
        required: true
        type: string
      dry_run:
        description: 'Called workflows never publish. Callers pass true.'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable or beta'
        required: true
        default: 'stable'
      skip_catalog_publish:
        description: 'Skip Chocolatey (and any future catalog) publish'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Build, sign, notarize, and smoke without publishing (lab artifacts only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Resolve release tag / channel
        env:
          # A tag push has no inputs context. Read it only for dispatch and for a caller.
          # Inside a called workflow github.event_name is the caller's event, and inputs
          # are the workflow_call values (dry_run is passed true).
          INPUT_DRY_RUN: ${{ github.event_name != 'push' && inputs.dry_run && 'true' || '' }}
          INPUT_CHANNEL: ${{ github.event_name != 'push' && inputs.channel || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          DRY=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            CHANNEL=stable
            if [[ "$VERSION" == *beta* || "$VERSION" == *-* ]]; then CHANNEL=beta; fi
          else
            CHANNEL="${INPUT_CHANNEL:-stable}"
            # Called workflows pass dry_run: true. A pull_request caller cannot publish.
            if [[ "$INPUT_DRY_RUN" == "true" || "$EVENT_NAME" == "pull_request" ]]; then DRY=true; fi
            PREFIX=$(grep -oP '(?<=<VersionPrefix>)[^<]+' src/Titanium.Web.Proxy/Titanium.Web.Proxy.csproj | head -n1)
            if [[ -z "$PREFIX" ]]; then echo "VersionPrefix not found"; exit 1; fi
            if [[ "$CHANNEL" == "beta" ]]; then
              VERSION="${PREFIX}-beta"
            else
              VERSION="$PREFIX"
            fi
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION channel=$CHANNEL dry_run=$DRY"

  release-readiness:
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - name: Dry-run skips same-SHA readiness wait
        if: needs.resolve-version.outputs.dry_run == 'true'
        run: echo 'dry_run skipping release-readiness wait so lab artifacts can build from this tip'
      - uses: actions/checkout@v7
        if: needs.resolve-version.outputs.dry_run != 'true'
        with:
          fetch-depth: 0
      - name: Same-SHA readiness workflows are green
        if: needs.resolve-version.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TREE_EVIDENCE_ENFORCE: ${{ vars.TREE_EVIDENCE_ENFORCE }}
        run: |
          set -euo pipefail
          workflows=(
            conformance.yml
            soak.yml
            kubernetes-smoke.yml
            inspector-unattended.yml
            fuzz-nightly.yml
            dast.yml
            inspector-install-smoke.yml
          )
          {
            echo "### tree evidence (shadow)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          evidence_ready=()
          for name in "${workflows[@]}"; do
            if pwsh -NoProfile -File tools/ci/assert-tree-evidence.ps1 \
                -Commit "$SHA" -Live -Soft \
                -Workflow "$name" \
                -Events schedule,push,workflow_dispatch \
                -MaxAgeHours 48; then
              echo "would have skipped same-SHA wait for $name (same-tree evidence)"
              echo "- $name: would have skipped same-SHA wait (same-tree evidence)" >> "$GITHUB_STEP_SUMMARY"
              if [[ "${TREE_EVIDENCE_ENFORCE:-}" == "true" ]]; then
                evidence_ready+=("$name")
                echo "- $name decision: enforce skip" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "- $name decision: fall back to live same-SHA (shadow mode)" >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "- $name: no same-tree evidence; will poll same-SHA" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          # Space-separated list for the Python poll (workflows already satisfied by evidence).
          export EVIDENCE_READY="${evidence_ready[*]:-}"
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["SHA"]
          evidence_ready = set((os.environ.get("EVIDENCE_READY") or "").split())
          workflows = [
              "conformance.yml",
              "soak.yml",
              "kubernetes-smoke.yml",
              "inspector-unattended.yml",
              "fuzz-nightly.yml",
              "dast.yml",
              "inspector-install-smoke.yml",
          ]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          issues = get(f"https://api.github.com/repos/{repo}/issues?labels=escaped-defect&state=all&per_page=50")
          defects = []
          for issue in issues:
              if "pull_request" in issue:
                  continue
              body = issue.get("body") or ""
              number = issue.get("number")
              if issue.get("state") == "open":
                  defects.append(f"escaped-defect #{number} is still open")
              elif "tests/" not in body:
                  defects.append(f"escaped-defect #{number} was closed without a tests/ path in the body")
          if defects:
              print("::error::" + ", ".join(defects))
              sys.exit(1)

          started = time.time()
          deadline = started + 150 * 60
          seen = set(evidence_ready)
          for name in sorted(evidence_ready):
              print(f"{name}: ready via same-tree evidence")
          while True:
              failed = []
              waiting = []
              now = time.time()
              for name in workflows:
                  if name in evidence_ready:
                      continue
                  data = get(
                      f"https://api.github.com/repos/{repo}/actions/workflows/{name}/runs"
                      f"?head_sha={sha}&per_page=20"
                  )
                  runs = [r for r in data.get("workflow_runs", []) if r.get("head_sha") == sha]
                  runs.sort(key=lambda r: r.get("created_at") or "", reverse=True)
                  run = runs[0] if runs else None
                  if run is None:
                      if now - started >= 10 * 60:
                          failed.append(f"dispatch {name} on this SHA")
                      else:
                          waiting.append(name)
                      continue
                  if run.get("status") != "completed":
                      waiting.append(name)
                      continue
                  if run.get("conclusion") != "success":
                      failed.append(f"{name} {run.get('html_url')} conclusion={run.get('conclusion')}")
                      continue
                  if name not in seen:
                      print(f"{name}: {run.get('html_url')}")
                      seen.add(name)
              if failed:
                  print("::error::" + ", ".join(failed))
                  sys.exit(1)
              if not waiting:
                  break
              if now >= deadline:
                  print("::error::still running after 150 minutes: " + ", ".join(waiting))
                  sys.exit(1)
              print("waiting: " + ", ".join(waiting))
              time.sleep(60)
          PY

  gate-evidence:
    needs: [resolve-version]
    # Dry-runs already have merge-gate on the PR merge ref; skip the cold re-test path.
    if: needs.resolve-version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      green: ${{ steps.evidence.outputs.green }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: evidence
        name: Push run already passed the release SHA gates
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TREE_EVIDENCE_ENFORCE: ${{ vars.TREE_EVIDENCE_ENFORCE }}
        run: |
          set -euo pipefail
          {
            echo "### tree evidence (shadow)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          rps_via_evidence=false
          if pwsh -NoProfile -File tools/ci/assert-tree-evidence.ps1 \
              -Commit "$SHA" -Live -Soft \
              -Workflow rps-edition-gate.yml \
              -Job rps-publish-gate \
              -Events schedule,push,workflow_dispatch \
              -MaxAgeHours 48; then
            echo "would have accepted rps-publish-gate via same-tree evidence"
            echo "- rps-publish-gate: would have accepted via same-tree evidence" >> "$GITHUB_STEP_SUMMARY"
            if [[ "${TREE_EVIDENCE_ENFORCE:-}" == "true" ]]; then
              rps_via_evidence=true
              echo "- decision: enforce skip for rps-publish-gate" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- decision: still require live same-SHA rps (shadow mode)" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "- rps-publish-gate: no same-tree evidence" >> "$GITHUB_STEP_SUMMARY"
          fi
          export RPS_VIA_EVIDENCE="$rps_via_evidence"
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["SHA"]
          rps_via_evidence = os.environ.get("RPS_VIA_EVIDENCE") == "true"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)
          data = get(
              f"https://api.github.com/repos/{repo}/actions/workflows/dotnetcore.yml/runs"
              f"?head_sha={sha}&event=push&status=completed&per_page=20"
          )
          runs = [r for r in data.get("workflow_runs", []) if r.get("head_sha") == sha and r.get("event") == "push"]
          runs.sort(key=lambda r: r.get("created_at") or "", reverse=True)
          merge_ok = False
          if runs:
              jobs = get(f"https://api.github.com/repos/{repo}/actions/runs/{runs[0]['id']}/jobs?per_page=100")
              found = {}
              for job in jobs.get("jobs", []):
                  if job.get("name") == "merge-gate":
                      found["merge-gate"] = job.get("conclusion")
              merge_ok = found.get("merge-gate") == "success"
              print("dotnetcore push jobs:", found, "run:", runs[0].get("html_url"))
          else:
              print("no completed push run of dotnetcore.yml on this SHA")

          rps_ok = rps_via_evidence
          if not rps_ok:
              rps = get(
                  f"https://api.github.com/repos/{repo}/actions/workflows/rps-edition-gate.yml/runs"
                  f"?head_sha={sha}&status=completed&per_page=20"
              )
              rps_runs = [r for r in rps.get("workflow_runs", []) if r.get("head_sha") == sha]
              rps_runs.sort(key=lambda r: r.get("created_at") or "", reverse=True)
              if rps_runs:
                  jobs = get(f"https://api.github.com/repos/{repo}/actions/runs/{rps_runs[0]['id']}/jobs?per_page=100")
                  for job in jobs.get("jobs", []):
                      if job.get("name") == "rps-publish-gate" and job.get("conclusion") == "success":
                          rps_ok = True
                          print("rps-publish-gate green:", rps_runs[0].get("html_url"))
                          break
              if not rps_ok:
                  print("no successful rps-publish-gate on this SHA")

          green = merge_ok and rps_ok
          path = os.environ["GITHUB_OUTPUT"]
          with open(path, "a", encoding="utf-8") as handle:
              handle.write(f"green={'true' if green else 'false'}\n")
          PY

  # Cold fallback when this SHA has no green develop/beta/stable push evidence.
  # Parallel layout matches develop; job name stays `test` for release-gate.
  # Dry-runs skip this: the PR .NET merge-gate already covered the same tree.
  test:
    needs: [resolve-version, gate-evidence]
    if: needs.resolve-version.outputs.dry_run != 'true' && needs.gate-evidence.outputs.green != 'true'
    uses: ./.github/workflows/windows-full-tests.yml
    with:
      include_playwright_product_ui: true

  cli-e2e:
    needs: [resolve-version, gate-evidence]
    if: needs.resolve-version.outputs.dry_run != 'true' && needs.gate-evidence.outputs.green != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Linux Playwright OS deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2t64 || sudo apt-get install -y fonts-liberation libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2
      - name: Restore and build
        run: |
          dotnet restore src/Titanium.Web.Proxy.sln
          dotnet build src/Titanium.Cli/Titanium.Cli.csproj -c Release --no-restore
          dotnet build src/Titanium.Plus/Titanium.Plus.csproj -c Release --no-restore
          dotnet build tests/Titanium.E2E.Tests/Titanium.E2E.Tests.csproj -c Release --no-restore
      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $pw = Join-Path (Resolve-Path "tests/Titanium.E2E.Tests/bin/Release/net10.0") "playwright.ps1"
          & $pw install chromium
      - name: CLI process E2E
        run: |
          dotnet test tests/Titanium.E2E.Tests/Titanium.E2E.Tests.csproj -c Release --no-build --no-restore --nologo --filter "TestCategory=E2E"

  release-gate:
    name: release-gate
    needs: [resolve-version, gate-evidence, test, cli-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Accept a green push run or a green re-test
        env:
          DRY: ${{ needs.resolve-version.outputs.dry_run }}
          EVIDENCE: ${{ needs.gate-evidence.result }}
          GREEN: ${{ needs.gate-evidence.outputs.green }}
          TEST: ${{ needs.test.result }}
          CLI: ${{ needs.cli-e2e.result }}
        run: |
          set -euo pipefail
          if [[ "$DRY" == "true" ]]; then
            {
              echo "### release-gate path"
              echo "dry-run: the same tree is proven by the .NET pull_request run (merge-gate) and tree evidence; skipping cold re-test"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "dry-run: the same tree is proven by the .NET pull_request run (merge-gate) and tree evidence; skipping cold re-test"
            exit 0
          fi
          echo "evidence=$EVIDENCE green=$GREEN test=$TEST cli-e2e=$CLI"
          {
            echo "### release-gate path"
            echo "live: require gate-evidence success and a green push or cold re-test"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$EVIDENCE" != "success" ]]; then
            echo "::error::gate-evidence=$EVIDENCE"
            exit 1
          fi
          for result in "$TEST" "$CLI"; do
            if [[ "$result" == "success" ]]; then
              continue
            fi
            if [[ "$result" == "skipped" && "$GREEN" == "true" ]]; then
              continue
            fi
            echo "::error::re-test finished as $result (push evidence green=$GREEN)"
            exit 1
          done

  # Publish jobs wait here so builds and product-smoke can overlap soak/readiness.
  publish-gate:
    name: publish-gate
    needs: [resolve-version, release-readiness]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require release-readiness before publish
        env:
          READY: ${{ needs.release-readiness.result }}
          DRY: ${{ needs.resolve-version.outputs.dry_run }}
        run: |
          set -euo pipefail
          echo "release-readiness=$READY dry_run=$DRY"
          if [[ "$READY" != "success" ]]; then
            echo "::error::publish-gate requires release-readiness success (got $READY)"
            exit 1
          fi

  # PR dry-runs use environment "signing". Fail here when the branch policy
  # is readable and rejects the ref, before the matrix spends a runner.
  signing-environment:
    needs: resolve-version
    if: needs.resolve-version.outputs.dry_run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Deployment branch policy admits this ref
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash tools/ci/assert-signing-environment.sh

  publish-preflight:
    needs: resolve-version
    if: needs.resolve-version.outputs.dry_run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Catalog secrets and publish script self-tests
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CHOCOLATEY_API_KEY:-}" ]]; then
            echo "::error::CHOCOLATEY_API_KEY must be set before a dry-run cut"
            exit 1
          fi
          if [[ -z "${HOMEBREW_TAP_TOKEN:-}" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN must be set before a dry-run cut"
            exit 1
          fi
          GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api repos/justcoding121/homebrew-titanium --jq .full_name
          python3 tools/ci/reflow-release-notes.py --self-test
          chmod +x tools/packaging/homebrew/bump-formula-from-sums.sh
          bash tools/packaging/homebrew/bump-formula-from-sums.sh --self-test

  build-cli:
    needs: [resolve-version, release-gate, signing-environment, publish-preflight]
    # always(): a skipped ancestor (green push evidence skips test/cli-e2e) skips this job without it.
    # signing-environment and publish-preflight run only for dry_run; a tag push skips them.
    if: |
      always() &&
      needs.release-gate.result == 'success' &&
      (needs.signing-environment.result == 'success' || needs.signing-environment.result == 'skipped') &&
      (needs.publish-preflight.result == 'success' || needs.publish-preflight.result == 'skipped')
    runs-on: ${{ matrix.os }}
    # win-x64 uses environment "signing" for Azure OIDC (federated cred).
    environment: ${{ matrix.rid == 'win-x64' && 'signing' || '' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Legs run on separate VMs; max-parallel does not change a leg's disk usage.
      # Put macOS and Windows first: they are slowest to acquire and on the critical path.
      max-parallel: 7
      matrix:
        include:
          - rid: osx-arm64
            os: macos-latest
          # osx-x64 Lua is compiled on the host, so this leg needs Intel. macos-13 no longer has runners.
          - rid: osx-x64
            os: macos-15-intel
          - rid: win-x64
            os: windows-latest
          # Lua shim builds only on a matching OS/arch host; arm/musl use native or Alpine runners.
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: linux-musl-x64
            os: ubuntu-latest
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker system prune -af || true
          df -h
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v6
        with:
          path: |
            tools/packaging/.cache/http3-natives
            tools/packaging/.cache/scripting-natives
          key: http3-natives-${{ hashFiles('tools/packaging/http3-native.lock.json', 'tools/packaging/scripting-native.lock.json') }}-${{ matrix.rid }}
          # Exact RID only — cross-RID restore-keys previously pulled linux-x64 into musl jobs.
      - name: Publish Cli
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $rid = "${{ matrix.rid }}"
          $out = "artifacts/cli/$rid"
          $ver = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.0.0" }
          # Stamp InformationalVersion (e.g. 7.0.5-beta) while assembly Version stays numeric.
          $publishArgs = @("-c", "Release", "-r", $rid, "--self-contained", "true", "-o", $out, "-p:Version=$ver")
          if ($rid -eq "win-x64") {
            # One exe, no titanium.dll beside it: the .NET apphost does not resolve symlinks, so the
            # multi-file layout fails under winget (WinGet\Links\twp.exe -> titanium.dll not found).
            $publishArgs += @("-p:PublishSingleFile=true", "-p:EnableCompressionInSingleFile=true")
          }
          dotnet publish src/Titanium.Cli/Titanium.Cli.csproj @publishArgs
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed ($LASTEXITCODE)" }
          if (Test-Path "$out/titanium.exe") {
            Copy-Item "$out/titanium.exe" "$out/twp.exe"
          } elseif (Test-Path "$out/titanium") {
            Copy-Item "$out/titanium" "$out/twp"
          }
          if ($rid -like "linux-musl-*") {
            & bash ./tools/packaging/linux/wrap-musl-cli.sh $out
            if ($LASTEXITCODE -ne 0) { throw "musl ICU wrapper failed ($LASTEXITCODE)" }
          }
          ./tools/packaging/bundle-http3-native.ps1 -Rid $rid -PublishDir $out
      - name: Verify host OpenSSL loads with bundled MsQuic (Cli)
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-musl-x64'
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          out="artifacts/cli/$rid"
          chmod +x tools/packaging/linux/verify-native-load.sh
          if [[ "$rid" == linux-x64 ]]; then
            images=(debian:trixie ubuntu:22.04 ubuntu:26.04)
            kind=apt
          else
            images=(alpine:3.24 alpine:edge)
            kind=apk
          fi
          for image in "${images[@]}"; do
            ./tools/packaging/linux/verify-native-load.sh "$out" "$image" "$kind"
          done
      # Scripting natives (Lua + shim, Wasmtime). Hard-fail for every shipping RID: release zips must
      # ship both files so `titanium scripting-deps status` reports loaded. Lua needs a matching host
      # (see matrix OS), an Alpine container for linux-musl-x64, or musl-gcc for linux-musl-arm64.
      - name: Bundle scripting natives (Cli)
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          ./tools/packaging/bundle-scripting-native.ps1 -Rid $rid -PublishDir "artifacts/cli/$rid" -Strict
      - name: Bundle scripting natives (Cli, musl via Alpine)
        if: matrix.rid == 'linux-musl-x64'
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          out="artifacts/cli/$rid"
          # Wasmtime archive is RID-specific and downloads on any host; Lua must compile on musl.
          pwsh -NoProfile -File ./tools/packaging/bundle-scripting-native.ps1 -Rid "$rid" -PublishDir "$out" -SkipLua
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/src" -w /src \
            mcr.microsoft.com/powershell:lts-alpine-3.17 \
            sh -c "apk add --no-cache build-base curl ca-certificates icu-libs \
              && pwsh -NoProfile -File tools/packaging/bundle-scripting-native.ps1 -Rid '$rid' -PublishDir '$out' -SkipWasmtime -Strict"
          test -f "$out/liblua54.so"
      - name: Bundle scripting natives (Cli, musl-arm64 via musl-gcc)
        if: matrix.rid == 'linux-musl-arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # PowerShell Alpine tags are linux/amd64 only, so this arm64 runner cannot start them.
          export CC=musl-gcc
          pwsh -NoProfile -File ./tools/packaging/bundle-scripting-native.ps1 \
            -Rid linux-musl-arm64 -PublishDir artifacts/cli/linux-musl-arm64 -Strict
          test -f artifacts/cli/linux-musl-arm64/liblua54.so
          test -f artifacts/cli/linux-musl-arm64/libwasmtime.so
      - name: Azure login (OIDC)
        if: matrix.rid == 'win-x64'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign CLI Windows binaries
        if: matrix.rid == 'win-x64'
        uses: ./.github/actions/azure-artifact-sign
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          description: Titanium Web Proxy CLI
          files: |
            ${{ github.workspace }}\artifacts\cli\win-x64\titanium.exe
            ${{ github.workspace }}\artifacts\cli\win-x64\twp.exe
      - name: Zip Cli
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $out = "artifacts/cli/$rid"
          Copy-Item tools/packaging/THIRD-PARTY-CLI.txt "$out/THIRD-PARTY-CLI.txt"
          if ($IsWindows) {
            Compress-Archive -Path "$out/*" -DestinationPath "Titanium.Cli-$rid.zip"
          } else {
            Push-Location $out
            try { zip -r "../../../Titanium.Cli-$rid.zip" . } finally { Pop-Location }
          }
      - name: Smoke the CLI zip
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'cli-zip-smoke'
          Expand-Archive -Path "Titanium.Cli-win-x64.zip" -DestinationPath $dir -Force
          Get-ChildItem -LiteralPath $dir -Recurse -File | Unblock-File
          $exe = Join-Path $dir 'titanium.exe'
          & $exe version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe healthcheck --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Winget symlink smoke (win-x64)
        # winget portable installs create WinGet\Links symlinks to titanium.exe and twp.exe.
        # A multi-file publish fails there; this gate runs before any GitHub Release is published.
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./tools/packaging/winget/test-links-symlink.ps1 -Zip "Titanium.Cli-win-x64.zip"
      - name: Sign and notarize CLI (macOS)
        if: startsWith(matrix.rid, 'osx-')
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE_P12:-}" ]]; then
            echo "Apple secrets not set — skipping macOS CLI notarize"
            exit 0
          fi
          chmod +x tools/packaging/osx/sign-and-notarize.sh
          # Sign main binaries inside the publish dir, then re-zip
          rid="${{ matrix.rid }}"
          out="artifacts/cli/$rid"
          chmod +x "$out/titanium" "$out/twp" 2>/dev/null || true
          # Homebrew-sourced dylibs often arrive as 0444; normalize so a later
          # in-place update can overwrite them with cp (see BuildUnixScript).
          chmod 644 "$out"/libssl.3.dylib "$out"/libcrypto.3.dylib "$out"/libmsquic.dylib 2>/dev/null || true
          # Every Mach-O in the publish directory, including dylibs. The zip notarization
          # below rejects an unsigned nested binary, and that step no longer ignores failure.
          ./tools/packaging/osx/sign-and-notarize.sh "$out" tools/packaging/osx/TitaniumCli.entitlements
          rm -f "Titanium.Cli-$rid.zip"
          (cd "$out" && zip -r "../../../Titanium.Cli-$rid.zip" .)
          ./tools/packaging/osx/sign-and-notarize.sh "Titanium.Cli-$rid.zip"
      - name: Linux packages (AppImage + deb/rpm)
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64'
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          ver="${RELEASE_VERSION%%-*}"
          # Keep the prerelease suffix so 8.0.4-beta sorts below 8.0.4 in apt/rpm.
          pkg_ver="$RELEASE_VERSION"
          arch=x86_64
          [[ "$rid" == *arm64* ]] && arch=aarch64
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync imagemagick ruby ruby-dev build-essential rpm squashfs-tools file || true
          sudo gem install --no-document fpm
          command -v fpm >/dev/null
          chmod +x tools/packaging/linux/build-appimage.sh tools/packaging/linux/build-deb-rpm.sh
          # AppImage is required for glibc RIDs (fail hard — no soft-fail).
          ./tools/packaging/linux/build-appimage.sh cli "artifacts/cli/$rid" \
            "Titanium.Cli-$rid.AppImage" "$ver" "$arch"
          ./tools/packaging/linux/build-deb-rpm.sh cli "artifacts/cli/$rid" . "$pkg_ver" "$rid"
      - name: Stage CLI artifacts
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          mkdir -p "staged-cli-$rid"
          cp "Titanium.Cli-$rid.zip" "staged-cli-$rid/"
          for ext in AppImage deb rpm; do
            f="Titanium.Cli-$rid.$ext"
            [[ -f "$f" ]] && cp "$f" "staged-cli-$rid/" || true
          done
          bash tools/packaging/smoke/write-checksums.sh "staged-cli-$rid"
          ls -la "staged-cli-$rid"
      - name: Assert CLI release assets
        shell: pwsh
        run: ./tools/ci/assert-release-assets.ps1 -StageDir "staged-cli-${{ matrix.rid }}" -Product cli -Rid "${{ matrix.rid }}"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.rid }}
          path: staged-cli-${{ matrix.rid }}/
          if-no-files-found: error
  build-plus:
    needs: [resolve-version, release-gate, signing-environment, publish-preflight]
    # always(): a skipped ancestor (green push evidence skips test/cli-e2e) skips this job without it.
    if: |
      always() &&
      needs.release-gate.result == 'success' &&
      (needs.signing-environment.result == 'success' || needs.signing-environment.result == 'skipped') &&
      (needs.publish-preflight.result == 'success' || needs.publish-preflight.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build Plus bundle
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "0.0.0-dev" }
          ./tools/packaging/plus-bundle/build-plus-bundle.ps1 -Tag $tag -Version $env:RELEASE_VERSION -OutputDirectory .
      - name: Assert Plus release assets
        shell: pwsh
        run: ./tools/ci/assert-release-assets.ps1 -StageDir . -Product plus
      - uses: actions/upload-artifact@v7
        with:
          name: plus
          path: |
            Titanium.Plus-*.zip
            Titanium.Plus-*.dll

  build-inspector:
    needs: [resolve-version, release-gate, signing-environment, publish-preflight]
    # always(): a skipped ancestor (green push evidence skips test/cli-e2e) skips this job without it.
    if: |
      always() &&
      needs.release-gate.result == 'success' &&
      (needs.signing-environment.result == 'success' || needs.signing-environment.result == 'skipped') &&
      (needs.publish-preflight.result == 'success' || needs.publish-preflight.result == 'skipped')
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.rid == 'win-x64' && 'signing' || '' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Legs run on separate VMs. Put macOS and Windows first on the critical path.
      max-parallel: 7
      matrix:
        include:
          - rid: osx-arm64
            os: macos-latest
            msi: false
          - rid: osx-x64
            # Same Intel runner as CLI osx-x64: Homebrew libmsquic must match the x86_64 apphost.
            os: macos-15-intel
            msi: false
          - rid: win-x64
            os: windows-latest
            msi: true
          - rid: linux-x64
            os: ubuntu-latest
            msi: false
          - rid: linux-arm64
            os: ubuntu-latest
            msi: false
          - rid: linux-musl-x64
            os: ubuntu-latest
            msi: false
          - rid: linux-musl-arm64
            os: ubuntu-latest
            msi: false
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker system prune -af || true
          df -h
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v6
        with:
          path: |
            tools/packaging/.cache/http3-natives
            tools/packaging/.cache/scripting-natives
          key: http3-natives-${{ hashFiles('tools/packaging/http3-native.lock.json', 'tools/packaging/scripting-native.lock.json') }}-${{ matrix.rid }}
          # Exact RID only — avoid cross-RID cache pollution (see build-cli).
      - name: Publish Inspector
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $rid = "${{ matrix.rid }}"
          $out = "artifacts/inspector/$rid"
          $ver = $env:RELEASE_VERSION
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "0.0.0" }
          # Stamp InformationalVersion (e.g. 7.0.5-beta) while assembly Version stays numeric.
          dotnet publish src/Titanium.Inspector/Titanium.Inspector.csproj -c Release -r $rid --self-contained true -o $out -p:Version=$ver
          if ($rid -like 'linux*') {
            # Same RID as Inspector so glibc/musl floors match. Dead-app proxy clear (no Avalonia).
            $clearOut = Join-Path $env:RUNNER_TEMP "titanium-inspector-clear-$rid"
            New-Item -ItemType Directory -Force -Path $clearOut | Out-Null
            dotnet publish src/Titanium.Inspector.ClearProxy/Titanium.Inspector.ClearProxy.csproj `
              -c Release -r $rid --self-contained true -p:PublishSingleFile=true `
              -o $clearOut -p:Version=$ver
            $clearBin = Join-Path $clearOut "titanium-inspector-clear"
            if (-not (Test-Path $clearBin)) { $clearBin = Join-Path $clearOut "titanium-inspector-clear.exe" }
            if (-not (Test-Path $clearBin)) { throw "titanium-inspector-clear missing after publish ($rid)" }
            $clearLen = (Get-Item $clearBin).Length
            if ($clearLen -lt 1MB) { throw "titanium-inspector-clear looks truncated ($clearLen bytes); expected single-file publish" }
            Copy-Item -Force $clearBin (Join-Path $out "titanium-inspector-clear")
          }
          ./tools/packaging/bundle-http3-native.ps1 -Rid $rid -PublishDir $out
          Copy-Item -Force tools/packaging/THIRD-PARTY-INSPECTOR.txt (Join-Path $out "THIRD-PARTY-INSPECTOR.txt")
          Copy-Item -Force src/Titanium.Inspector/Assets/app.ico (Join-Path $out "app.ico")
          Copy-Item -Force tools/packaging/desktop-icons.sh $out
          if ($rid -like 'linux*') {
            Copy-Item -Force tools/packaging/linux/install.sh, tools/packaging/linux/uninstall.sh, tools/packaging/linux/TitaniumInspector.desktop.in $out
            Copy-Item -Force tools/packaging/icons/titanium-inspector.png $out
            Copy-Item -Force (Get-ChildItem tools/packaging/icons/titanium-inspector-*.png) $out
          }
          if ($rid -like 'osx*') {
            Copy-Item -Force tools/packaging/osx/install-app.sh, tools/packaging/osx/uninstall-app.sh $out
            Copy-Item -Force tools/packaging/icons/AppIcon.icns $out
          }
      - name: Verify host OpenSSL loads with bundled MsQuic (Inspector)
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-musl-x64'
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          out="artifacts/inspector/$rid"
          chmod +x tools/packaging/linux/verify-native-load.sh
          if [[ "$rid" == linux-x64 ]]; then
            images=(debian:trixie ubuntu:22.04 ubuntu:26.04)
            kind=apt
          else
            images=(alpine:3.24 alpine:edge)
            kind=apk
          fi
          for image in "${images[@]}"; do
            ./tools/packaging/linux/verify-native-load.sh "$out" "$image" "$kind"
          done
      # Inspector does not register Lua/WASM engines; do not ship scripting natives in Inspector zips.
      - name: Azure login (OIDC)
        if: matrix.rid == 'win-x64'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Inspector Windows binary
        if: matrix.rid == 'win-x64'
        uses: ./.github/actions/azure-artifact-sign
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          description: Titanium Inspector
          files: ${{ github.workspace }}\artifacts\inspector\win-x64\TitaniumInspector.exe
      - name: Zip Inspector
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $out = "artifacts/inspector/$rid"
          if ($rid -like 'linux*') {
            $clear = Join-Path $out "titanium-inspector-clear"
            if (-not (Test-Path $clear)) { throw "zip payload missing titanium-inspector-clear for $rid" }
          }
          if ($IsWindows) {
            Compress-Archive -Path "$out/*" -DestinationPath "TitaniumInspector-$rid.zip"
          } else {
            Push-Location $out
            try { zip -r "../../../TitaniumInspector-$rid.zip" . } finally { Pop-Location }
          }
      - name: Build MSI (WiX)
        if: matrix.msi
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $ver = $env:RELEASE_VERSION
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = "7.0.0" }
          $ver = ($ver -split "-")[0]
          ./tools/packaging/build-inspector-msi.ps1 `
            -PayloadDir artifacts/inspector/win-x64 `
            -OutputMsi TitaniumInspector-win-x64.msi `
            -Version $ver
      - name: Sign Inspector MSI
        if: matrix.msi
        uses: ./.github/actions/azure-artifact-sign
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          description: Titanium Inspector
          files: ${{ github.workspace }}\TitaniumInspector-win-x64.msi
      - name: Build / sign / notarize Inspector DMG (macOS)
        if: startsWith(matrix.rid, 'osx-')
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.resolve-version.outputs.channel }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          ver="${RELEASE_VERSION%%-*}"
          chmod +x tools/packaging/osx/build-app-bundle.sh \
            tools/packaging/osx/build-dmg.sh \
            tools/packaging/osx/sign-and-notarize.sh
          ./tools/packaging/osx/build-app-bundle.sh \
            "artifacts/inspector/$rid" "TitaniumInspector.app" "$ver"
          if [[ -n "${APPLE_CERTIFICATE_P12:-}" ]]; then
            if [[ "${RELEASE_CHANNEL}" == "stable" ]]; then
              ./tools/packaging/osx/sign-and-notarize.sh \
                TitaniumInspector.app tools/packaging/osx/TitaniumInspector.entitlements
            else
              ./tools/packaging/osx/sign-and-notarize.sh \
                TitaniumInspector.app tools/packaging/osx/TitaniumInspector.entitlements \
                || echo "::warning::Inspector .app notarize failed (codesign may still be present); accept pending Apple developer agreements and re-run release.yml"
            fi
          else
            echo "Apple secrets not set — building unsigned DMG for CI artifact shape"
          fi
          ./tools/packaging/osx/build-dmg.sh \
            TitaniumInspector.app "TitaniumInspector-$rid.dmg" "Titanium Inspector"
          if [[ -n "${APPLE_CERTIFICATE_P12:-}" ]]; then
            if [[ "${RELEASE_CHANNEL}" == "stable" ]]; then
              ./tools/packaging/osx/sign-and-notarize.sh "TitaniumInspector-$rid.dmg"
            else
              ./tools/packaging/osx/sign-and-notarize.sh "TitaniumInspector-$rid.dmg" \
                || echo "::warning::Inspector DMG notarize failed on beta channel"
            fi
          fi
      - name: Linux packages (AppImage + deb/rpm)
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64'
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          ver="${RELEASE_VERSION%%-*}"
          # Keep the prerelease suffix so 8.0.4-beta sorts below 8.0.4 in apt/rpm.
          pkg_ver="$RELEASE_VERSION"
          arch=x86_64
          [[ "$rid" == *arm64* ]] && arch=aarch64
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync imagemagick ruby ruby-dev build-essential rpm squashfs-tools file || true
          sudo gem install --no-document fpm
          command -v fpm >/dev/null
          chmod +x tools/packaging/linux/build-appimage.sh tools/packaging/linux/build-deb-rpm.sh
          # AppImage is required for glibc RIDs (fail hard — no soft-fail).
          ./tools/packaging/linux/build-appimage.sh inspector "artifacts/inspector/$rid" \
            "TitaniumInspector-$rid.AppImage" "$ver" "$arch"
          ./tools/packaging/linux/build-deb-rpm.sh inspector "artifacts/inspector/$rid" . "$pkg_ver" "$rid"
          if [[ -f "TitaniumInspector-${rid}.deb" ]]; then
            # Buffer the listing first: with pipefail, `dpkg-deb -c | grep -q` can SIGPIPE
            # tar when grep exits early and fail the step even though the member is present.
            deb_contents=$(dpkg-deb -c "TitaniumInspector-${rid}.deb")
            if grep -q 'clear-proxy-if-stopped\.sh' <<<"$deb_contents"; then
              echo "error: .deb still ships clear-proxy-if-stopped.sh" >&2
              exit 1
            fi
            if ! grep -q 'titanium-inspector-clear' <<<"$deb_contents"; then
              echo "error: .deb missing titanium-inspector-clear" >&2
              exit 1
            fi
          fi
      - name: Stage Inspector artifacts
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          mkdir -p "staged-inspector-$rid"
          cp "TitaniumInspector-$rid.zip" "staged-inspector-$rid/"
          for ext in msi AppImage deb rpm dmg; do
            f="TitaniumInspector-$rid.$ext"
            [[ -f "$f" ]] && cp "$f" "staged-inspector-$rid/" || true
          done
          bash tools/packaging/smoke/write-checksums.sh "staged-inspector-$rid"
          ls -la "staged-inspector-$rid"
      - name: Assert Inspector release assets
        shell: pwsh
        run: ./tools/ci/assert-release-assets.ps1 -StageDir "staged-inspector-${{ matrix.rid }}" -Product inspector -Rid "${{ matrix.rid }}"
      - uses: actions/upload-artifact@v7
        with:
          name: inspector-${{ matrix.rid }}
          if-no-files-found: error
          path: staged-inspector-${{ matrix.rid }}/

  # Build the images once. product-smoke loads this OCI layout; publish copies it.
  build-images:
    needs: [resolve-version, release-gate, signing-environment, publish-preflight]
    if: |
      always() &&
      needs.release-gate.result == 'success' &&
      (needs.signing-environment.result == 'success' || needs.signing-environment.result == 'skipped') &&
      (needs.publish-preflight.result == 'success' || needs.publish-preflight.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: proxy
            file: tools/packaging/docker/Dockerfile
          - name: gateway
            file: tools/packaging/docker/Dockerfile.gateway
          - name: manager
            file: tools/packaging/docker/Dockerfile.manager
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: OCI layout, no push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image.oci.tar
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ needs.resolve-version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: image-oci-${{ matrix.name }}
          path: ${{ runner.temp }}/image.oci.tar
          if-no-files-found: error

  build-charts:
    needs: [resolve-version, release-gate, signing-environment, publish-preflight]
    if: |
      always() &&
      needs.release-gate.result == 'success' &&
      (needs.signing-environment.result == 'success' || needs.signing-environment.result == 'skipped') &&
      (needs.publish-preflight.result == 'success' || needs.publish-preflight.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.17.3
      - name: Lint, template, and package once
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: bash tools/packaging/smoke/helm-static.sh "$PWD/charts"
      - name: Assert charts release assets
        shell: pwsh
        run: ./tools/ci/assert-release-assets.ps1 -StageDir charts -Product charts
      - uses: actions/upload-artifact@v7
        with:
          name: charts
          path: charts/
          if-no-files-found: error

  smoke-http3:
    needs: build-cli
    # always(): skipped test/cli-e2e ancestors otherwise skip this job after a green push path.
    if: always() && needs.build-cli.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            container: ""
          - rid: linux-musl-x64
            container: alpine:3.24
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cli-${{ matrix.rid }}
          path: dist
      - name: Smoke QuicListener (host ubuntu / glibc)
        if: matrix.container == ''
        run: |
          set -euo pipefail
          unzip -q dist/Titanium.Cli-${{ matrix.rid }}.zip -d cli
          chmod +x cli/titanium
          # Soft probe: http3-deps status exits 0 and prints IsSupported
          ./cli/titanium http3-deps status | tee smoke-out.txt
          grep -qi 'IsSupported' smoke-out.txt
          # Bundled natives must be present for glibc zip
          test -e cli/libmsquic.so -o -e cli/libmsquic.so.2 -o -e cli/libmsquic.so.2.6.0
      - name: Smoke QuicListener (Alpine musl container)
        if: matrix.container != ''
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: ${{ matrix.container }}
          options: -v ${{ github.workspace }}/dist:/dist
          run: |
            set -euo pipefail
            apk add --no-cache unzip libstdc++ libgcc icu-libs
            unzip -q /dist/Titanium.Cli-${{ matrix.rid }}.zip -d /cli
            chmod +x /cli/titanium
            /cli/titanium http3-deps status | tee /cli/smoke-out.txt
            grep -qi 'IsSupported' /cli/smoke-out.txt
            test -e /cli/libmsquic.so -o -e /cli/libmsquic.so.2 -o -e /cli/libmsquic.so.2.5.7

  smoke-scripting:
    needs: build-cli
    # always(): skipped test/cli-e2e ancestors otherwise skip this job after a green push path.
    if: always() && needs.build-cli.result == 'success'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cli-${{ matrix.rid }}
          path: dist
      - name: Smoke scripting natives (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          unzip -q dist/Titanium.Cli-${{ matrix.rid }}.zip -d cli
          chmod +x cli/titanium
          test -f cli/liblua54.so
          test -f cli/libwasmtime.so
          ./cli/titanium scripting-deps status | tee smoke-scripting.txt
          grep -qi 'Lua: loaded' smoke-scripting.txt
          grep -qi 'Wasmtime: loaded' smoke-scripting.txt
      - name: Smoke scripting natives (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -Path "dist/Titanium.Cli-${{ matrix.rid }}.zip" -DestinationPath cli -Force
          if (-not (Test-Path cli/lua54.dll)) { throw 'lua54.dll missing from win-x64 CLI zip' }
          if (-not (Test-Path cli/wasmtime.dll)) { throw 'wasmtime.dll missing from win-x64 CLI zip' }
          & ./cli/titanium.exe scripting-deps status | Tee-Object -FilePath smoke-scripting.txt
          $text = Get-Content -Raw smoke-scripting.txt
          if ($text -notmatch 'Lua:\s*loaded') { throw 'Lua not loaded in scripting-deps status' }
          if ($text -notmatch 'Wasmtime:\s*loaded') { throw 'Wasmtime not loaded in scripting-deps status' }

  # Stable-only Linux product RPS smoke (not wiki-grade 3-OS median-of-3).
  # Beta channel skips this; spot + editions already ran on the merge SHA.
  rps-product-smoke:
    needs: [resolve-version]
    if: needs.resolve-version.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # Same host as rps-saturation: net10.0 IL on the .NET 11 shared framework.
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Ensure MsQuic
        uses: ./.github/actions/ensure-msquic
      - name: compare-product-smoke (Linux)
        shell: pwsh
        run: |
          pwsh tools/RpsLoadProbe/run-rps.ps1 `
            -Mode compare-product-smoke `
            -Concurrency '8,16,32,64' `
            -WarmupSec 2 `
            -DurationSec 8 `
            -Repeats 1 `
            -ResultsDir tools/RpsLoadProbe/results `
            -BombardierCheck
          $csv = Get-ChildItem tools/RpsLoadProbe/results -Filter 'rps-ramp-*.csv' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $csv) { throw 'No CSV found for compare-product-smoke gate validation' }
          pwsh tools/RpsLoadProbe/validate-compare-product-gates.ps1 -CsvPath $csv.FullName
      - name: Upload smoke CSV
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rps-product-smoke-csv
          path: tools/RpsLoadProbe/results/rps-ramp-*.csv
          if-no-files-found: ignore

  product-smoke:
    needs: [resolve-version, build-cli, build-plus, build-inspector, build-images, build-charts]
    if: |
      always() &&
      needs.build-cli.result == 'success' &&
      needs.build-plus.result == 'success' &&
      needs.build-inspector.result == 'success' &&
      needs.build-images.result == 'success' &&
      needs.build-charts.result == 'success'
    permissions:
      contents: read
      packages: read
      actions: read
      issues: write
    uses: ./.github/workflows/product-smoke.yml
    with:
      source: run-artifacts
      tag: ${{ needs.resolve-version.outputs.release_tag }}
      version: ${{ needs.resolve-version.outputs.version }}
      advisory: false
      browsers: required
    secrets: inherit

  publish-release:
    needs: [resolve-version, publish-gate, build-cli, build-plus, build-inspector, smoke-http3, smoke-scripting, rps-product-smoke, product-smoke]
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true') &&
      needs.resolve-version.result == 'success' &&
      needs.publish-gate.result == 'success' &&
      needs.build-cli.result == 'success' &&
      needs.build-plus.result == 'success' &&
      needs.build-inspector.result == 'success' &&
      needs.smoke-http3.result == 'success' &&
      needs.smoke-scripting.result == 'success' &&
      needs.product-smoke.result == 'success' &&
      needs.resolve-version.outputs.dry_run != 'true' &&
      (needs.rps-product-smoke.result == 'success' || needs.rps-product-smoke.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Attach MIT NuGet SBOM when present
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p artifacts/sbom
          # Optional artifact from .NET / publish (same SHA cut); ignore if missing.
          if [[ -d artifacts/mit-nuget-sbom ]]; then
            cp -a artifacts/mit-nuget-sbom/. artifacts/sbom/ || true
          fi
      - name: Build release-manifest and create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.resolve-version.outputs.channel }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="$RELEASE_VERSION"
          CHANNEL="$RELEASE_CHANNEL"
          export RELEASE_TAG VERSION
          mkdir -p dist
          find artifacts -type f \( \
            -name '*.zip' -o -name '*.dll' -o -name '*.msi' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \
            -o -name '*.cdx.json' \
          \) -exec cp {} dist/ \;
          # Prefer explicit SBOM folder copied by the prior step when present.
          if [[ -d artifacts/sbom ]]; then
            cp -a artifacts/sbom/. dist/ || true
          fi
          python3 tools/ci/build-release-manifest.py \
            --dist dist \
            --output dist/release-manifest.json \
            --tag "$TAG" \
            --version "$VERSION"
          chmod +x tools/packaging/sign-checksums.sh
          ./tools/packaging/sign-checksums.sh dist
          python3 tools/ci/verify-release-manifest.py \
            --manifest dist/release-manifest.json \
            --sums dist/SHA256SUMS \
            --stage-dir dist \
            --tag "$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
            git tag -f -a "$TAG" -m "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
          fi
          PRE=""
          if [[ "$CHANNEL" == "beta" ]]; then PRE="--prerelease"; fi
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            $PRE
          # Highlights (tools/packaging/release-highlights/<version>.md) are prepended and
          # flattened What's Changed bullets are reflowed by reflow-release-notes.py after
          # any commit-subject fallback below, not during it.
          # --generate-notes only lists merged PRs. Develop→beta cuts often have a single
          # "Release …" PR while product work was direct-pushed to develop — that still
          # produces a "What's Changed" heading with almost nothing useful. Fall back to
          # commit-subject bullets when notes are missing or thinner than 3 bullets.
          BODY="$(gh release view "$TAG" --json body -q .body 2>/dev/null || true)"
          BULLET_COUNT="$(printf '%s\n' "$BODY" | grep -c '^\* ' || true)"
          NEED_COMMIT_NOTES=false
          if [[ "$BODY" != *"What's Changed"* ]]; then NEED_COMMIT_NOTES=true; fi
          if [[ "$BULLET_COUNT" -lt 3 ]]; then NEED_COMMIT_NOTES=true; fi
          if [[ "$NEED_COMMIT_NOTES" == true ]]; then
            CUR_SHA="$(git rev-parse "${TAG}^{commit}" 2>/dev/null || echo "$GITHUB_SHA")"
            RANGE_PREV=""
            while read -r cand; do
              [[ -z "$cand" || "$cand" == "$TAG" ]] && continue
              cs="$(git rev-parse "${cand}^{commit}" 2>/dev/null || true)"
              [[ -n "$cs" && "$cs" != "$CUR_SHA" ]] || continue
              if git merge-base --is-ancestor "$cs" "$CUR_SHA" 2>/dev/null; then
                RANGE_PREV="$cand"
                break
              fi
            done < <(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName')
            NOTES_FILE="$(mktemp)"
            {
              echo "## What's Changed"
              if [[ -n "$RANGE_PREV" ]]; then
                # tformat ends every subject with a newline, including the last one.
                git log --no-merges --pretty=tformat:'* %s' "${RANGE_PREV}..${TAG}" \
                  | grep -Ev '^\* (Release |chore\(release\): bump product version)' || true
                echo ""
                echo ""
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${RANGE_PREV}...${TAG}"
              else
                echo "* See repository history for this tag."
              fi
            } > "$NOTES_FILE"
            if grep -q '^\* ' "$NOTES_FILE"; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            fi
            rm -f "$NOTES_FILE"
          fi
          python3 tools/ci/reflow-release-notes.py "$TAG"

      - name: Refresh website download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ needs.resolve-version.outputs.channel }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN `gh release create` does not fire `release: published` for
          # other workflows. Rebuild Pages so download.data.ts sees new zip/MSI assets.
          # github-pages environment only allows deploy from develop (beta/stable are
          # blocked by environment protection rules).
          echo "Dispatching deploy-website.yml --ref develop (channel=$RELEASE_CHANNEL)"
          gh workflow run deploy-website.yml --ref develop

  # Multi-arch container image on GHCR with an SBOM, provenance, and a keyless cosign signature.
  # Pull-request builds (no push) live in kubernetes-ci.yml.
  publish-image:
    needs: [resolve-version, publish-gate, release-gate, product-smoke]
    # always(): skipped test/cli-e2e ancestors otherwise skip this job after a green push path.
    if: |
      always() &&
      needs.publish-gate.result == 'success' &&
      needs.release-gate.result == 'success' &&
      needs.product-smoke.result == 'success' &&
      needs.resolve-version.outputs.dry_run != 'true' &&
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (OIDC)
    env:
      IMAGE: ghcr.io/justcoding121/titanium-web-proxy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image-oci-proxy
          path: oci
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # v7.0.27 -> 7.0.27, 7.0, 7 ; a beta channel release (7.0.27-beta) is only tagged with its full version.
          tags: |
            type=raw,value=${{ needs.resolve-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-version.outputs.release_tag }},enable=${{ needs.resolve-version.outputs.channel == 'stable' }}
            type=semver,pattern={{major}},value=${{ needs.resolve-version.outputs.release_tag }},enable=${{ needs.resolve-version.outputs.channel == 'stable' }}
            type=raw,value=latest,enable=${{ needs.resolve-version.outputs.channel == 'stable' }}
      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - id: publish
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAGS" > tags.txt
          bash tools/packaging/smoke/publish-oci.sh oci/image.oci.tar tags.txt
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image by digest (keyless)
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/release\.yml@"
  # The Gateway API controller image, published the same way (SBOM, provenance, keyless signature).
