name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'stable or beta'
        required: true
        default: 'stable'

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        name: Resolve release tag / channel
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            CHANNEL=stable
            if [[ "$VERSION" == *beta* || "$VERSION" == *-* ]]; then CHANNEL=beta; fi
          else
            CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
            PREFIX=$(grep -oP '(?<=<VersionPrefix>)[^<]+' src/Titanium.Web.Proxy/Titanium.Web.Proxy.csproj | head -n1)
            if [[ -z "$PREFIX" ]]; then echo "VersionPrefix not found"; exit 1; fi
            if [[ "$CHANNEL" == "beta" ]]; then
              VERSION="${PREFIX}-beta"
            else
              VERSION="$PREFIX"
            fi
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION channel=$CHANNEL"

  test:
    needs: resolve-version
    runs-on: windows-latest
    # Whole-sln `dotnet test` can hang forever on shared Windows runners (integration/TLS);
    # keep a hard ceiling and match beta push gates (per-project + blame-hang).
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build
        run: |
          dotnet restore src/Titanium.Web.Proxy.sln
          dotnet build src/Titanium.Web.Proxy.sln -c Release --no-restore
      - name: Test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($proj in @(
            'tests/Titanium.Web.Proxy.UnitTests/Titanium.Web.Proxy.UnitTests.csproj',
            'tests/Titanium.Web.Proxy.Configuration.Tests/Titanium.Web.Proxy.Configuration.Tests.csproj',
            'tests/Titanium.Plus.Tests/Titanium.Plus.Tests.csproj',
            'tests/Titanium.Inspector.Tests/Titanium.Inspector.Tests.csproj',
            'tests/Titanium.Cli.Tests/Titanium.Cli.Tests.csproj'
          )) {
            Write-Host "=== $proj ==="
            dotnet test $proj -c Release --no-build --no-restore --nologo --filter "TestCategory!=Slow&TestCategory!=E2E-UI-Window"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          Write-Host "=== E2E / E2E-UI ==="
          dotnet test tests/Titanium.E2E.Tests/Titanium.E2E.Tests.csproj -c Release --no-build --no-restore --nologo --filter "TestCategory=E2E|TestCategory=E2E-UI"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $maxAttempts = 2
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "=== Integration attempt $attempt of $maxAttempts ==="
            dotnet test tests/Titanium.Web.Proxy.IntegrationTests/Titanium.Web.Proxy.IntegrationTests.csproj `
              -c Release --no-build --no-restore --nologo --filter "TestCategory!=Slow" `
              --blame-hang --blame-hang-timeout 5m
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq $maxAttempts) { exit $LASTEXITCODE }
            Start-Sleep -Seconds 5
          }

          # Product release also requires Headless/Visual/Plus dashboard (same gates as ui-portable).
          $pw = Join-Path (Resolve-Path "tests/Titanium.E2E.Tests/bin/Release/net10.0") "playwright.ps1"
          & $pw install chromium
          dotnet test tests/Titanium.E2E.Tests/Titanium.E2E.Tests.csproj -c Release --no-build --nologo `
            --filter "TestCategory=E2E-UI-Headless|TestCategory=E2E-UI-Visual|TestCategory=E2E-UI-Plus-Dashboard"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


  build-cli:
    needs: [resolve-version, test]
    runs-on: ${{ matrix.os }}
    # win-x64 uses environment "signing" for Azure OIDC (federated cred).
    environment: ${{ matrix.rid == 'win-x64' && 'signing' || '' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Cap concurrency — many self-contained publishes on shared ubuntu runners run out of disk.
      # Musl + glibc matrix + Inspector/CLI together previously ENOSPCd even at 3.
      max-parallel: 2
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-latest
          - rid: linux-musl-x64
            os: ubuntu-latest
          - rid: linux-musl-arm64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker system prune -af || true
          df -h
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: tools/packaging/.cache/http3-natives
          key: http3-natives-${{ hashFiles('tools/packaging/http3-native.lock.json') }}-${{ matrix.rid }}
          # Exact RID only — cross-RID restore-keys previously pulled linux-x64 into musl jobs.
      - name: Publish Cli
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $out = "artifacts/cli/$rid"
          dotnet publish src/Titanium.Cli/Titanium.Cli.csproj -c Release -r $rid --self-contained true -o $out
          if (Test-Path "$out/titanium.exe") {
            Copy-Item "$out/titanium.exe" "$out/twp.exe"
          } elseif (Test-Path "$out/titanium") {
            Copy-Item "$out/titanium" "$out/twp"
          }
          ./tools/packaging/bundle-http3-native.ps1 -Rid $rid -PublishDir $out
      - name: Azure login (OIDC)
        if: matrix.rid == 'win-x64'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign CLI Windows binaries
        if: matrix.rid == 'win-x64'
        uses: ./.github/actions/azure-artifact-sign
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          description: Titanium Web Proxy CLI
          files: |
            ${{ github.workspace }}\artifacts\cli\win-x64\titanium.exe
            ${{ github.workspace }}\artifacts\cli\win-x64\twp.exe
      - name: Zip Cli
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $out = "artifacts/cli/$rid"
          if ($IsWindows) {
            Compress-Archive -Path "$out/*" -DestinationPath "Titanium.Cli-$rid.zip"
          } else {
            Push-Location $out
            try { zip -r "../../../Titanium.Cli-$rid.zip" . } finally { Pop-Location }
          }
      - name: Sign and notarize CLI (macOS)
        if: startsWith(matrix.rid, 'osx-')
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE_P12:-}" ]]; then
            echo "Apple secrets not set — skipping macOS CLI notarize"
            exit 0
          fi
          chmod +x tools/packaging/osx/sign-and-notarize.sh
          # Sign main binaries inside the publish dir, then re-zip
          rid="${{ matrix.rid }}"
          out="artifacts/cli/$rid"
          chmod +x "$out/titanium" "$out/twp" 2>/dev/null || true
          ./tools/packaging/osx/sign-and-notarize.sh "$out/titanium" tools/packaging/osx/TitaniumCli.entitlements
          ./tools/packaging/osx/sign-and-notarize.sh "$out/twp" tools/packaging/osx/TitaniumCli.entitlements || true
          rm -f "Titanium.Cli-$rid.zip"
          (cd "$out" && zip -r "../../../Titanium.Cli-$rid.zip" .)
          ./tools/packaging/osx/sign-and-notarize.sh "Titanium.Cli-$rid.zip" || true
      - name: Linux packages (AppImage + deb/rpm)
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64'
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          ver="${RELEASE_VERSION%%-*}"
          arch=x86_64
          [[ "$rid" == *arm64* ]] && arch=aarch64
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync imagemagick ruby ruby-dev build-essential rpm squashfs-tools file || true
          sudo gem install --no-document fpm || true
          chmod +x tools/packaging/linux/build-appimage.sh tools/packaging/linux/build-deb-rpm.sh
          # AppImage is required for glibc RIDs (fail hard — no soft-fail).
          ./tools/packaging/linux/build-appimage.sh cli "artifacts/cli/$rid" \
            "Titanium.Cli-$rid.AppImage" "$ver" "$arch"
          ./tools/packaging/linux/build-deb-rpm.sh cli "artifacts/cli/$rid" . "$ver" "$rid" || echo "deb/rpm soft-failed"
      - name: Stage CLI artifacts
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          mkdir -p "staged-cli-$rid"
          cp "Titanium.Cli-$rid.zip" "staged-cli-$rid/"
          for ext in AppImage deb rpm; do
            f="Titanium.Cli-$rid.$ext"
            [[ -f "$f" ]] && cp "$f" "staged-cli-$rid/" || true
          done
          ls -la "staged-cli-$rid"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: staged-cli-${{ matrix.rid }}/
          if-no-files-found: error
  build-plus:
    needs: [resolve-version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build Plus
        env:
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
        run: |
          dotnet build src/Titanium.Plus/Titanium.Plus.csproj -c Release -o artifacts/plus
          cp artifacts/plus/Titanium.Plus.dll "Titanium.Plus-${RELEASE_TAG}.dll"
      - uses: actions/upload-artifact@v4
        with:
          name: plus
          path: Titanium.Plus-*.dll

  build-inspector:
    needs: [resolve-version, test]
    runs-on: ${{ matrix.os }}
    environment: ${{ matrix.rid == 'win-x64' && 'signing' || '' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            msi: true
          - rid: linux-x64
            os: ubuntu-latest
            msi: false
          - rid: linux-arm64
            os: ubuntu-latest
            msi: false
          - rid: linux-musl-x64
            os: ubuntu-latest
            msi: false
          - rid: linux-musl-arm64
            os: ubuntu-latest
            msi: false
          - rid: osx-x64
            os: macos-latest
            msi: false
          - rid: osx-arm64
            os: macos-latest
            msi: false
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo docker system prune -af || true
          df -h
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: tools/packaging/.cache/http3-natives
          key: http3-natives-${{ hashFiles('tools/packaging/http3-native.lock.json') }}-${{ matrix.rid }}
          # Exact RID only — avoid cross-RID cache pollution (see build-cli).
      - name: Publish Inspector
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $out = "artifacts/inspector/$rid"
          dotnet publish src/Titanium.Inspector/Titanium.Inspector.csproj -c Release -r $rid --self-contained true -o $out
          ./tools/packaging/bundle-http3-native.ps1 -Rid $rid -PublishDir $out
          Copy-Item -Force tools/packaging/THIRD-PARTY-INSPECTOR.txt (Join-Path $out "THIRD-PARTY-INSPECTOR.txt")
          Copy-Item -Force src/Titanium.Inspector/Assets/app.ico (Join-Path $out "app.ico")
          if ($rid -like 'linux*') {
            Copy-Item -Force tools/packaging/linux/install.sh, tools/packaging/linux/uninstall.sh, tools/packaging/linux/TitaniumInspector.desktop.in $out
          }
          if ($rid -like 'osx*') {
            Copy-Item -Force tools/packaging/osx/install-app.sh, tools/packaging/osx/uninstall-app.sh $out
          }
      - name: Azure login (OIDC)
        if: matrix.rid == 'win-x64'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Inspector Windows binary
        if: matrix.rid == 'win-x64'
        uses: ./.github/actions/azure-artifact-sign
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          description: Titanium Inspector
          files: ${{ github.workspace }}\artifacts\inspector\win-x64\TitaniumInspector.exe
      - name: Zip Inspector
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $out = "artifacts/inspector/$rid"
          if ($IsWindows) {
            Compress-Archive -Path "$out/*" -DestinationPath "TitaniumInspector-$rid.zip"
          } else {
            Push-Location $out
            try { zip -r "../../../TitaniumInspector-$rid.zip" . } finally { Pop-Location }
          }
      - name: Build MSI (WiX)
        if: matrix.msi
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          $ver = $env:RELEASE_VERSION
          if ($ver -notmatch '^\d+\.\d+\.\d+') { $ver = "7.0.0" }
          $ver = ($ver -split "-")[0]
          ./tools/packaging/build-inspector-msi.ps1 `
            -PayloadDir artifacts/inspector/win-x64 `
            -OutputMsi TitaniumInspector-win-x64.msi `
            -Version $ver
      - name: Sign Inspector MSI
        if: matrix.msi
        uses: ./.github/actions/azure-artifact-sign
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          description: Titanium Inspector
          files: ${{ github.workspace }}\TitaniumInspector-win-x64.msi
      - name: Build / sign / notarize Inspector DMG (macOS)
        if: startsWith(matrix.rid, 'osx-')
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          ver="${RELEASE_VERSION%%-*}"
          chmod +x tools/packaging/osx/build-app-bundle.sh \
            tools/packaging/osx/build-dmg.sh \
            tools/packaging/osx/sign-and-notarize.sh
          ./tools/packaging/osx/build-app-bundle.sh \
            "artifacts/inspector/$rid" "TitaniumInspector.app" "$ver"
          if [[ -n "${APPLE_CERTIFICATE_P12:-}" ]]; then
            ./tools/packaging/osx/sign-and-notarize.sh \
              TitaniumInspector.app tools/packaging/osx/TitaniumInspector.entitlements
          else
            echo "Apple secrets not set — building unsigned DMG for CI artifact shape"
          fi
          ./tools/packaging/osx/build-dmg.sh \
            TitaniumInspector.app "TitaniumInspector-$rid.dmg" "Titanium Inspector"
          if [[ -n "${APPLE_CERTIFICATE_P12:-}" ]]; then
            ./tools/packaging/osx/sign-and-notarize.sh "TitaniumInspector-$rid.dmg" || true
          fi
      - name: Linux packages (AppImage + deb/rpm)
        if: matrix.rid == 'linux-x64' || matrix.rid == 'linux-arm64'
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          ver="${RELEASE_VERSION%%-*}"
          arch=x86_64
          [[ "$rid" == *arm64* ]] && arch=aarch64
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync imagemagick ruby ruby-dev build-essential rpm squashfs-tools file || true
          sudo gem install --no-document fpm || true
          chmod +x tools/packaging/linux/build-appimage.sh tools/packaging/linux/build-deb-rpm.sh
          # AppImage is required for glibc RIDs (fail hard — no soft-fail).
          ./tools/packaging/linux/build-appimage.sh inspector "artifacts/inspector/$rid" \
            "TitaniumInspector-$rid.AppImage" "$ver" "$arch"
          ./tools/packaging/linux/build-deb-rpm.sh inspector "artifacts/inspector/$rid" . "$ver" "$rid" \
            || echo "deb/rpm soft-failed"
      - name: Stage Inspector artifacts
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          mkdir -p "staged-inspector-$rid"
          cp "TitaniumInspector-$rid.zip" "staged-inspector-$rid/"
          for ext in msi AppImage deb rpm dmg; do
            f="TitaniumInspector-$rid.$ext"
            [[ -f "$f" ]] && cp "$f" "staged-inspector-$rid/" || true
          done
          ls -la "staged-inspector-$rid"
      - uses: actions/upload-artifact@v4
        with:
          name: inspector-${{ matrix.rid }}
          if-no-files-found: error
          path: staged-inspector-${{ matrix.rid }}/

  smoke-http3:
    needs: build-cli
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            container: ""
          - rid: linux-musl-x64
            container: alpine:3.24
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: dist
      - name: Smoke QuicListener (host ubuntu / glibc)
        if: matrix.container == ''
        run: |
          set -euo pipefail
          unzip -q dist/Titanium.Cli-${{ matrix.rid }}.zip -d cli
          chmod +x cli/titanium
          # Soft probe: http3-deps status exits 0 and prints IsSupported
          ./cli/titanium http3-deps status | tee smoke-out.txt
          grep -qi 'IsSupported' smoke-out.txt
          # Bundled natives must be present for glibc zip
          test -e cli/libmsquic.so -o -e cli/libmsquic.so.2 -o -e cli/libmsquic.so.2.6.0
      - name: Smoke QuicListener (Alpine musl container)
        if: matrix.container != ''
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: ${{ matrix.container }}
          options: -v ${{ github.workspace }}/dist:/dist
          run: |
            set -euo pipefail
            apk add --no-cache unzip libstdc++ libgcc icu-libs
            unzip -q /dist/Titanium.Cli-${{ matrix.rid }}.zip -d /cli
            chmod +x /cli/titanium
            /cli/titanium http3-deps status | tee /cli/smoke-out.txt
            grep -qi 'IsSupported' /cli/smoke-out.txt
            test -e /cli/libmsquic.so -o -e /cli/libmsquic.so.2 -o -e /cli/libmsquic.so.2.5.7

  publish-release:
    needs: [resolve-version, build-cli, build-plus, build-inspector, smoke-http3]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build release-manifest and create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.resolve-version.outputs.channel }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="$RELEASE_VERSION"
          CHANNEL="$RELEASE_CHANNEL"
          export RELEASE_TAG VERSION
          mkdir -p dist
          find artifacts -type f \( \
            -name '*.zip' -o -name '*.dll' -o -name '*.msi' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \
          \) -exec cp {} dist/ \;
          python3 - <<'PY'
          import hashlib, json, os, pathlib, datetime
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["VERSION"]
          channel = "beta" if ("-" in version or "beta" in version.lower()) else "stable"
          dist = pathlib.Path("dist")
          def sha(p):
            h = hashlib.sha256()
            h.update(p.read_bytes())
            return h.hexdigest()
          assets = {}
          for p in dist.iterdir():
            if p.is_file():
              assets[p.name] = {"path": str(p), "sha256": sha(p)}
          manifest = {
            "version": version,
            "channel": channel,
            "releasedUtc": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
            "abstractionsVersion": version.split("-")[0],
            "products": {
              "cli": {"assets": {}},
              "plus": {"requiredAbstractions": "7.0.0", "asset": None},
              "inspector": {"assets": {}},
            },
            "nuget": {
              "Titanium.Web.Proxy": version.split("-")[0],
              "Titanium.Web.Proxy.Abstractions": version.split("-")[0],
              "Titanium.Web.Proxy.Configuration": version.split("-")[0],
            },
          }
          def put(product, key, entry):
            manifest["products"][product]["assets"][key] = entry
          for name, meta in assets.items():
            url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/{name}"
            entry = {"url": url, "sha256": meta["sha256"]}
            if name.startswith("Titanium.Cli-"):
              stem = name.removeprefix("Titanium.Cli-")
              for ext in (".zip", ".AppImage", ".deb", ".rpm"):
                if stem.endswith(ext):
                  rid = stem[: -len(ext)]
                  key = rid if ext == ".zip" else f"{rid}{ext}"
                  put("cli", key, entry)
                  break
            elif name.startswith("TitaniumInspector-"):
              stem = name.removeprefix("TitaniumInspector-")
              if stem.endswith(".msi"):
                put("inspector", "win-x64-msi", entry)
              else:
                for ext in (".zip", ".AppImage", ".deb", ".rpm", ".dmg"):
                  if stem.endswith(ext):
                    rid = stem[: -len(ext)]
                    key = rid if ext == ".zip" else f"{rid}{ext}"
                    put("inspector", key, entry)
                    break
            elif name.startswith("Titanium.Plus"):
              manifest["products"]["plus"]["asset"] = entry
          pathlib.Path("dist/release-manifest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          PY
          chmod +x tools/packaging/sign-checksums.sh
          ./tools/packaging/sign-checksums.sh dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
            git tag -f -a "$TAG" -m "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
          fi
          PRE=""
          if [[ "$CHANNEL" == "beta" ]]; then PRE="--prerelease"; fi
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            $PRE
          # When GitHub finds no PR merges, --generate-notes is only a compare link.
          # Fall back to commit-subject bullets from the previous different-SHA release tag.
          BODY="$(gh release view "$TAG" --json body -q .body 2>/dev/null || true)"
          if [[ "$BODY" != *"What's Changed"* ]]; then
            CUR_SHA="$(git rev-parse "${TAG}^{commit}" 2>/dev/null || echo "$GITHUB_SHA")"
            RANGE_PREV=""
            while read -r cand; do
              [[ -z "$cand" || "$cand" == "$TAG" ]] && continue
              cs="$(git rev-parse "${cand}^{commit}" 2>/dev/null || true)"
              [[ -n "$cs" && "$cs" != "$CUR_SHA" ]] || continue
              if git merge-base --is-ancestor "$cs" "$CUR_SHA" 2>/dev/null; then
                RANGE_PREV="$cand"
                break
              fi
            done < <(gh release list --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName')
            NOTES_FILE="$(mktemp)"
            {
              echo "## What's Changed"
              if [[ -n "$RANGE_PREV" ]]; then
                git log --no-merges --pretty=format:'* %s' "${RANGE_PREV}..${TAG}"
                echo ""
                echo ""
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${RANGE_PREV}...${TAG}"
              else
                echo "* See repository history for this tag."
              fi
            } > "$NOTES_FILE"
            if grep -q '^\* ' "$NOTES_FILE"; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            fi
            rm -f "$NOTES_FILE"
          fi

      - name: Refresh website download links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ needs.resolve-version.outputs.channel }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN `gh release create` does not fire `release: published` for
          # other workflows. Rebuild Pages so download.data.ts sees new zip/MSI assets.
          # github-pages environment only allows deploy from develop (beta/stable are
          # blocked by environment protection rules).
          echo "Dispatching deploy-website.yml --ref develop (channel=$RELEASE_CHANNEL)"
          gh workflow run deploy-website.yml --ref develop
