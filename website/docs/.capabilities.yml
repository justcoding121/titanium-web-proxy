# Capability coverage. Source of truth for website/docs/capabilities.md and wiki/Capabilities.md.
# Each key is checked against src/Titanium.Web.Proxy.Configuration/twp.schema.json unless the row says schema: n/a.
# status: supported | partial | not supported
rows:
  - area: 'Routing'
    capability: 'Match on host, path, method, header, and query, with order and specificity'
    status: 'supported'
    keys:
      - 'routes[].match.hosts'
      - 'routes[].match.path'
      - 'routes[].match.pathKind'
      - 'routes[].order'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'Exact, segment prefix, prefix, template, and regex paths. A lower order wins; ties go to the more specific match.'
  - area: 'Routing'
    capability: 'Redirects, direct responses, and custom error pages'
    status: 'supported'
    keys:
      - 'routes[].redirect'
      - 'routes[].directResponse'
      - 'routes[].errorPages'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'Answer from the proxy without an origin, or replace the body of a generated status.'
  - area: 'Routing'
    capability: 'Weighted traffic split across clusters'
    status: 'supported'
    keys:
      - 'routes[].clusters'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'A route lists clusters with weights; a cookie or header can pin a client to one of them.'
  - area: 'Routing'
    capability: 'Request mirroring'
    status: 'supported'
    keys:
      - 'routes[].mirror'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'Sends a sampled copy of matching requests to another cluster and discards the answer. Large bodies are skipped.'
  - area: 'Routing'
    capability: 'Request and response rewrites'
    status: 'supported'
    keys:
      - 'routes[].transforms'
    docs: '/docs/configuration#route-transforms'
    docsLabel: 'Route transforms'
    note: 'Path prefix, query, and header edits on the way to the origin; response header edits on the way back.'
  - area: 'Routing'
    capability: 'Static files'
    status: 'supported'
    keys:
      - 'staticFiles'
    docs: '/docs/configuration#static-files'
    docsLabel: 'Static files'
    note: 'Serves a directory, with optional gzip and brotli.'
  - area: 'Load balancing'
    capability: 'Balancing algorithms'
    status: 'supported'
    keys:
      - 'clusters[].algorithm'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'RoundRobin, Random, LeastRequests, and LeastTime.'
  - area: 'Load balancing'
    capability: 'Weights, priority, backup destinations, and slow start'
    status: 'supported'
    keys:
      - 'clusters[].destinations[].weight'
      - 'clusters[].destinations[].priority'
      - 'clusters[].destinations[].backup'
      - 'clusters[].slowStartSeconds'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'Slow start ramps a new destination from 10 percent of its weight.'
  - area: 'Load balancing'
    capability: 'Session affinity by cookie, header, or hash'
    status: 'supported'
    keys:
      - 'clusters[].sessionAffinity'
      - 'clusters[].hashKey'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'An opaque affinity cookie, a sticky header, or consistent hashing on a chosen key.'
  - area: 'Load balancing'
    capability: 'Concurrency caps and a wait queue'
    status: 'supported'
    keys:
      - 'clusters[].destinations[].maxConcurrentRequests'
      - 'clusters[].queue'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'The queue waits briefly when every destination is at its cap.'
  - area: 'Load balancing'
    capability: 'Service discovery'
    status: 'partial'
    keys:
      - 'plus.options: discovery.*'
    schema: 'n/a'
    docs: '/docs/plus#discovery-consul-and-kubernetes'
    docsLabel: 'Plus'
    note: 'Plus watches a file, polls DNS, and queries Consul or Kubernetes EndpointSlices. Consul and Kubernetes discovery are best-effort.'
  - area: 'Health checks'
    capability: 'Passive ejection'
    status: 'supported'
    keys:
      - 'clusters[].healthCheck.passive'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'Treats 502, 503, and 504 as failures by default, caps the share ejected, and sends one trial after reactivateAfterSeconds.'
  - area: 'Health checks'
    capability: 'Active probes'
    status: 'supported'
    keys:
      - 'clusters[].healthCheck.active'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'Probes run on a background timer and only restore destinations that a probe marked unhealthy.'
  - area: 'Health checks'
    capability: 'Probe endpoints for orchestrators'
    status: 'supported'
    keys:
      - 'server.admin'
    docs: '/docs/configuration#admin-listener-server-admin'
    docsLabel: 'Admin listener'
    note: '/healthz and /readyz on a port no proxy listener shares. Readiness turns 503 on SIGTERM before the drain starts.'
  - area: 'Health checks'
    capability: 'Drain and maintenance states'
    status: 'supported'
    keys:
      - 'plus.controlPlane'
    docs: '/docs/plus#sign-in-and-roles'
    docsLabel: 'Plus'
    note: 'An operator drains a destination from the dashboard or the control-plane API (Plus).'
  - area: 'Retries and budgets'
    capability: 'Connect failover to the next destination'
    status: 'supported'
    keys:
      - 'routes[].retry.attempts'
      - 'clusters[].retry.attempts'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'Idempotent methods by default.'
  - area: 'Retries and budgets'
    capability: 'Gateway-status replay with backoff and jitter'
    status: 'supported'
    keys:
      - 'routes[].retry.statusCodes'
      - 'routes[].retry.backoffMilliseconds'
      - 'routes[].retry.jitterPercent'
      - 'routes[].retry.honorRetryAfter'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'Replays a 502, 503, or 504 onto another destination before anything reaches the client.'
  - area: 'Retries and budgets'
    capability: 'Retry budget'
    status: 'supported'
    keys:
      - 'routes[].retry.budgetPercent'
      - 'routes[].retry.budgetMinConcurrent'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'Limits replays in flight to a share of the cluster''s in-flight requests. Refused replays are counted.'
  - area: 'Retries and budgets'
    capability: 'Per-try timeout'
    status: 'supported'
    keys:
      - 'routes[].retry.perTryTimeoutMilliseconds'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'Ends a slow try as a 504 on every try but the last.'
  - area: 'Retries and budgets'
    capability: 'Retry of requests with a body'
    status: 'partial'
    keys:
      - 'routes[].retry.retryNonIdempotent'
      - 'routes[].retry.maxBufferedBodyBytes'
    docs: '/docs/protocol-support#routing-and-clusters'
    docsLabel: 'Protocol support'
    note: 'Only a body that was fully buffered is replayed. An HTTP/3 client talking to an HTTP/2 origin is not retried.'
  - area: 'Timeouts'
    capability: 'Connect, header, idle, and request timeouts'
    status: 'supported'
    keys:
      - 'server.timeouts.connectTimeOutSeconds'
      - 'server.timeouts.clientHeaderTimeoutSeconds'
      - 'server.timeouts.responseHeaderTimeoutSeconds'
      - 'server.timeouts.idleReadTimeoutSeconds'
      - 'server.timeouts.requestTimeoutSeconds'
    docs: '/docs/configuration#server-reference'
    docsLabel: 'Server reference'
    note: 'Zero turns a timeout off.'
  - area: 'Timeouts'
    capability: 'Per-route timeout and buffer overrides'
    status: 'supported'
    keys:
      - 'routes[].limits.requestTimeoutSeconds'
      - 'routes[].limits.idleTimeoutSeconds'
      - 'routes[].limits.maxBufferedBodyBytes'
    docs: '/docs/limits#reference'
    docsLabel: 'Limits'
    note: 'A route overrides the server limits for its own sessions.'
  - area: 'Timeouts'
    capability: 'Drain on shutdown'
    status: 'supported'
    keys:
      - 'server.admin.preStopDelaySeconds'
    docs: '/docs/kubernetes#graceful-rollout'
    docsLabel: 'Kubernetes'
    note: 'Keeps serving for the delay after /readyz flips, then drains in-flight requests.'
  - area: 'Rate limiting'
    capability: 'Request rate limit per key'
    status: 'supported'
    keys:
      - 'policies[].key'
      - 'policies[].algorithm'
      - 'policies[].limit'
      - 'policies[].windowSeconds'
      - 'policies[].burst'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'Fixed window or token bucket, keyed by client, forwarded client, header, cookie, or route. Answers 429 with Retry-After.'
  - area: 'Rate limiting'
    capability: 'Concurrent connection caps'
    status: 'supported'
    keys:
      - 'listeners[].maxConcurrentClients'
      - 'server.limits.maxConcurrentClients'
    docs: '/docs/limits#reference'
    docsLabel: 'Limits'
    note: 'Admission control per listener or for the whole server.'
  - area: 'Rate limiting'
    capability: 'Rate limit shared across instances'
    status: 'supported'
    keys:
      - 'policies[].scope'
      - 'policies[].fleetFailMode'
      - 'policies[].localShare'
      - 'plus.options: state.mode'
      - 'plus.options: state.redis'
    schema: 'n/a'
    docs: '/docs/configuration#fleet-rate-limit'
    docsLabel: 'Configuration'
    note: 'Leased fleet token bucket over Redis; the request path stays sync. Default scope node is unchanged.'
  - area: 'Auth methods'
    capability: 'Required header and API key checks'
    status: 'supported'
    keys:
      - 'policies[].headerName'
      - 'policies[].headerValue'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'The requireHeader and apiKey policy kinds refuse a request that lacks the header or value.'
  - area: 'Auth methods'
    capability: 'External authorization service'
    status: 'supported'
    keys:
      - 'policies[].url'
      - 'policies[].failOpen'
      - 'policies[].cacheSeconds'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'An HTTP service allows or denies each request. Redirects are not followed, and a short positive cache is optional.'
  - area: 'Auth methods'
    capability: 'OpenID Connect login'
    status: 'supported'
    keys:
      - 'policies[].issuer'
      - 'policies[].clientId'
    docs: '/docs/configuration#login-route-policy-oidc-plus'
    docsLabel: 'Login policy'
    note: 'Authorization-code flow with PKCE and an encrypted session cookie (Plus).'
  - area: 'Auth methods'
    capability: 'JWT, API key, and Basic authentication'
    status: 'supported'
    keys:
      - 'plus.options: security.*'
    schema: 'n/a'
    docs: '/docs/plus#plus-options-keys-reference'
    docsLabel: 'Plus'
    note: 'JWKS-verified JWT, API keys, and Basic users with bcrypt or PBKDF2 hashes (Plus).'
  - area: 'Auth methods'
    capability: 'Address allow and deny lists'
    status: 'supported'
    keys:
      - 'policies[].allow'
      - 'policies[].deny'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'IPv4 and IPv6 addresses and CIDR prefixes.'
  - area: 'Auth methods'
    capability: 'Kerberos and NTLM to upstream proxies'
    status: 'partial'
    keys:
      - 'server.enableWinAuth'
    docs: '/docs/configuration#code-only-callbacks'
    docsLabel: 'Code-only callbacks'
    note: 'Switch is in the file; credential and proxy-auth callbacks are set in .NET code.'
  - area: 'Auth methods'
    capability: 'Multi-user dashboard accounts'
    status: 'supported'
    keys:
      - 'plus.controlPlane.dashboardUsersFile'
    docs: '/docs/plus#sign-in-and-roles'
    docsLabel: 'Plus'
    note: 'Per-person operator and viewer accounts from a local users file (PBKDF2 hashes). Shared secrets remain as optional break-glass.'
  - area: 'Auth methods'
    capability: 'SSO beyond the OIDC login policy'
    status: 'supported'
    keys:
      - 'plus.options: controlPlane.dashboardOidc.*'
    schema: 'n/a'
    docs: '/docs/plus#dashboard-sso-openid-connect'
    docsLabel: 'Plus'
    note: 'Plus dashboard OpenID Connect (authorization code + PKCE), with group and email allow-lists for operator and viewer roles.'
  - area: 'mTLS'
    capability: 'Client certificate to the origin'
    status: 'supported'
    keys:
      - 'clusters[].httpClient.clientCertificatePath'
      - 'clusters[].httpClient.clientCertificateKeyPath'
      - 'clusters[].httpClient.clientCertificatePasswordEnv'
    docs: '/docs/configuration#upstream-tls'
    docsLabel: 'Upstream TLS'
    note: 'PEM pair or PFX per cluster. The password comes from an environment variable, never the file.'
  - area: 'mTLS'
    capability: 'Private CA, SNI override, and hostname policy for an origin'
    status: 'supported'
    keys:
      - 'clusters[].httpClient.caBundlePath'
      - 'clusters[].httpClient.serverName'
      - 'clusters[].httpClient.verifyHostname'
    docs: '/docs/configuration#upstream-tls'
    docsLabel: 'Upstream TLS'
    note: 'The bundle replaces the machine trust store for that cluster.'
  - area: 'mTLS'
    capability: 'Client certificates from callers'
    status: 'supported'
    keys:
      - 'listeners[].clientCertificateMode'
      - 'listeners[].clientCertificateCaPath'
    docs: '/docs/features#library'
    docsLabel: 'Features'
    note: 'Mode is none, allow, or require, checked against the CA file you name.'
  - area: 'TLS policy'
    capability: 'Minimum TLS version and OCSP stapling for listeners'
    status: 'supported'
    keys:
      - 'server.tls.minVersion'
      - 'server.tls.ocspStapling'
    docs: '/docs/configuration#listener-tls-policy-server-tls'
    docsLabel: 'Listener TLS policy'
    note: 'Applies to the handshake with clients; origin-facing handshakes are not changed.'
  - area: 'TLS policy'
    capability: 'Cipher suite list for listeners'
    status: 'partial'
    keys:
      - 'server.tls.cipherSuites'
    docs: '/docs/configuration#listener-tls-policy-server-tls'
    docsLabel: 'Listener TLS policy'
    note: 'Linux and macOS only. On Windows .NET has no cipher suite policy, the list is ignored, and validation prints a warning.'
  - area: 'TLS policy'
    capability: 'Automatic certificates (ACME)'
    status: 'supported'
    keys:
      - 'certificates.acmeDomain'
      - 'certificates.acmeEmail'
      - 'certificates.acmeDirectory'
    docs: '/docs/configuration#certificates-acme'
    docsLabel: 'Certificates and ACME'
    note: 'Obtains certificates from Let''s Encrypt or another ACME directory.'
  - area: 'TLS policy'
    capability: '0-RTT (early data)'
    status: 'not supported'
    keys: []
    schema: 'n/a'
    docs: '/docs/http3'
    docsLabel: 'HTTP/3'
    note: 'System.Net.Quic does not offer early data, so every QUIC connection starts with a full 1-RTT handshake.'
  - area: 'Caching'
    capability: 'Shared response cache'
    status: 'supported'
    keys:
      - 'plus.options: cache.enable'
      - 'plus.options: cache.maxBytes'
    schema: 'n/a'
    docs: '/docs/configuration#response-cache'
    docsLabel: 'Response cache'
    note: 'In-memory RFC 9111 subset with Vary, revalidation, size limits, and request collapsing (Plus).'
  - area: 'Caching'
    capability: 'Cache purge'
    status: 'supported'
    keys:
      - 'plus.controlPlane'
    docs: '/docs/configuration#response-cache'
    docsLabel: 'Response cache'
    note: 'By exact key or prefix through the control plane at /v1/cache/purge (Plus).'
  - area: 'Compression'
    capability: 'Response compression (gzip, brotli)'
    status: 'partial'
    keys:
      - 'server.responseCompression'
      - 'routes[].compression'
    docs: '/docs/configuration#response-compression-server-responsecompression'
    docsLabel: 'Response compression'
    note: 'Buffered or streaming. Runs on HTTP/1.1 and the HTTP/2-to-HTTP/1.1 bridge only, not on HTTP/2-to-HTTP/2, HTTP/3, or HTTP/1.1-to-HTTP/2.'
  - area: 'Compression'
    capability: 'Request decompression with size and ratio limits'
    status: 'supported'
    keys:
      - 'server.requestDecompression'
    docs: '/docs/configuration#request-decompression-server-requestdecompression'
    docsLabel: 'Request decompression'
    note: 'gzip and brotli request bodies on HTTP/1.x, with a decompressed-size cap and a zip-bomb ratio limit.'
  - area: 'WAF'
    capability: 'Signature screening with detect mode and anomaly scoring'
    status: 'supported'
    keys:
      - 'policies[].mode'
      - 'policies[].paranoiaLevel'
      - 'policies[].blockThreshold'
    docs: '/docs/configuration#request-screening-route-policy-waf-plus'
    docsLabel: 'Request screening'
    note: 'Built-in rule pack, per-route override, and an operator deny-list (Plus).'
  - area: 'WAF'
    capability: 'Custom rules'
    status: 'supported'
    keys:
      - 'plus.options: waf.rulesFile'
    schema: 'n/a'
    docs: '/docs/plus#custom-rules-waf-rulesfile'
    docsLabel: 'Plus'
    note: 'Your own YAML rules next to the built-in pack.'
  - area: 'Routing'
    capability: 'Geo country allow and deny'
    status: 'supported'
    keys:
      - 'policies[].kind'
      - 'policies[].allow'
      - 'policies[].deny'
      - 'server.geoIpDatabasePath'
    docs: '/docs/configuration#geo-route-policy-geo'
    docsLabel: 'Geo route policy'
    note: 'Country codes from an operator-supplied MaxMind DB. Unknown countries fail closed on allow lists and pass on deny-only lists.'
  - area: 'Observability'
    capability: 'Prometheus metrics'
    status: 'supported'
    keys:
      - 'server.metrics'
    docs: '/docs/configuration#prometheus-metrics-server-metrics'
    docsLabel: 'Prometheus metrics'
    note: 'Text exposition of the core meter with bounded label sets.'
  - area: 'Observability'
    capability: 'Traces and metrics export over OTLP'
    status: 'supported'
    keys:
      - 'server.telemetry'
    docs: '/docs/configuration#traces-and-metrics-export-server-telemetry'
    docsLabel: 'Telemetry'
    note: 'W3C trace context through the proxy. The OTEL_* environment variables set the defaults.'
  - area: 'Observability'
    capability: 'Access log'
    status: 'supported'
    keys:
      - 'server.accessLog'
      - 'server.requestId'
    docs: '/docs/configuration#access-log-server-accesslog'
    docsLabel: 'Access log'
    note: 'Opt-in NDJSON written after each response, with sampling. Bodies are never buffered for it.'
  - area: 'Observability'
    capability: 'Read-only dashboard'
    status: 'supported'
    keys:
      - 'plus.controlPlane.dashboardPort'
    docs: '/docs/plus#dashboard'
    docsLabel: 'Plus'
    note: 'Overview, routes and clusters, health, config, certificates, and audit views (Plus).'
  - area: 'Observability'
    capability: 'Dashboard route editing'
    status: 'not supported'
    keys: []
    schema: 'n/a'
    docs: '/docs/plus#dashboard'
    docsLabel: 'Plus'
    note: 'The dashboard shows routes read-only, with Drain and Healthy buttons. Change routes in the file, or push a snapshot through the control plane.'
  - area: 'Kubernetes'
    capability: 'Helm chart for the proxy'
    status: 'supported'
    keys:
      - 'deploy/helm/titanium'
    schema: 'n/a'
    docs: '/docs/kubernetes#helm-chart'
    docsLabel: 'Kubernetes'
    note: 'Config, probes, a disruption budget, autoscaling, ServiceMonitor, and a sample NetworkPolicy.'
  - area: 'Kubernetes'
    capability: 'Hardened container image'
    status: 'supported'
    keys:
      - 'ghcr.io/justcoding121/titanium-web-proxy'
    schema: 'n/a'
    docs: '/docs/kubernetes#container-image'
    docsLabel: 'Kubernetes'
    note: 'Chiseled base, non-root, read-only root filesystem, linux/amd64 and linux/arm64. It has no libmsquic, so HTTP/3 is off.'
  - area: 'Kubernetes'
    capability: 'ConfigMap and Secret reload'
    status: 'supported'
    keys:
      - 'titanium run --watch'
    schema: 'n/a'
    docs: '/docs/kubernetes#config-and-secret-reload'
    docsLabel: 'Kubernetes'
    note: 'Follows the atomic ..data swap and reloads once. A reload that fails validation keeps the running config.'
  - area: 'Kubernetes'
    capability: 'Gateway API HTTPRoute'
    status: 'partial'
    keys:
      - 'GatewayClass titanium'
    schema: 'n/a'
    docs: '/docs/gateway-api#supported-resources-and-fields'
    docsLabel: 'Gateway API'
    note: 'HTTP core of the standard channel. A rule the controller cannot honor answers 500 and says why in the route status.'
  - area: 'Kubernetes'
    capability: 'Ingress'
    status: 'supported'
    keys:
      - 'networking.k8s.io/v1 Ingress'
    schema: 'n/a'
    docs: '/docs/ingress'
    docsLabel: 'Ingress'
    note: 'Served by the same controller, with titanium.io annotations for rewrites and canary.'
  - area: 'Kubernetes'
    capability: 'Gateway API TLSRoute, TCPRoute, UDPRoute, and BackendTLSPolicy'
    status: 'not supported'
    keys: []
    schema: 'n/a'
    docs: '/docs/gateway-api#what-is-not-supported'
    docsLabel: 'Gateway API'
    note: 'The controller does not watch them; only HTTPRoute is served. GRPCRoute is not watched either.'
  - area: 'Kubernetes'
    capability: 'Hot binary upgrade'
    status: 'not supported'
    keys: []
    schema: 'n/a'
    docs: '/docs/kubernetes#graceful-rollout'
    docsLabel: 'Kubernetes'
    note: 'titanium update replaces the executable and the process restarts. Roll pods behind the readiness drain instead.'
  - area: 'Protocols'
    capability: 'HTTP/1.1 and HTTP/2'
    status: 'supported'
    keys:
      - 'server.enableHttp2'
      - 'listeners[].enableHttp2'
    docs: '/docs/protocol-support'
    docsLabel: 'Protocol support'
    note: 'HTTP/2 is on by default.'
  - area: 'Protocols'
    capability: 'HTTP/3 over QUIC'
    status: 'supported'
    keys:
      - 'server.enableHttp3'
      - 'listeners[].enableHttp3'
    docs: '/docs/http3'
    docsLabel: 'HTTP/3'
    note: 'On when QUIC is available. The container image has no libmsquic.'
  - area: 'Protocols'
    capability: 'Bridging between HTTP versions'
    status: 'supported'
    keys:
      - 'server.originHttpVersionPolicy'
    docs: '/docs/protocol-support#protocol-bridges'
    docsLabel: 'Protocol support'
    note: 'HTTP/1.1, HTTP/2, and HTTP/3 clients reach origins that speak another version. Not every bridge covers every feature.'
  - area: 'Protocols'
    capability: 'WebSocket over HTTP/1.1 and HTTP/2'
    status: 'supported'
    keys:
      - 'server.enableRfc8441'
    docs: '/docs/protocol-support#connections-and-framing-high-level'
    docsLabel: 'Protocol support'
    note: 'HTTP/1.1 upgrade always; RFC 8441 extended CONNECT when enabled.'
  - area: 'Protocols'
    capability: 'gRPC-Web to native gRPC'
    status: 'supported'
    keys:
      - 'routes[].grpcWeb'
    docs: '/docs/configuration#grpc-web-route-grpcweb'
    docsLabel: 'gRPC-Web'
    note: 'Binary unary and server-streaming calls to an HTTP/2 origin.'
  - area: 'Protocols'
    capability: 'gRPC and JSON transcoding'
    status: 'supported'
    keys:
      - 'plus.options: grpc.transcode.enabled'
    schema: 'n/a'
    docs: '/docs/grpc-json-transcoding'
    docsLabel: 'gRPC-JSON transcoding'
    note: 'REST and JSON to gRPC through a descriptor set (Plus).'
  - area: 'Protocols'
    capability: 'PROXY protocol from a load balancer'
    status: 'supported'
    keys:
      - 'listeners[].acceptProxyProtocol'
      - 'listeners[].trustedProxyProtocolSources'
    docs: '/docs/configuration#routes-clusters'
    docsLabel: 'Configuration'
    note: 'Reads the preamble only from the sources you trust.'
  - area: 'Protocols'
    capability: 'CONNECT-UDP relay (MASQUE)'
    status: 'supported'
    keys:
      - 'listeners[].masque'
    docs: '/docs/configuration#listeners'
    docsLabel: 'Listeners'
    note: 'Opt-in listener type. It relays datagrams opaquely, with authentication, tunnel caps, and a private-target block.'
  - area: 'Protocols'
    capability: 'WebSocket over HTTP/3'
    status: 'supported'
    keys:
      - 'server.enableRfc8441'
    docs: '/docs/protocol-support'
    docsLabel: 'Protocol support'
    note: 'RFC 9220. HTTP/3 clients reach HTTP/1.1, HTTP/2 and HTTP/3 origins.'
  - area: 'Protocols'
    capability: 'Explicit-proxy h2c Upgrade'
    status: 'not supported'
    keys: []
    schema: 'n/a'
    docs: '/docs/protocol-support'
    docsLabel: 'Protocol support'
    note: 'Upgrade: h2c is not handled. Cleartext HTTP/2 works with prior knowledge only.'
  - area: 'Protocols'
    capability: 'Decrypting QUIC inside CONNECT-UDP'
    status: 'not supported'
    keys: []
    schema: 'n/a'
    docs: '/docs/configuration#listeners'
    docsLabel: 'Listeners'
    note: 'The relay forwards each datagram as it came, so the payload stays encrypted end to end. There is no switch to decrypt it.'
  - area: 'L4'
    capability: 'TCP passthrough with SNI routing'
    status: 'supported'
    keys:
      - 'listeners[].passthrough'
      - 'listeners[].sniRoutes'
      - 'listeners[].sniDefaultClusterId'
    docs: '/docs/configuration#tcp-passthrough-with-sni'
    docsLabel: 'TCP passthrough'
    note: 'Reads the ClientHello, picks a cluster by server name, and forwards the bytes unchanged. Balancing, failover, and an idle timeout apply.'
  - area: 'L4'
    capability: 'UDP relay'
    status: 'supported'
    keys:
      - 'listeners[].type'
      - 'listeners[].maxSessions'
      - 'listeners[].maxDatagramsPerSecondPerClient'
    docs: '/docs/configuration#udp-listeners'
    docsLabel: 'UDP listeners'
    note: 'One upstream per client endpoint, with session and rate caps.'
  - area: 'L4'
    capability: 'PROXY protocol v2 to TCP origins'
    status: 'supported'
    keys:
      - 'listeners[].sendProxyProtocol'
      - 'clusters[].sendProxyProtocol'
    docs: '/docs/configuration#proxy-protocol-to-tcp-origins-clusters-sendproxyprotocol'
    docsLabel: 'PROXY protocol'
    note: 'A cluster setting replaces the listener setting. TCP passthrough only.'
  - area: 'L4'
    capability: 'SOCKS and transparent listeners'
    status: 'supported'
    keys:
      - 'listeners[].type'
    docs: '/docs/configuration#listeners'
    docsLabel: 'Listeners'
    note: 'Explicit, transparent, SOCKS, QUIC, MASQUE, and UDP listener types.'
  - area: 'Extensibility'
    capability: 'Per-route .NET plugins'
    status: 'supported'
    keys:
      - 'plugins[].assembly'
      - 'plugins[].failMode'
      - 'plugins[].timeoutMs'
      - 'routes[].middleware'
    docs: '/docs/plugins'
    docsLabel: 'Plugins'
    note: 'Each plugin loads into its own collectible context, behind a timeout and an exception wall.'
  - area: 'Extensibility'
    capability: 'Embedding the engine in .NET'
    status: 'supported'
    keys:
      - 'ProxyServer events'
    schema: 'n/a'
    docs: '/docs/library'
    docsLabel: 'Library'
    note: 'The same engine with event handlers, synthetic responses, and stream hooks.'
  - area: 'Extensibility'
    capability: 'Programmatic route and cluster swap'
    status: 'supported'
    keys:
      - 'PUT /v1/snapshot'
    schema: 'n/a'
    docs: '/docs/configuration#graceful-reload'
    docsLabel: 'Graceful reload'
    note: 'Plus control-plane call. File reload needs no Plus.'
  - area: 'Extensibility'
    capability: 'Managed fleet control plane'
    status: 'supported'
    keys:
      - 'plus.options: manager.url'
      - 'titanium-manager'
    schema: 'n/a'
    docs: '/docs/manager'
    docsLabel: 'Manager'
    note: 'titanium-manager publishes YAML revisions; Plus agents long-poll, ack or nack, and keep a last-known-good file. Not an xDS client.'
  - area: 'Extensibility'
    capability: 'xDS control plane'
    status: 'not supported'
    keys: []
    schema: 'n/a'
    docs: '/docs/manager'
    docsLabel: 'Manager'
    note: 'There is no xDS client. Use titanium-manager (or the file, titanium reload, the Plus snapshot call, or the Kubernetes controllers) instead.'
  - area: 'Extensibility'
    capability: 'Lua scripting'
    status: 'supported'
    keys:
      - 'plugins[].kind'
      - 'plugins[].file'
      - 'plugins[].settings'
      - 'plugins[].bodyMode'
      - 'routes[].middleware'
    docs: '/docs/scripting#lua-plugins'
    docsLabel: 'Scripting'
    note: 'Lua 5.4 in sandboxed states, named in a route middleware list. A file runs the request-headers and buffered request-body phases; every phase runs when a .NET host sets the script pipeline. Needs the lua54 native.'
  - area: 'Extensibility'
    capability: 'Lua sandbox, limits, and failure mode'
    status: 'supported'
    keys:
      - 'plugins[].failMode'
      - 'plugins[].timeoutMs'
      - 'plugins[].limits.memoryMb'
      - 'plugins[].limits.maxInstructions'
      - 'plugins[].limits.epochDeadlineMs'
      - 'plugins[].limits.poolSize'
    docs: '/docs/scripting#lua-limits'
    docsLabel: 'Scripting'
    note: 'No io, require, load, or bytecode. Memory, instruction, and CPU-time limits hold inside the engine even when the script catches errors. A failed call answers 503, or passes the request with failMode open.'
  - area: 'Extensibility'
    capability: 'Lua libraries, shared dictionaries, and JWT verification'
    status: 'supported'
    keys:
      - 'plugins[].settings'
      - 'plugins[].limits.sharedDataBytes'
    docs: '/docs/scripting#libraries'
    docsLabel: 'Scripting'
    note: 'json, base64, hex, url, crypto, linear-time regex, cidr, uuid, timers, metrics, process-wide shared dictionaries with TTL and eviction, and JWKS-based jwt.verify.'
  - area: 'Extensibility'
    capability: 'Lua HTTP callouts with an allow-list'
    status: 'supported'
    keys:
      - 'plugins[].calloutHosts'
      - 'plugins[].limits.calloutConcurrency'
      - 'plugins[].limits.bufferedBodyBytes'
    docs: '/docs/scripting#lua-callouts'
    docsLabel: 'Scripting'
    note: 'http.call reaches only the hosts you list. No system proxy, redirects, or cookies. Refusals and failures come back as nil and an error.'
  - area: 'Extensibility'
    capability: 'Lua L4 stream phases'
    status: 'supported'
    keys:
      - 'listeners[].streamFilters'
    docs: '/docs/scripting#l4-phases'
    docsLabel: 'Scripting'
    note: 'on_connect, on_data, and on_close see raw TCP connections. Name the plugin in listeners[].streamFilters on a passthrough listener, or set StreamFilters from a .NET host.'
  - area: 'Extensibility'
    capability: 'Script pipeline and chained scripts'
    status: 'supported'
    keys:
      - 'scriptPipeline'
    docs: '/docs/scripting#several-scripts-on-one-pipeline'
    docsLabel: 'Scripting'
    note: 'Every HTTP phase, upstream choice, and several Lua or Wasm hosts in order. Set scriptPipeline in twp.yaml, or ScriptPipeline from a .NET host. Route middleware still runs the request-headers phase alone.'
  - area: 'Extensibility'
    capability: 'WASM proxy-wasm modules'
    status: 'supported'
    keys:
      - 'plugins[].kind'
      - 'plugins[].file'
      - 'plugins[].vmId'
      - 'plugins[].settings'
      - 'plugins[].bodyMode'
      - 'routes[].middleware'
    docs: '/docs/scripting#webassembly-plugins'
    docsLabel: 'Scripting'
    note: 'proxy-wasm ABI 0.1.0, 0.2.0, and 0.2.1 on Wasmtime, with the Envoy attribute set and a WASI subset. A module is built and started before it replaces the running one. Needs the wasmtime native.'
  - area: 'Extensibility'
    capability: 'WASM memory, fuel, and deadline limits'
    status: 'supported'
    keys:
      - 'plugins[].failMode'
      - 'plugins[].timeoutMs'
      - 'plugins[].limits.memoryMb'
      - 'plugins[].limits.fuel'
      - 'plugins[].limits.epochDeadlineMs'
      - 'plugins[].limits.poolSize'
    docs: '/docs/scripting#webassembly-limits'
    docsLabel: 'Scripting'
    note: 'A VM that traps is discarded and rebuilt off the request path. Signal-based traps are off, so Wasmtime does not fight the .NET runtime.'
  - area: 'Extensibility'
    capability: 'WASM HTTP and gRPC callouts with an allow-list'
    status: 'supported'
    keys:
      - 'plugins[].calloutHosts'
      - 'plugins[].limits.calloutConcurrency'
      - 'plugins[].limits.bufferedBodyBytes'
    docs: '/docs/scripting#host-functions'
    docsLabel: 'Scripting'
    note: 'proxy_http_call, proxy_grpc_call, and gRPC streams reach only the hosts you list. A request paused on a callout resumes when the guest continues it.'
  - area: 'Extensibility'
    capability: 'WASM shared data, queues, ticks, and metrics'
    status: 'supported'
    keys:
      - 'plugins[].vmId'
      - 'plugins[].limits.sharedDataBytes'
      - 'plugins[].limits.queueBytes'
    docs: '/docs/scripting#sharing-a-vm-with-vmid'
    docsLabel: 'Scripting'
    note: 'Plugins with the same vmId and module share VMs, shared data with CAS, and queues. Guest metrics appear as three fixed instruments, so a guest cannot create new ones.'
  - area: 'Extensibility'
    capability: 'Scripting natives per platform'
    status: 'supported'
    keys:
      - 'titanium scripting-deps status'
    schema: 'n/a'
    docs: '/docs/scripting#per-rid-matrix'
    docsLabel: 'Scripting'
    note: 'Lua and Wasmtime natives are pinned per runtime identifier and checked by SHA-256. A computer without one keeps running; only a route that names that script kind fails to load. win-arm64 has none.'
  - area: 'Extensibility'
    capability: 'OpenResty, Kong PDK, and APISIX Lua APIs'
    status: 'not supported'
    keys: []
    schema: 'n/a'
    docs: '/docs/scripting#parity-checklist'
    docsLabel: 'Scripting'
    note: 'There is no ngx API, Kong PDK, APISIX plugin API, LuaJIT, FFI, cosocket, or require. Lua here is the 5.4 language with the libraries on the Scripting page.'
