# Source: titanium-gateway/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rel-titanium-gateway-controller
  labels:
    helm.sh/chart: titanium-gateway-1.0.1
    app.kubernetes.io/part-of: titanium-gateway
    app.kubernetes.io/version: "8.0.1"
    app.kubernetes.io/managed-by: Helm
rules:
  # Leader election.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["rel-titanium-gateway-controller"]
    verbs: ["get", "update", "patch"]
  # What the data plane reads. Both objects are created by this chart, so the controller only updates them.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["rel-titanium-gateway-data"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["rel-titanium-gateway-data-tls"]
    verbs: ["get", "update", "patch"]
  # A mounted ConfigMap reaches a pod after the next kubelet sync, up to a minute. The controller annotates the
  # data-plane pods after a write so the kubelet refreshes the volume at once. Pod names are not known ahead.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["patch"]
  # Listeners bind at start, so a change of listener set rolls the data plane.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["rel-titanium-gateway-data"]
    verbs: ["get", "patch"]
