# Source: titanium-gateway/templates/controller-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-titanium-gateway-controller
  labels:
    helm.sh/chart: titanium-gateway-1.0.1
    app.kubernetes.io/part-of: titanium-gateway
    app.kubernetes.io/version: "8.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: titanium-gateway
    app.kubernetes.io/instance: rel
    app.kubernetes.io/component: controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: titanium-gateway
      app.kubernetes.io/instance: rel
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        helm.sh/chart: titanium-gateway-1.0.1
        app.kubernetes.io/part-of: titanium-gateway
        app.kubernetes.io/version: "8.0.1"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: titanium-gateway
        app.kubernetes.io/instance: rel
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: rel-titanium-gateway-controller
      automountServiceAccountToken: true
      # Service-link variables (TITANIUM_GATEWAY_DATA_PORT and friends) would share the TITANIUM_GATEWAY_ option prefix.
      enableServiceLinks: false
      securityContext:
        runAsGroup: 1654
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "ghcr.io/justcoding121/titanium-gateway:8.0.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TITANIUM_GATEWAY_CONTROLLER_NAME
              value: "titaniumproxy.com/gateway-controller"
            - name: TITANIUM_GATEWAY_DATA_PLANE_NAMESPACE
              value: "gateway-system"
            - name: TITANIUM_GATEWAY_DATA_PLANE_SERVICE
              value: "rel-titanium-gateway-data"
            - name: TITANIUM_GATEWAY_DATA_PLANE_DEPLOYMENT
              value: "rel-titanium-gateway-data"
            - name: TITANIUM_GATEWAY_CONFIG_MAP
              value: "rel-titanium-gateway-data"
            - name: TITANIUM_GATEWAY_TLS_SECRET
              value: "rel-titanium-gateway-data-tls"
            - name: TITANIUM_GATEWAY_LEASE_NAME
              value: "rel-titanium-gateway-controller"
            - name: TITANIUM_GATEWAY_PORT_MAP
              value: "80=8080,443=8443"
            - name: TITANIUM_GATEWAY_ADMIN_PORT
              value: "9901"
            - name: TITANIUM_GATEWAY_HEALTH_PORT
              value: "8081"
            - name: TITANIUM_GATEWAY_INGRESS_CONTROLLER_NAME
              value: "titanium.io/ingress-controller"
            - name: TITANIUM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rel-titanium-gateway-admin
                  key: admin-token
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              ephemeral-storage: 1Gi
              memory: 384Mi
            requests:
              cpu: 50m
              ephemeral-storage: 128Mi
              memory: 96Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
# Source: titanium-gateway/templates/dataplane.yaml
# The data plane: the Titanium proxy image running `titanium run --config /etc/titanium/twp.yaml --watch`. The controller
# owns the ConfigMap and the Secret mounted here; the pods reload routes, clusters and certificates when they change.
# Listeners are bound at start, so the controller rolls this Deployment when the set of listeners changes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-titanium-gateway-data
  labels:
    helm.sh/chart: titanium-gateway-1.0.1
    app.kubernetes.io/part-of: titanium-gateway
    app.kubernetes.io/version: "8.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: titanium-gateway
    app.kubernetes.io/instance: rel
    app.kubernetes.io/component: data-plane
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: titanium-gateway
      app.kubernetes.io/instance: rel
      app.kubernetes.io/component: data-plane
  template:
    metadata:
      labels:
        helm.sh/chart: titanium-gateway-1.0.1
        app.kubernetes.io/part-of: titanium-gateway
        app.kubernetes.io/version: "8.0.1"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: titanium-gateway
        app.kubernetes.io/instance: rel
        app.kubernetes.io/component: data-plane
    spec:
      serviceAccountName: rel-titanium-gateway-data
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1654
        runAsGroup: 1654
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: titanium
          image: "ghcr.io/justcoding121/titanium-web-proxy:8.0.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          # The image ENTRYPOINT is `titanium run --config /etc/titanium/twp.yaml`; this adds --watch.
          args:
            - --watch
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: admin
              containerPort: 9901
              protocol: TCP
          env:
            - name: TITANIUM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rel-titanium-gateway-admin
                  key: admin-token
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            limits:
              ephemeral-storage: 1Gi
              memory: 512Mi
            requests:
              cpu: 100m
              ephemeral-storage: 128Mi
              memory: 128Mi
          volumeMounts:
            # One directory holds twp.yaml and the generated certificates, so a change to either swaps the ..data
            # symlink that --watch follows. Mount the directory, never single files: that would hide the swap.
            - name: config
              mountPath: /etc/titanium
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: rel-titanium-gateway-data
              - secret:
                  name: rel-titanium-gateway-data-tls
                  optional: true
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
