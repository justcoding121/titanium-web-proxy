# Used by the Gateway API conformance workflow: images built and loaded into kind, no LoadBalancer.
controller:
  replicaCount: 2
  image:
    repository: titanium-gateway
    tag: ci
    pullPolicy: Never
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
dataPlane:
  replicaCount: 2
  image:
    repository: titanium-web-proxy
    tag: ci
    pullPolicy: Never
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 96Mi

