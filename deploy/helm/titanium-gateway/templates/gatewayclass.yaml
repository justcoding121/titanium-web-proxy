{{- if .Values.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels:
    {{- include "titanium-gateway.commonLabels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.controller.controllerName }}
  {{- with .Values.gatewayClass.description }}
  description: {{ . | quote }}
  {{- end }}
{{- end }}
