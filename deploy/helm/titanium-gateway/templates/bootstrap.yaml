{{- $data := include "titanium-gateway.dataName" . }}
{{- $tls := include "titanium-gateway.tlsSecretName" . }}
{{- $adminName := include "titanium-gateway.adminSecretName" . }}
{{- /*
  The controller owns twp.yaml (server-side apply, field manager titanium-gateway).
  Always render the ConfigMap. Omitting it once it exists makes Helm delete the live
  object. Copy live twp.yaml into the rendered manifest: Helm replaces that key on
  upgrade when the chart emits the bootstrap default, even when the default text
  did not change. resource-policy keep only stops uninstall from deleting it.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $data }}
  labels:
    {{- include "titanium-gateway.commonLabels" . | nindent 4 }}
    {{- include "titanium-gateway.dataSelectorLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
data:
  twp.yaml: |
    {{- $body := .Values.dataPlane.bootstrapConfig }}
    {{- $live := lookup "v1" "ConfigMap" .Release.Namespace $data }}
    {{- if and $live $live.data (hasKey $live.data "twp.yaml") }}
    {{- $body = index $live.data "twp.yaml" }}
    {{- end }}
    {{- $body | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tls }}
  labels:
    {{- include "titanium-gateway.commonLabels" . | nindent 4 }}
    {{- include "titanium-gateway.dataSelectorLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if not .Values.dataPlane.admin.token.existingSecret }}
{{- /* Keep the token across `helm upgrade`; generate it only the first time. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $adminName }}
{{- /* values.dataPlane.admin.token.value pins CI snapshots; live installs still get a random token. */}}
{{- $token := .Values.dataPlane.admin.token.value | default (randAlphaNum 40) }}
{{- if and $existing $existing.data }}
{{- $token = (get $existing.data .Values.dataPlane.admin.token.key) | b64dec }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminName }}
  labels:
    {{- include "titanium-gateway.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.dataPlane.admin.token.key }}: {{ $token | b64enc | quote }}
{{- end }}
