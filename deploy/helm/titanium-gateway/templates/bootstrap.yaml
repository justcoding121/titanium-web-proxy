{{- $data := include "titanium-gateway.dataName" . }}
{{- $tls := include "titanium-gateway.tlsSecretName" . }}
{{- $adminName := include "titanium-gateway.adminSecretName" . }}
{{- /*
  The controller owns the data of the ConfigMap and the Secret below (server-side apply, field manager
  titanium-gateway). Always render them with `helm.sh/resource-policy: keep` so a later
  `helm upgrade` neither deletes them nor resets controller-written live data under Helm's
  three-way merge. Do not gate on lookup — omitting the resource when it already exists
  causes Helm to delete the live object on upgrade from charts that managed it.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $data }}
  labels:
    {{- include "titanium-gateway.commonLabels" . | nindent 4 }}
    {{- include "titanium-gateway.dataSelectorLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
data:
  twp.yaml: |
    {{- .Values.dataPlane.bootstrapConfig | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tls }}
  labels:
    {{- include "titanium-gateway.commonLabels" . | nindent 4 }}
    {{- include "titanium-gateway.dataSelectorLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if not .Values.dataPlane.admin.token.existingSecret }}
{{- /* Keep the token across `helm upgrade`; generate it only the first time. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $adminName }}
{{- /* values.dataPlane.admin.token.value pins CI snapshots; live installs still get a random token. */}}
{{- $token := .Values.dataPlane.admin.token.value | default (randAlphaNum 40) }}
{{- if and $existing $existing.data }}
{{- $token = (get $existing.data .Values.dataPlane.admin.token.key) | b64dec }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $adminName }}
  labels:
    {{- include "titanium-gateway.commonLabels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.dataPlane.admin.token.key }}: {{ $token | b64enc | quote }}
{{- end }}
