apiVersion: v1
kind: ConfigMap
metadata:
  name: rel-titanium
  labels:
    helm.sh/chart: titanium-1.0.2
    app.kubernetes.io/name: titanium
    app.kubernetes.io/instance: rel
    app.kubernetes.io/version: "8.0.2"
