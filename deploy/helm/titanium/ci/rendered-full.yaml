data:
  twp.yaml: |
    clusters:
    - destinations:
      - address: backend.default.svc.cluster.local
        id: backend
        port: 80
      id: web
    listeners:
    - decryptSsl: false
      host: 0.0.0.0
      port: 8080
    plus:
      controlPlane:
        host: 0.0.0.0
        port: 9080
        sharedSecretEnv: TITANIUM_CONTROL_SECRET
        tls:
          certificatePath: /etc/titanium-plus-tls/tls.crt
          keyPath: /etc/titanium-plus-tls/tls.key
      enabled: true
      options:
        security.apiKeysFile: /etc/titanium-secret/api-keys
    routes:
    - clusterId: web
      id: all
      match:
        path: /
    schemaVersion: "7.1"
    server:
      admin:
        authTokenEnv: TITANIUM_ADMIN_TOKEN
        enabled: true
        host: 0.0.0.0
        port: 9901
        preStopDelaySeconds: 10
        readiness:
          requireHealthyClusters: true
