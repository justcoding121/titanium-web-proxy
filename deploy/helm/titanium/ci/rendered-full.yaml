# Source: titanium/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-titanium
  labels:
    helm.sh/chart: titanium-1.0.2
    app.kubernetes.io/name: titanium
    app.kubernetes.io/instance: rel
    app.kubernetes.io/version: "8.0.2"
    app.kubernetes.io/managed-by: Helm
spec:
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: titanium
      app.kubernetes.io/instance: rel
  template:
    metadata:
      annotations:
        checksum/config: d0262af266cfb1b8f48db3e1dc81fe938dccf3b7ecc54b43a93b5a675b66de3e
      labels:
        helm.sh/chart: titanium-1.0.2
        app.kubernetes.io/name: titanium
        app.kubernetes.io/instance: rel
        app.kubernetes.io/version: "8.0.2"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: rel-titanium
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 1654
        runAsGroup: 1654
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: titanium
          image: "ghcr.io/justcoding121/titanium-web-proxy:8.0.2"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          # The image ENTRYPOINT is `titanium run --config /etc/titanium/twp.yaml`; this CMD adds --watch.
          args:
            - --watch
          ports:
            - name: proxy
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 9901
              protocol: TCP
            - name: control-plane
              containerPort: 9080
              protocol: TCP
          env:
            - name: TITANIUM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rel-titanium-admin
                  key: admin-token
            - name: TITANIUM_CONTROL_SECRET
              valueFrom:
                secretKeyRef:
                  name: titanium-control-plane
                  key: shared-secret
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            limits:
              ephemeral-storage: 1Gi
              memory: 512Mi
            requests:
              cpu: 100m
              ephemeral-storage: 128Mi
              memory: 128Mi
          volumeMounts:
            # Mount the whole directory: a ConfigMap update swaps the ..data symlink, which --watch follows.
            - name: config
              mountPath: /etc/titanium
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: plus-tls
              mountPath: /etc/titanium-plus-tls
              readOnly: true
            - mountPath: /etc/titanium-secret
              name: plus-secret
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rel-titanium
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: plus-tls
          secret:
            secretName: titanium-control-plane-tls
        - name: plus-secret
          secret:
            secretName: titanium-plus
