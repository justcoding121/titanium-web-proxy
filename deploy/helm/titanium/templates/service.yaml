apiVersion: v1
kind: Service
metadata:
  name: {{ include "titanium.fullname" . }}
  labels:
    {{- include "titanium.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.extra }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  ports:
    {{- range .Values.ports }}
    - name: {{ .name }}
      port: {{ .servicePort }}
      targetPort: {{ .name }}
      protocol: {{ default "TCP" .protocol }}
    {{- end }}
  selector:
    {{- include "titanium.selectorLabels" . | nindent 4 }}
{{- if include "titanium.adminServiceEnabled" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "titanium.fullname" . }}-admin
  labels:
    {{- include "titanium.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
  {{- with .Values.admin.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: admin
      port: {{ int .Values.admin.service.port }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "titanium.selectorLabels" . | nindent 4 }}
{{- end }}
