# Source: titanium-manager/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rel-titanium-manager
  labels:
    helm.sh/chart: titanium-manager-0.1.0
    app.kubernetes.io/name: titanium-manager
    app.kubernetes.io/instance: rel
    app.kubernetes.io/version: "7.0.27"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: titanium-manager
      app.kubernetes.io/instance: rel
  template:
    metadata:
      labels:
        helm.sh/chart: titanium-manager-0.1.0
        app.kubernetes.io/name: titanium-manager
        app.kubernetes.io/instance: rel
        app.kubernetes.io/version: "7.0.27"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: rel-titanium-manager
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1654
        runAsGroup: 1654
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "ghcr.io/justcoding121/titanium-manager:7.0.27"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          # Image ENTRYPOINT already sets --listen and --db; admin token comes from the env.
          ports:
            - name: http
              containerPort: 7700
              protocol: TCP
          env:
            - name: TITANIUM_MANAGER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rel-titanium-manager-admin
                  key: admin-token
          startupProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/titanium-manager
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rel-titanium-manager
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
