{{- if not .Values.admin.token.existingSecret }}
{{- $name := include "titanium-manager.adminSecretName" . }}
{{- /* Keep the token across `helm upgrade`; generate it only the first time. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- /* values.admin.token.value pins CI snapshots; live installs still get a random token. */}}
{{- $token := .Values.admin.token.value | default (randAlphaNum 40) }}
{{- if and $existing $existing.data }}
{{- $token = (get $existing.data .Values.admin.token.key) | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "titanium-manager.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.admin.token.key }}: {{ $token | b64enc | quote }}
{{- end }}
