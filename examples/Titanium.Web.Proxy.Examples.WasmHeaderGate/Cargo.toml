[package]
name = "header-gate"
version = "0.1.0"
edition = "2021"
description = "proxy-wasm header gate for Titanium Web Proxy: the Rust version of Titanium.Web.Proxy.Examples.RoutePlugin"
license = "MIT"
publish = false

[lib]
# A proxy-wasm module is a WebAssembly library that exports the ABI functions; cdylib builds it as one.
crate-type = ["cdylib"]

[dependencies]
proxy-wasm = "0.2"
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
